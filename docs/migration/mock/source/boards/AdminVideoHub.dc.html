<div class="p-root" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <div class="c-side"><dc-import name="AdminNav" active="videos" hint-size="100%,1240px"></dc-import></div>
  <main class="c-main">
    <a href="AdminVideosHub.dc.html" class="il t-sm muted"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>作品一覧</a>
    <div class="wrap-row" style="gap: 16px; justify-content: space-between; margin-top: 8px; align-items: flex-end;">
      <div class="stack" style="gap: 6px;">
        <h1 class="t-h1">空白合作</h1>
        <span class="meta-i"><span class="il"><i class="fa-solid fa-user-group" aria-hidden="true"></i>空白合作チーム</span><span><i class="fa-brands fa-x-twitter" aria-hidden="true"></i>vIXyOepPI395671</span><span><i class="fa-solid fa-calendar-days" aria-hidden="true"></i>PVSF2026Sp</span><span class="t-num"><i class="fa-regular fa-clock" aria-hidden="true"></i>03.28 20:48</span></span>
      </div>
      <span class="st"><span class="dot warn"></span>審査待ち</span>
    </div>
    <div class="hub-bar">
      <nav class="subnav" aria-label="作品詳細(管理)" role="tablist"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><a href="#" class="il" role="tab" aria-current="{{t.cur}}" aria-selected="{{t.sel}}" onClick="{{t.pick}}"><i class="{{t.icon}}" aria-hidden="true"></i>{{t.label}}<span class="t-num muted">{{t.n}}</span></a></sc-for></nav>

    </div>
    <div class="hub-body">
      <sc-if value="{{t_0}}" hint-placeholder-val="{{true}}"><dc-import name="AdminVideo" hint-size="100%,1500px"></dc-import></sc-if>
      <sc-if value="{{t_1}}" hint-placeholder-val="{{false}}"><dc-import name="AdminVideoMembers" hint-size="100%,1300px"></dc-import></sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"tab":{"editor":"enum","options":["AdminVideo", "AdminVideoMembers"],"default":"AdminVideo"},"$preview":{"width":1440,"height":1540}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: null }; }
  renderVals() {
    const T = [["AdminVideo", "管理詳細", "fa-solid fa-gavel", ""], ["AdminVideoMembers", "メンバー", "fa-solid fa-user-group", ""]];
    const cur = this.state.tab || this.props.tab || T[0][0];
    const r = { theme: this.props.theme ?? 'dark',
      tabs: T.map(([id, label, icon, n]) => ({ label, icon, n, cur: id === cur ? 'page' : 'false', sel: id === cur ? 'true' : 'false', pick: (e) => { e.preventDefault(); this.setState({ tab: id }); } })) };
    T.forEach(([id], i) => { r['t_' + i] = id === cur; });
    return r;
  }
}
</script>
