<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>提出者情報</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>
body{margin:0;background:#000}
.sub{display:grid;gap:20px}
.sub-x{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.sub-x .t-xs{flex-basis:100%}
.sub-sum{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:0}
.sub-av{position:relative;width:64px;height:64px;padding:0;border:0;background:none;cursor:pointer}
.sub-av img{width:64px;height:64px;object-fit:cover;border-radius:50%;display:block}
.sub-av-e{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;display:grid;place-items:center;background:var(--surface-active);color:var(--ink);font-size:10px}
.sub-av:hover img{opacity:.8}
.sub-sum .nm{font-size:18px;line-height:26px;color:var(--ink)}
.sub-sum .pf{margin:4px 0 0;font-size:13px;line-height:20px;color:var(--ink-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub-sum .lk{display:flex;gap:12px;margin-top:6px;color:var(--ink-muted);font-size:13px}
.sub-note{margin:0;font-size:12px;line-height:16px;color:var(--ink-muted)}
.sub-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:640px){
  .sub-sum{grid-template-columns:48px minmax(0,1fr);padding:0}
  .sub-av,.sub-av img{width:48px;height:48px}
  .sub-sum>.fn-btn{grid-column:1/-1;justify-content:center}
}
</style>
</helmet>
<div class="p-root sub" data-theme="{{theme}}" lang="ja" style="min-height: 0; background: transparent; padding-bottom: 0;">
  <div class="sub-x">
    <span class="muted">提出主体</span>
    <img class="avatar" src="/_blob/fc027fe6fe3a001a22a1933270ce72b9" alt="" style="width: 24px; height: 24px;">
    <span>おたこ</span><span class="muted t-num">@012345rty</span>
    <span class="t-xs muted">Active X ID で固定。変える場合はヘッダーのアカウントメニューで名義を切り替えます。</span>
  </div>

  <sc-if value="{{isSum}}" hint-placeholder-val="{{true}}">
    <div class="sub-sum">
      <button type="button" class="sub-av" onClick="{{toggleIcon}}" aria-expanded="{{iconOpen}}" aria-label="アイコンを変更"><img src="{{icPreview}}" alt=""><span class="sub-av-e"><i class="fa-solid fa-pen" aria-hidden="true"></i></span></button>
      <div style="min-width: 0;">
        <div class="nm">{{name}}</div>
        <p class="pf">{{profile}}</p>
        <div class="lk"><span class="il"><i class="fa-brands fa-youtube" aria-hidden="true"></i>チャンネル</span><span class="il"><i class="fa-solid fa-link" aria-hidden="true"></i>SNS {{snsCount}}件</span></div>
      </div>
      <button type="button" class="fn-btn fn-btn--secondary fn-btn--sm" onClick="{{toEdit}}">この作品用に変更</button>
    </div>
    <sc-if value="{{iconOpen}}" hint-placeholder-val="{{false}}"><dc-import name="IconPicker" icon="{{icon}}" ctx="video" hint-size="100%,300px"></dc-import></sc-if>
    <p class="sub-note">X ID の既定プロフィールを入れてあります。変更はこの作品だけに反映されます。</p>
  </sc-if>

  <sc-if value="{{isEdit}}" hint-placeholder-val="{{false}}">
    <x-import component-from-global-scope="FlameNode.TextField" label="表示名 *" default-value="おたこ" hint="80文字まで"></x-import>
    <dc-import name="IconPicker" icon="{{icon}}" ctx="video" hint-size="100%,300px"></dc-import>
    <x-import component-from-global-scope="FlameNode.TextField" label="自分・団体の概要" multiline="{{yes}}" default-value="{{profile}}"></x-import>
    <div class="field-i"><x-import component-from-global-scope="FlameNode.TextField" label="YouTube チャンネル" placeholder="https://www.youtube.com/@..." default-value="https://www.youtube.com/@otako"></x-import><i class="fa-brands fa-youtube" aria-hidden="true"></i></div>
    <dc-import name="LinkEditor" hint-size="100%,180px"></dc-import>
    <div class="sub-acts">
      <button type="button" class="fn-btn fn-btn--secondary fn-btn--sm" onClick="{{toSum}}"><i class="fa-solid fa-check" aria-hidden="true"></i>完了</button>
      <button type="button" class="fn-btn fn-btn--tertiary fn-btn--sm" onClick="{{toSum}}"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i>既定プロフィールに戻す</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"mode":{"editor":"enum","options":["summary","edit"],"default":"summary"},"icon":{"editor":"enum","options":["select","crop","uploaded"],"default":"select"},"iconOpen":{"editor":"enum","options":["closed","open"],"default":"closed"},"$preview":{"width":720,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = {}; }
  renderVals() {
    const md = this.props.mode || 'summary'; if (md !== this._md) { this._md = md; this.state.mode = md; }
    const io = this.props.iconOpen || 'closed'; if (io !== this._io) { this._io = io; this.state.iconOpen = io === 'open'; }
    const S = this.state;
    return Object.assign({ icon: this.props.icon || 'select', icPreview: '/_blob/fc027fe6fe3a001a22a1933270ce72b9' }, {
      theme: this.props.theme ?? 'dark', yes: true,
      isSum: S.mode === 'summary', isEdit: S.mode === 'edit',
      iconOpen: !!S.iconOpen, toggleIcon: () => this.setState({ iconOpen: !S.iconOpen }),
      toEdit: () => this.setState({ mode: 'edit', iconOpen: false }), toSum: () => this.setState({ mode: 'summary' }),
      name: 'おたこ', profile: 'アニメと実写を混ぜた短編を作っています。依頼は X の DM へ。',
      snsCount: 2
    });
  }
}
</script>
</body>
</html>
