name: Final canonical integration v2

on:
  pull_request:
    branches:
      - agent/db-canonical-migration-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-canonical-integration-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/db-canonical-final-run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/db-canonical-final-run' }}
          fetch-depth: 0

      - name: 作業ブランチを統合
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictStyle diff3
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p .tmp
          : > .tmp/integration-report.txt

          resolve_conflicts() {
            local default_side="$1"
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            (( ${#conflicts[@]} > 0 )) || return 1
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/*|migrations/0043_db_canonical_migration.sql|src/lib/db/schema.ts|src/lib/db/schema.canonical.ts|docs/database/canonical-migration-plan.md|docs/db-history/0043_db_canonical_migration.md)
                  git checkout --ours -- "$path" ;;
                *) git checkout --"$default_side" -- "$path" ;;
              esac
              git add -- "$path"
            done
            ! git diff --name-only --diff-filter=U | grep -q .
          }

          merge_branch() {
            local branch="$1" strategy="$2" ref="origin/$1"
            git show-ref --verify --quiet "refs/remotes/$ref" || return 0
            echo "MERGE $branch $(git rev-parse "$ref")" | tee -a .tmp/integration-report.txt
            set +e
            git merge --no-ff --no-edit -X"$strategy" "$ref"
            status=$?
            set -e
            if (( status != 0 )); then resolve_conflicts "$strategy"; git commit --no-edit; fi
          }

          merge_branch main ours
          merge_branch agent/db-canonical-foundation theirs
          merge_branch agent/db-canonical-x-identity theirs
          merge_branch agent/db-canonical-videos-import theirs
          merge_branch agent/db-canonical-events theirs
          merge_branch agent/unslotted-event-affiliation theirs
          merge_branch agent/chapter-comment-delete-and-validation theirs
          merge_branch agent/unify-custom-questions theirs
          merge_branch agent/ux-and-status-simplification theirs
          merge_branch agent/x-identity-import-hardening theirs

      - name: 競合で崩れたイベント実装を担当正本から再構成
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/agent/unify-custom-questions -- \
            src/components/admin/EventForm.tsx \
            src/lib/actions/event-admin.ts \
            src/lib/admin/eventTemplateSettings.ts

          python - <<'PY'
          from pathlib import Path
          import re

          # EventForm: 正規化質問UIを維持し、イベント状態・枠を新正本へ合わせる。
          p = Path('src/components/admin/EventForm.tsx')
          s = p.read_text()
          s = s.replace('visibility_status?: "draft" | "private" | "public" | "archived" | null;', 'visibility_status?: "private" | "public" | null;')
          s = s.replace('  max_consecutive_slots_per_entry?: number;\n', '')
          s = re.sub(r'function resolveInitialVisibility\(\n  initial: EventFormInitial,\n\): "draft" \| "private" \| "public" \| "archived" \{.*?\n\}', 'function resolveInitialVisibility(\n  initial: EventFormInitial,\n): "private" | "public" {\n  return initial.visibility_status === "public" ? "public" : "private";\n}', s, flags=re.S)
          s = s.replace('    max_consecutive_slots_per_entry:\n      initial.max_consecutive_slots_per_entry ?? 3,\n', '')
          s = s.replace('    max_consecutive_slots_per_entry:\n      textValue(formData, "max_consecutive_slots_per_entry") || "3",\n', '')
          s = s.replace('    visibility_status: textValue(formData, "visibility_status") || "draft",', '    visibility_status: textValue(formData, "visibility_status") || "private",')
          s = s.replace('              <option value="draft">下書き</option>\n', '')
          s = s.replace('              <option value="archived">アーカイブ</option>\n', '')
          s = re.sub(r'\n\s*<div>\n\s*<label className="fn-label">連続取得上限</label>\n\s*<input\n\s*name="max_consecutive_slots_per_entry".*?\n\s*</div>', '', s, flags=re.S)
          p.write_text(s)

          # event-admin: 正規化質問実装へowner不変条件と新正本イベント作成を合成。
          p = Path('src/lib/actions/event-admin.ts')
          s = p.read_text()
          s = s.replace('  eventCustomQuestions,\n  eventTemplates,\n  events,', '  eventCustomQuestions,\n  eventStaff,\n  eventTemplates,\n  events,\n  xUserAccountLinks,\n  xUsers,')
          duplicate = '''  const duplicate = (\n    await db.select({ id: events.id }).from(events).where(eq(events.id, id)).limit(1)\n  )[0];\n  if (duplicate) return { ok: false, message: `ID「${id}」は既に存在します。` };\n'''
          owner = duplicate + '''\n  const ownerIdentity = (\n    await db\n      .select({\n        x_user_id: xUserAccountLinks.x_user_id,\n        display_name: xUsers.x_name,\n      })\n      .from(xUserAccountLinks)\n      .innerJoin(xUsers, eq(xUsers.id, xUserAccountLinks.x_user_id))\n      .where(eq(xUserAccountLinks.auth_user_id, actorUserId))\n      .limit(1)\n  )[0];\n  if (!ownerIdentity) {\n    return {\n      ok: false,\n      message: "イベント作成には認証ユーザーへ紐付いた X 名義が必要です。",\n    };\n  }\n'''
          if duplicate not in s: raise SystemExit('duplicate anchor missing')
          s = s.replace(duplicate, owner, 1)
          s = s.replace('    max_consecutive_slots_per_entry: data.max_consecutive_slots_per_entry,\n', '')
          s = s.replace('    representative_x_user_id: null,\n', '')
          s = s.replace('    public_api_updated_at: null,\n', '')
          row_anchor = '  } satisfies typeof events.$inferInsert;\n  const questions = buildQuestionRows(id, definitions, now);'
          owner_row = '''  } satisfies typeof events.$inferInsert;\n  const ownerRow = {\n    id: generateId("es"),\n    event_id: id,\n    x_user_id: ownerIdentity.x_user_id,\n    display_name: ownerIdentity.display_name,\n    permission_preset: "owner" as const,\n    custom_permission_keys_json: null,\n    is_public: 1,\n    public_role_label: "主催",\n    approved_by_auth_user_id: actorUserId,\n    approved_at: now,\n    created_at: now,\n    updated_at: now,\n  } satisfies typeof eventStaff.$inferInsert;\n  const questions = buildQuestionRows(id, definitions, now);'''
          if row_anchor not in s: raise SystemExit('row anchor missing')
          s = s.replace(row_anchor, owner_row, 1)
          s = s.replace('    db.insert(events).values(createdRow),\n    ...insertChunks', '    db.insert(events).values(createdRow),\n    db.insert(eventStaff).values(ownerRow),\n    ...insertChunks', 1)
          s = s.replace('    1,\n    ...insertChunks.map', '    1,\n    1,\n    ...insertChunks.map', 1)
          audit_anchor = '''    {\n      table_name: "events",\n      target_id: id,\n      operation: "CREATE",\n      before: null,\n      after: createdRow,\n      actor_user_id: actorUserId,\n      retention_class: "normal",\n      strict: true,\n    },\n'''
          owner_audit = audit_anchor + '''    {\n      table_name: "event_staff",\n      target_id: ownerRow.id,\n      operation: "CREATE",\n      before: null,\n      after: ownerRow,\n      actor_user_id: actorUserId,\n      context: "event-create:owner",\n      reason: "イベント作成者をownerとして登録",\n      retention_class: "long_audit",\n      restore_strategy: "delete_created",\n      strict: true,\n    },\n'''
          if audit_anchor not in s: raise SystemExit('audit anchor missing')
          s = s.replace(audit_anchor, owner_audit, 1)
          p.write_text(s)

          # テンプレートから廃止済み連続枠設定を除外。
          p = Path('src/lib/admin/eventTemplateSettings.ts')
          s = p.read_text()
          s = re.sub(r'\n\s*"max_consecutive_slots_per_entry",', '', s)
          s = re.sub(r'\n\s*max_consecutive_slots_per_entry\??:[^;]+;', '', s)
          s = re.sub(r'\n\s*max_consecutive_slots_per_entry:\s*[^,]+,', '', s)
          p.write_text(s)

          # DB入口検査が契約テスト内の説明用文字列をimportと誤認しないようにする。
          p = Path('src/lib/auth/xIdentityCanonical.contract.test.mjs')
          s = p.read_text().replace('!rel.endsWith("src/lib/db/schema.base.ts")', '!rel.endsWith(["src/lib/db/schema", "base.ts"].join("."))')
          p.write_text(s)
          PY

          rm -rf .agent-patch .agent-trigger
          rm -f .github/workflows/export-agent-source.yml .github/workflows/export-event-source.yml \
            .github/workflows/apply-canonical-videos-import.yml .github/workflows/apply-canonical-videos-import-v2.yml
          git add -A
          git diff --cached --check

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: 型検査
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .tmp/typecheck.log

      - name: Lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .tmp/lint.log

      - name: DB・owner検査
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          { npm run check:db-schema; npm run check:db-migration; npm run check:db-legacy; npm run check:event-owners; } 2>&1 | tee .tmp/db-checks.log

      - name: 統合作業ツリーを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-canonical-integration-v2-${{ github.run_id }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 3
