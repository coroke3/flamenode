name: Apply YouTube playlist integration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-youtube-playlist-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/youtube-playlist-main-integration
          fetch-depth: 0

      - name: Apply feature on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/youtube-playlist-free-tier-v2:refs/remotes/origin/youtube-playlist-feature

          set +e
          git cherry-pick 5ff9a94ad603694ca7b978f68b617be900773338
          cherry_pick_rc=$?
          set -e

          if [ "$cherry_pick_rc" -ne 0 ]; then
            git checkout --ours docs/database/change-log.md
            git checkout --ours src/lib/integration/schemaBaseline.integration.test.mjs

            cat > workers/sync-jobs/index.ts <<'EOF'
          /**
           * sync-jobs: 15分毎の外部API・集計ジョブ。
           * - 7・22・37分: YouTubeメタデータ同期、スコア差分再計算、ランキング再生成予約
           * - 52分: 設定済みイベントのYouTube再生リスト差分同期
           *
           * 重い外部API同期を同一invocationで重ねず、Workers FreeのCPU・subrequest枠を守る。
           */
          import { createCronWorker } from "../shared/createCronWorker.ts";
          import { recalcScoreBatch } from "../score-recalc/index.ts";
          import { withCronLease } from "../shared/cronLease.ts";
          import {
            combineJobCounters,
            runJob,
            throwIfJobFailed,
          } from "../shared/runJob.ts";
          import { syncBatch } from "../youtube-sync/index.ts";
          import { syncEventPlaylists } from "../youtube-playlist-sync/index.ts";

          export interface Env {
            DB: D1Database;
            KV: KVNamespace;
            YOUTUBE_API_KEY?: string;
            YOUTUBE_DAILY_QUOTA_LIMIT?: string;
            YOUTUBE_OAUTH_CLIENT_ID?: string;
            YOUTUBE_OAUTH_CLIENT_SECRET?: string;
            YOUTUBE_OAUTH_REFRESH_TOKEN?: string;
            BUILD_COMMIT_SHA?: string;
          }

          const SYNC_JOBS_LEASE_SEC = 14 * 60;
          const SYNC_JOBS_HEARTBEAT_SEC = 4 * 60;

          /** Cronは7,22,37,52分。52分台だけを再生リスト専用枠にする。 */
          export function isPlaylistSyncSlot(now = new Date()): boolean {
            return now.getUTCMinutes() >= 50;
          }

          async function enqueueScoreDependentRebuilds(
            env: Env,
          ): Promise<{ processed: number; failed: number; skipped: number }> {
            const now = Math.floor(Date.now() / 1000);
            const targets = ["top", "list_popular"] as const;
            const statements = targets.map((targetType) =>
              env.DB.prepare(
                `INSERT OR IGNORE INTO static_rebuild_queue (
                   id, target_type, target_id, reason, priority, status,
                   attempt_count, created_at, updated_at
                 ) VALUES (?, ?, 'global', 'score_recalc', 'normal', 'pending', 0, ?, ?)`,
              ).bind(`srb:${targetType}:${crypto.randomUUID()}`, targetType, now, now),
            );
            const results = await env.DB.batch(statements);
            const processed = results.reduce(
              (sum, result) =>
                sum + Math.max(0, Number(result.meta?.changes ?? 0)),
              0,
            );
            return processed > 0
              ? { processed, failed: 0, skipped: 0 }
              : { processed: 0, failed: 0, skipped: 1 };
          }

          export async function runSyncJobs(env: Env): Promise<void> {
            await runJob(
              "sync-jobs",
              "cron",
              async () => {
                const leased = await withCronLease(
                  env,
                  {
                    jobName: "sync-jobs",
                    leaseSeconds: SYNC_JOBS_LEASE_SEC,
                    heartbeatSeconds: SYNC_JOBS_HEARTBEAT_SEC,
                  },
                  async () => {
                    if (isPlaylistSyncSlot()) {
                      const playlist = await runJob(
                        "sync-jobs",
                        "youtube-playlist-sync",
                        () => syncEventPlaylists(env),
                      );
                      return throwIfJobFailed(
                        "sync-jobs",
                        "cron",
                        playlist,
                      );
                    }

                    const youtube = await runJob(
                      "sync-jobs",
                      "youtube-sync",
                      () => syncBatch(env),
                    );
                    const score = await runJob(
                      "sync-jobs",
                      "score-recalc",
                      () => recalcScoreBatch(env),
                    );
                    const rankingRebuild =
                      score.processed > 0
                        ? await runJob(
                            "sync-jobs",
                            "ranking-rebuild-enqueue",
                            () => enqueueScoreDependentRebuilds(env),
                          )
                        : {
                            succeeded: true,
                            processed: 0,
                            skipped: 1,
                            failed: 0,
                          };
                    return throwIfJobFailed(
                      "sync-jobs",
                      "cron",
                      combineJobCounters(youtube, score, rankingRebuild),
                    );
                  },
                );
                return leased.acquired
                  ? (leased.value ?? { skipped: 1 })
                  : { skipped: 1 };
              },
              { rethrow: true },
            );
          }

          export default createCronWorker<Env>({
            service: "sync-jobs",
            run: runSyncJobs,
          });
          EOF

            cat > workers/sync-jobs/wrangler.toml <<'EOF'
          name = "flamenode-sync-jobs"
          main = "index.ts"
          compatibility_date = "2026-01-01"
          compatibility_flags = ["nodejs_compat"]

          # Workers FreeはCron間隔にかかわらずCPU 10ms。
          # 7/22/37分はmetadata・score、52分は設定済みイベントのplaylist同期に分離する。
          [triggers]
          crons = ["7,22,37,52 * * * *"]

          [[d1_databases]]
          binding = "DB"
          database_name = "flamenode_db"
          database_id = "00000000-0000-0000-0000-000000000000"

          [[kv_namespaces]]
          binding = "KV"
          id = "00000000000000000000000000000000"
          preview_id = "00000000000000000000000000000000"

          [vars]
          # Google Cloud Consoleの1日quota。FlameNode全体で80%まで使用する。
          YOUTUBE_DAILY_QUOTA_LIMIT = "10000"
          # Secrets:
          # - YOUTUBE_API_KEY
          # - YOUTUBE_OAUTH_CLIENT_ID
          # - YOUTUBE_OAUTH_CLIENT_SECRET
          # - YOUTUBE_OAUTH_REFRESH_TOKEN
          EOF
          fi

          if [ -f migrations/0041_event_youtube_playlist_sync.sql ]; then
            git mv migrations/0041_event_youtube_playlist_sync.sql migrations/0042_event_youtube_playlist_sync.sql
          fi
          if [ -f docs/db-history/0041_event_youtube_playlist_sync.md ]; then
            git mv docs/db-history/0041_event_youtube_playlist_sync.md docs/db-history/0042_event_youtube_playlist_sync.md
          fi

          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              updated = text.replace(
                  '0041_event_youtube_playlist_sync',
                  '0042_event_youtube_playlist_sync',
              )
              if updated != text:
                  path.write_text(updated)

          change_log = Path('docs/database/change-log.md')
          text = change_log.read_text()
          section = '''## 2026-07-13 — `0042_event_youtube_playlist_sync.sql`

          | 項目 | 内容 |
          | --- | --- |
          | Type | additive |
          | Summary | イベント単位のYouTube再生リスト同期設定と、差分同期用の再生リスト項目索引を追加 |
          | Reason | 設定済みイベントだけを再生リストへ同期し、メタデータ同期と同じ日次80% quota予算を共有するため |
          | Tables | `event_youtube_playlist_sync`、`event_youtube_playlist_items` |
          | Data migration | なし。全イベントで同期無効から開始 |
          | Compatibility | migration未適用時は設定画面・同期Workerをfail-closed |
          | Data loss | none |
          | Rollback | 同期を無効化後、項目索引テーブル、設定テーブルの順で削除 |
          | Validation | schema/history、playlist parser/diff、共有quota、Worker、Next.js/Pages build |
          | PR | `agent/youtube-playlist-main-integration` |

          '''
          marker = '## 2026-07-13 — `0040_worker_free_tier_scale.sql`'
          if '0042_event_youtube_playlist_sync.sql' not in text:
              if marker not in text:
                  raise SystemExit('change-log insertion marker missing')
              text = text.replace(marker, section + marker, 1)
          change_log.write_text(text)

          baseline = Path('src/lib/integration/schemaBaseline.integration.test.mjs')
          text = baseline.read_text()
          needle = '    "0041_youtube_quota_budget.sql",\n'
          addition = needle + '    "0042_event_youtube_playlist_sync.sql",\n'
          if '0042_event_youtube_playlist_sync.sql' not in text:
              if needle not in text:
                  raise SystemExit('schema baseline insertion marker missing')
              text = text.replace(needle, addition, 1)
          baseline.write_text(text)

          worker = Path('workers/youtube-playlist-sync/index.ts')
          text = worker.read_text()
          old_interface = '''export interface PlaylistSyncEnv {
            DB: D1Database;
            KV: KVNamespace;
            YOUTUBE_OAUTH_CLIENT_ID?: string;
            YOUTUBE_OAUTH_CLIENT_SECRET?: string;
            YOUTUBE_OAUTH_REFRESH_TOKEN?: string;
            YOUTUBE_PLAYLIST_DAILY_QUOTA_UNITS?: string;
          }
          '''
          new_interface = '''import {
            loadYoutubeQuotaSnapshot,
            reserveYoutubeQuota,
            type YoutubeQuotaEnv,
          } from "../youtube-sync/quotaBudget.ts";

          export interface PlaylistSyncEnv extends YoutubeQuotaEnv {
            KV: KVNamespace;
            YOUTUBE_OAUTH_CLIENT_ID?: string;
            YOUTUBE_OAUTH_CLIENT_SECRET?: string;
            YOUTUBE_OAUTH_REFRESH_TOKEN?: string;
          }
          '''
          if old_interface not in text:
              raise SystemExit('playlist env block not found')
          text = text.replace(old_interface, new_interface, 1)
          text = text.replace('''const DEFAULT_DAILY_QUOTA_UNITS = 4500;
          const MAX_DAILY_QUOTA_UNITS = 8000;
          const QUOTA_STATE_KEY = "youtube-playlist:quota-state";
          ''', '', 1)
          start = text.find('export function quotaDayKey')
          end = text.find('async function fetchWithTimeout')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('playlist quota block boundaries not found')
          quota_class = '''class DailyQuotaBudget {
            private remainingUnits: number;

            private constructor(
              private readonly env: PlaylistSyncEnv,
              private readonly now: number,
              remainingUnits: number,
            ) {
              this.remainingUnits = remainingUnits;
            }

            static async load(env: PlaylistSyncEnv, now: number): Promise<DailyQuotaBudget> {
              const snapshot = await loadYoutubeQuotaSnapshot(env, now);
              return new DailyQuotaBudget(env, now, snapshot.remainingUnits);
            }

            canSpend(cost: number): boolean {
              return cost > 0 && cost <= this.remainingUnits;
            }

            async spend(cost: number): Promise<void> {
              if (!this.canSpend(cost)) throw new QuotaDeferredError();
              const reservation = await reserveYoutubeQuota(this.env, cost, this.now);
              if (!reservation) {
                this.remainingUnits = 0;
                throw new QuotaDeferredError();
              }
              this.remainingUnits = Math.max(
                0,
                reservation.dailyBudgetUnits - reservation.usedUnits,
              );
            }

            async persist(): Promise<void> {
              // 各API呼び出し直前にD1へ原子的に予約するため追加保存は不要。
            }
          }

          '''
          text = text[:start] + quota_class + text[end:]
          if 'quota.spend(cost);' not in text:
              raise SystemExit('playlist quota spend call not found')
          text = text.replace('quota.spend(cost);', 'await quota.spend(cost);', 1)
          worker.write_text(text)

          worker_test = Path('workers/youtube-playlist-sync/index.test.mjs')
          text = worker_test.read_text()
          text = text.replace('''import {
            calculateSyncDiff,
            parseDailyQuotaLimit,
            quotaDayKey,
          } from "./index.ts";
          ''', 'import { calculateSyncDiff } from "./index.ts";\n', 1)
          quota_test = '''
          test("daily quota stays conservative and follows Pacific Time reset", () => {
            assert.equal(parseDailyQuotaLimit(undefined), 4500);
            assert.equal(parseDailyQuotaLimit("100"), 500);
            assert.equal(parseDailyQuotaLimit("5000"), 5000);
            assert.equal(parseDailyQuotaLimit("10000"), 8000);
            assert.equal(quotaDayKey(0), "1969-12-31");
          });
          '''
          if quota_test not in text:
              raise SystemExit('legacy playlist quota test not found')
          worker_test.write_text(text.replace(quota_test, '\n', 1))

          ops = Path('docs/operations/youtube-playlist-sync.md')
          text = ops.read_text()
          old = '''任意で1日あたりの再生リスト同期用クォータ上限を設定できます。既定は4500、設定可能な上限は8000です。日次境界はYouTubeと同じ太平洋時間で管理します。

          ```toml
          [vars]
          YOUTUBE_PLAYLIST_DAILY_QUOTA_UNITS = "4500"
          ```
          '''
          new = '''YouTube Data APIの全処理は `YOUTUBE_DAILY_QUOTA_LIMIT` の80%を共有上限として使用します。既定設定は10,000 units/dayの80%＝8,000 unitsで、メタデータ同期と再生リスト同期をD1上で原子的に合算します。日次境界は太平洋時間です。
          '''
          if old not in text:
              raise SystemExit('playlist operations quota paragraph not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '- 1日の再生リスト同期クォータ: 既定4500 units',
              '- 1日のYouTube全処理クォータ: 標準8,000 units（設定quotaの80%を共有）',
              1,
          )
          ops.write_text(text)

          leftovers = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  value = path.read_text()
              except UnicodeDecodeError:
                  continue
              if '0041_event_youtube_playlist_sync' in value or 'YOUTUBE_PLAYLIST_DAILY_QUOTA_UNITS' in value:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('legacy references remain: ' + ', '.join(leftovers))
          PY

          git add -A
          if [ -f .git/CHERRY_PICK_HEAD ]; then
            GIT_EDITOR=true git cherry-pick --continue
          else
            git commit -m "YouTube再生リスト同期を共有quota設計へ統合"
          fi

          rm -f .github/workflows/apply-youtube-playlist-integration.yml
          git add -A
          git commit -m "一時統合ワークフローを削除"
          git push origin HEAD:agent/youtube-playlist-main-integration
