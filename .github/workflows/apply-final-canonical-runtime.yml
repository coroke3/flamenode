name: Apply final canonical runtime

on:
  push:
    branches: [agent/db-canonical-runtime-apply]

permissions:
  contents: write

concurrency:
  group: apply-final-canonical-runtime
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/db-canonical-runtime-apply
          fetch-depth: 0
      - name: 正本ランタイムパッチを適用
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictStyle diff3
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p .tmp

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.patch" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/90" \
            -o /tmp/canonical-events.patch

          set +e
          git apply --3way --index /tmp/canonical-events.patch
          status=$?
          set -e
          if (( status != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf '%s\n' "${conflicts[@]}" > .tmp/event-conflicts.txt
            python - <<'PY'
          from pathlib import Path
          allowed = {
            'app/(auth)/dashboard/page.tsx',
            'src/lib/actions/event-staff-admin.ts',
            'src/lib/actions/slot.ts',
            'src/lib/api/publicDto.ts',
            'src/lib/auth/ownership.ts',
            'src/lib/event/eventOwnership.ts',
          }
          conflicts = {x.strip() for x in Path('.tmp/event-conflicts.txt').read_text().splitlines() if x.strip()}
          unexpected = conflicts - allowed
          if unexpected:
            raise SystemExit(f'unexpected event conflicts: {sorted(unexpected)}')
          if not conflicts:
            raise SystemExit('event patch failed without conflicts')
          for name in conflicts:
            path = Path(name)
            lines = path.read_text().splitlines(True)
            out = []
            i = 0
            while i < len(lines):
              if not lines[i].startswith('<<<<<<<'):
                out.append(lines[i]); i += 1; continue
              i += 1
              ours = []
              while i < len(lines) and not lines[i].startswith('|||||||') and not lines[i].startswith('======='):
                ours.append(lines[i]); i += 1
              if i < len(lines) and lines[i].startswith('|||||||'):
                i += 1
                while i < len(lines) and not lines[i].startswith('======='): i += 1
              if i >= len(lines) or not lines[i].startswith('======='):
                raise SystemExit(f'malformed conflict: {name}')
              i += 1
              while i < len(lines) and not lines[i].startswith('>>>>>>>'): i += 1
              if i >= len(lines): raise SystemExit(f'unclosed conflict: {name}')
              i += 1
              out.extend(ours)
            path.write_text(''.join(out))
          PY
            git add -- "${conflicts[@]}"
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git checkout origin/agent/db-canonical-videos-import -- .agent-patch
          mapfile -t parts < <(find .agent-patch -maxdepth 1 -type f -name 'part-*' | sort -V)
          (( ${#parts[@]} > 0 )) || { echo '動画担当の分割パッチがありません' >&2; exit 1; }
          cat "${parts[@]}" | base64 -d | gzip -d > /tmp/canonical-videos-import.patch
          echo "08ec23c94c21c429615e0d525a9ce151e1522f91f37c48edf0719db6f88b2151  /tmp/canonical-videos-import.patch" | sha256sum -c -
          git apply --3way --index /tmp/canonical-videos-import.patch
          git diff --cached --check
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 型検査
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .tmp/typecheck.log
      - name: Lint
        run: npm run lint
      - name: DB正本検査
        shell: bash
        run: |
          set -o pipefail
          {
            npm run check:db-schema
            npm run check:db-migration
            npm run check:db-legacy
          } 2>&1 | tee .tmp/db-checks.log
      - name: 検証済みランタイムを反映
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent-patch
          rm -f .github/workflows/apply-final-canonical-runtime.yml
          git add -A
          git diff --cached --check
          git commit -m "イベント・作品・YouTube・監査ランタイムを新正本へ統合"
          git push origin HEAD:agent/db-canonical-runtime-apply
      - name: 失敗時の作業ツリーを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-runtime-apply-${{ github.run_id }}
          path: |
            .
            /tmp/canonical-events.patch
            /tmp/canonical-videos-import.patch
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 3
