name: Snapshot Actions Status

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: actions-status-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture current workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/actions/runs?branch=main&per_page=30")"

          RESPONSE="$response" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["RESPONSE"])
          selected = [
              run for run in payload.get("workflow_runs", [])
              if run.get("name") in {"CI", "Deploy Cloudflare", "Record Production Test"}
          ][:20]

          lines = [
              "# GitHub Actions 状態スナップショット",
              "",
              "> Status: Diagnostic",
              "> Generated by: Snapshot Actions Status",
              "",
              "| Workflow | Run ID | Event | Head SHA | Status | Conclusion | URL |",
              "| --- | ---: | --- | --- | --- | --- | --- |",
          ]
          for run in selected:
              lines.append(
                  "| {name} | {id} | {event} | `{sha}` | {status} | {conclusion} | {url} |".format(
                      name=run.get("name", ""),
                      id=run.get("id", ""),
                      event=run.get("event", ""),
                      sha=(run.get("head_sha") or "")[:12],
                      status=run.get("status", ""),
                      conclusion=run.get("conclusion") or "—",
                      url=run.get("html_url", ""),
                  )
              )
          Path("docs/operations/actions-status-snapshot.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/actions-status-snapshot.md
          git commit -m "docs: snapshot GitHub Actions status" || exit 0
          git push origin HEAD:main
