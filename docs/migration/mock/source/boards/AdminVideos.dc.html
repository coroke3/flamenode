<div class="{{rootCls}}" data-theme="{{theme}}" lang="ja">
<div class="c-layout">

  <main class="c-main">
    <div class="c-head">
      <div>
        <sc-if value="{{full}}" hint-placeholder-val="{{false}}"><h1 class="t-display">作品管理</h1></sc-if>
        <p class="muted">作品の状態確認、監査ログ、参加者設定を行います。</p>
      </div>
    </div>
    <sc-if value="{{full}}" hint-placeholder-val="{{false}}"><nav class="subnav" aria-label="作品管理メニュー" style="margin-bottom: 24px;">

    <div class="wrap-row" style="gap: 8px;">
      <nav class="subnav" aria-label="公開状態"><sc-for list="{{_nav}}" as="t" hint-placeholder-count="5"><a href="#" aria-current="{{t.cur}}" onClick="{{t.pick}}">{{t.label}}</a></sc-for></nav>

    </div>
    <p class="t-sm muted t-num" style="margin: 16px 0 8px;">12 件</p>

    <div class="t-scroll">
      <div class="dt" role="table" aria-label="作品一覧" style="--cols: minmax(260px, 2.4fr) minmax(140px, 1.2fr) 96px 72px 88px 80px 92px 104px; --minw: 1100px;">
        <div class="dt-h" role="row"><span>作品</span><span>作者</span><span>状態</span><span>YouTube</span><span>ステージ許可</span><span>必須未回答</span><span>登録</span><span></span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
          <div class="dt-r" role="row">
            <a href="AdminVideoHub.dc.html" class="row" style="gap: 12px; min-width: 0;"><img class="thumb" src="{{r.thumb}}" alt=""><span class="stack" style="min-width: 0;"><span class="ell">{{r.title}}</span><span class="sub">{{r.event}}</span></span></a>
            <span class="stack" style="min-width: 0;"><span class="il ell"><i class="{{r.kindIcon}} muted" aria-hidden="true"></i>{{r.creator}}</span><span class="sub">@{{r.x}}</span></span>
            <span class="st"><span class="{{r.dot}}"></span>{{r.state}}</span>
            <i class="{{r.yt}}" aria-label="{{r.ytLabel}}" title="{{r.ytLabel}}" style="color: {{r.ytColor}};"></i>
            <i class="{{r.stage}}" aria-hidden="true"></i>
            <i class="{{r.req}}" aria-hidden="true" style="color: var(--warning);"></i>
            <span class="t-num muted">{{r.at}}</span>
            <span class="row" style="gap: 0; justify-content: flex-end;"><button type="button" class="ib sm" aria-label="承認"><i class="fa-solid fa-check"></i></button><a href="AdminAuditHub.dc.html" class="ib sm" aria-label="この作品の監査ログ"><i class="fa-solid fa-clock-rotate-left"></i></a><a href="AdminVideoHub.dc.html" class="ib sm" aria-label="詳細"><i class="fa-solid fa-arrow-right"></i></a></span>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</div>
</x-dc>
