name: Final main integration v9

on:
  pull_request:
    branches:
      - agent/db-canonical-migration-v2
    paths:
      - .agent-patch/final-integration.part*
      - .github/workflows/final-main-integration-v9.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: final-main-integration-v9
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/final-main-integration-v9'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-main-integration-v9
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reassemble and verify integration patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .agent-patch/final-integration.part00 \
            .agent-patch/final-integration.part01 \
            .agent-patch/final-integration.part02 \
            .agent-patch/final-integration.part03 \
            > /tmp/final-integration.patch.gz.b64
          test "$(wc -c < /tmp/final-integration.patch.gz.b64)" -eq 27820
          test "$(git hash-object /tmp/final-integration.patch.gz.b64)" = "ed99a10501dd2d6f29795da65b8b10e47fe2a232"

      - name: Restore verified conflict-resolved source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/resolved-artifact /tmp/resolved-source /tmp/resolved-source.zip
          mkdir -p /tmp/resolved-artifact /tmp/resolved-source
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/resolved-source.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8464226272/zip"
          unzip -q /tmp/resolved-source.zip -d /tmp/resolved-artifact
          source_tar="$(find /tmp/resolved-artifact -name 'resolved-source.tar.gz' -print -quit)"
          test -n "${source_tar}"
          tar -xzf "${source_tar}" -C /tmp/resolved-source
          test -f /tmp/resolved-source/package.json
          rsync -a --delete --exclude='.git/' /tmp/resolved-source/ ./

      - name: Apply verified integration fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/final-integration.patch.gz.b64 \
            | gzip --decompress > /tmp/final-integration.patch
          git apply --check /tmp/final-integration.patch
          git apply /tmp/final-integration.patch
          rm -rf .agent-trigger .agent-patch
          rm -f \
            .github/workflows/final-main-integration-v9.yml \
            .github/workflows/export-pr-source-temp.yml \
            .github/workflows/export-pr100-source.yml \
            .github/workflows/resolve-canonical-conflicts.yml
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' -- . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude='*.lock'; then
            echo 'Conflict markers remain.'
            exit 1
          fi
          git add -A
          git diff --cached --check
          git commit -m "競合を解消して全worktreeの正本統合を確定"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify dependency tree
        run: npm ls --depth=0

      - name: Verify lockfile
        run: git diff --exit-code -- package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Worker tests
        run: npm run test:workers

      - name: Cloudflare contract tests
        run: npm run test:cloudflare-ci

      - name: Integration tests
        run: npm run test:integration

      - name: Next.js production build
        run: npm run build

      - name: Cloudflare Pages build
        run: npm run pages:build

      - name: Pages artifact checks
        run: npm run check:pages-output

      - name: Cloudflare template checks
        run: npm run check:cloudflare-template

      - name: Cloudflare fixture checks
        env:
          CLOUDFLARE_CONFIG_MODE: fixture
        run: npm run check:cloudflare-config

      - name: Prepare owner fixture
        run: node scripts/create-owner-check-fixture.mjs

      - name: DB canonical checks
        env:
          FLAMENODE_OWNER_CHECK_DB: .tmp/owner-check.sqlite
        run: |
          npm run check:db-schema
          npm run check:db-migration
          npm run check:db-legacy
          npm run check:event-owners

      - name: D1 migration checks
        run: |
          npm run check:db-d1-empty
          npm run check:db-d1-legacy

      - name: UI and public API checks
        run: |
          npm run check:ui-acceptance
          npm run check:public-api-contract
          npm run check:public-api-leaks

      - name: Documentation and history checks
        run: |
          npm run check:project-docs
          npm run check:docs
          npm run check:db-history

      - name: Push verified integrated tree
        run: git push origin HEAD:agent/final-main-integration-v9

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: final-main-integration-v9-${{ github.run_id }}
          path: |
            .tmp
          if-no-files-found: ignore
          retention-days: 7
