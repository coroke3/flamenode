name: Apply canonical events brush-up

on:
  push:
    branches:
      - agent/db-canonical-events

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/db-canonical-events
          fetch-depth: 0
      - name: Apply reviewed changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          base = '4ff09c9060325a4241b5edd69e246880ae1cb966'

          def restore(path):
              content = subprocess.check_output(['git', 'show', f'{base}:{path}'], text=True)
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)

          restore('src/lib/actions/slot.ts')
          restore('src/components/event/SlotGrid.tsx')
          restore('src/components/event/SlotStatusBoard.tsx')

          slot = (root / 'src/lib/actions/slot.ts').read_text()
          slot = slot.replace(
              'import { events, slots, xUsers } from "@/lib/db/schema";',
              'import { events, slots, xUserAccountLinks } from "@/lib/db/schema";',
          )
          slot = slot.replace(
              '  const configured = Number(event.max_consecutive_slots_per_entry ?? 1);',
              '  const configured = Number(event.max_slots_per_video ?? 1);',
          )
          slot = slot.replace(
              '/** 全列を比較し、読取後の変更を version 以外の列でも検出する。 */',
              '/** 修正後正本の全13列を比較し、読取後の変更を検出する。 */',
          )
          for line in [
              '    sql`${slots.slot_kind} IS ${row.slot_kind}`,\n',
              '    sql`${slots.priority_reclaim_video_id} IS ${row.priority_reclaim_video_id}`,\n',
              '    sql`${slots.priority_reclaim_until} IS ${row.priority_reclaim_until}`,\n',
          ]:
              slot = slot.replace(line, '')
          slot = slot.replace(
              '''    return Boolean(\n      (\n        await db\n          .select({ id: xUsers.id })\n          .from(xUsers)\n          .where(\n            and(\n              eq(xUsers.id, row.x_user_id),\n              eq(xUsers.linked_user_id, userId),\n            )!,\n          )\n          .limit(1)\n      )[0],\n    );''',
              '''    return Boolean(\n      (\n        await db\n          .select({ x_user_id: xUserAccountLinks.x_user_id })\n          .from(xUserAccountLinks)\n          .where(\n            and(\n              eq(xUserAccountLinks.auth_user_id, userId),\n              eq(xUserAccountLinks.x_user_id, row.x_user_id),\n            )!,\n          )\n          .limit(1)\n      )[0],\n    );''',
          )
          slot = slot.replace(
              'message: `一度に確保できる連続枠は ${maxRows} 件までです。`,',
              'message: `このイベントでは1作品につき最大 ${maxRows} 枠まで取得できます。`,',
          )
          slot = slot.replace(
              'message: "連続枠の上限を超えるため拡張できません。"',
              'message: `このイベントでは1作品につき最大 ${eventAtomicLimit(event)} 枠までです。`',
          )
          slot = slot.replace(
              'message: "連続枠の上限を超えるため結合できません。"',
              'message: `このイベントでは1作品につき最大 ${eventAtomicLimit(event)} 枠までです。`',
          )
          slot = slot.replace(
              '    if (candidate.slot_kind !== anchor.slot_kind) {\n      return { ok: false, message: "種類が異なる枠は拡張できません。" };\n    }\n\n',
              '',
          )
          slot = slot.replace(
              '      left.slot_kind !== gap.slot_kind ||\n      right.slot_kind !== gap.slot_kind ||\n      left.status !== "reserved" ||',
              '      left.status !== "reserved" ||',
          )
          (root / 'src/lib/actions/slot.ts').write_text(slot)

          grid = (root / 'src/components/event/SlotGrid.tsx').read_text()
          grid = grid.replace(
              'export interface SlotRow {\n  id: string;\n  slot_kind: "time" | "count" | null;',
              'export interface SlotRow {\n  id: string;\n  event_id: string;',
          )
          grid = grid.replace(
              '  reservation_group_id?: string | null;\n}',
              '  reservation_group_id: string | null;\n  video_id: string | null;\n  updated_at: number;\n  version: number;\n}',
          )
          grid = grid.replace('  viewerDiscordId?: string | null;\n  viewerActiveX?: string | null;\n', '')
          grid = grid.replace(
              '  slotKind: "time" | "count";\n  maxConsecutiveSlots?: number;',
              '  slotType: "time" | "count";\n  maxSlotsPerVideo?: number;',
          )
          grid = grid.replace('  viewerDiscordId = null,\n  viewerActiveX = null,\n', '')
          grid = grid.replace(
              '  slotKind,\n  maxConsecutiveSlots = 1,',
              '  slotType,\n  maxSlotsPerVideo = 1,',
          )
          grid = grid.replace(
              'Math.max(Math.floor(maxConsecutiveSlots), 1)',
              'Math.max(Math.floor(maxSlotsPerVideo), 1)',
          )
          grid = grid.replace('if (slotKind !== "time")', 'if (slotType !== "time")')
          grid = grid.replace(
              '}, [displayRows, slotKind, slotPartGapSec]);',
              '}, [displayRows, slotType, slotPartGapSec]);',
          )
          grid = grid.replace(
              '  const canTakeSlot = canReserve && !!viewerXId;',
              '  const viewerActiveX = viewerXId;\n  const canTakeSlot = canReserve && !!viewerXId;',
          )
          grid = grid.replace('        <span><i className={styles.legendPriority} />優先再取得中</span>\n', '')
          grid = grid.replace(
              '{slotKind === "time" ? "日時" : "枠"}',
              '{slotType === "time" ? "日時" : "枠"}',
          )
          grid = grid.replace(
              '                  const isMine =\n                    (!!viewerXId && slot.x_user_id === viewerXId) ||\n                    (!slot.x_user_id && !!viewerDiscordId && slot.reserved_by_user_id === viewerDiscordId);',
              '                  const isMine =\n                    !!viewerXId && slot.x_user_id === viewerXId;',
          )
          grid = grid.replace(
              'aria-label={viewerDiscordId ? "空き。X ID 未選択" : "空き。ログインが必要です"}\n                            title={viewerDiscordId ? "X ID 未選択" : "ログインが必要です"}',
              'aria-label="空き。X ID の選択またはログインが必要です"\n                            title="X ID の選択またはログインが必要です"',
          )
          grid = grid.replace(
              '連続上限は {atomicMaxConsecutiveSlots} 枠です。',
              '1作品あたりの上限は {atomicMaxConsecutiveSlots} 枠です。',
          )
          grid = grid.replace(
              '連続枠は空きが隣接している場合だけまとめて確保されます。上限は {atomicMaxConsecutiveSlots} 枠です。',
              '隣接する空き枠だけをまとめて確保できます。1作品あたりの上限は {atomicMaxConsecutiveSlots} 枠です。',
          )
          (root / 'src/components/event/SlotGrid.tsx').write_text(grid)

          dashboard = (root / 'app/(auth)/dashboard/page.tsx').read_text()
          dashboard = dashboard.replace(
              'import {\n  sortSlotsChronologically,\n  type SlotBase,\n} from "@/lib/utils/slotGrouping";',
              'import {\n  collapseReservationGroups,\n  sortSlotsChronologically,\n  type SlotBase,\n  type SlotGroupRow,\n} from "@/lib/utils/slotGrouping";',
          )
          dashboard = dashboard.replace(
              '  let mySlot: SlotBase | null = null;',
              '  let mySlot: SlotGroupRow | null = null;',
          )
          dashboard = dashboard.replace(
              '      mySlot = sortSlotsChronologically(slotRows as SlotBase[])[0] ?? null;',
              '      const groupedSlots = collapseReservationGroups(slotRows as SlotBase[]);\n      mySlot = sortSlotsChronologically(groupedSlots)[0] ?? null;',
          )
          (root / 'app/(auth)/dashboard/page.tsx').write_text(dashboard)

          entry_path = root / 'app/(auth)/entry/page.tsx'
          entry = entry_path.read_text()
          entry = entry.replace(
              'import { sanitizeNextPath } from "#utils/next";',
              'import { sanitizeNextPath } from "#utils/next";\nimport {\n  collapseReservationGroups,\n  type SlotBase,\n  type SlotGroupRow,\n} from "@/lib/utils/slotGrouping";',
          )
          start = entry.index('type ReservedSlot = {')
          end = entry.index('};', start) + 2
          entry = entry[:start] + 'type ReservedSlot = SlotBase & {\n  event_title: string | null;\n  event_entry_end_time: number | null;\n};\n\ntype ReservedSlotGroup = SlotGroupRow &\n  Pick<ReservedSlot, "event_title" | "event_entry_end_time">;' + entry[end:]
          entry = entry.replace(
              '  reservedSlots.sort((a, b) => {',
              '  const reservedSlotGroups = collapseReservationGroups(\n    reservedSlots as SlotBase[],\n  ) as ReservedSlotGroup[];\n  reservedSlotGroups.sort((a, b) => {',
          )
          entry = entry.replace('{reservedSlots.length > 0 ? (', '{reservedSlotGroups.length > 0 ? (')
          entry = entry.replace(
              '<span className={styles.slotPanelCount}>{reservedSlots.length}件</span>',
              '<span className={styles.slotPanelCount}>{reservedSlotGroups.length}件</span>',
          )
          entry = entry.replace('{reservedSlots.map((slot) => {', '{reservedSlotGroups.map((slot) => {')
          entry = entry.replace(
              '                            {slot.event_title ?? slot.event_id}',
              '                            {slot.event_title ?? slot.event_id}\n                            {slot.group_size > 1 ? ` · ${slot.group_size}枠` : ""}',
          )
          entry_path.write_text(entry)

          public_slots = root / 'app/(public)/event/[id]/slots/page.tsx'
          page = public_slots.read_text().replace(
              '            slotType={(event.slot_type ?? "time") as "time" | "count"}\n            slotPartGapSec={slotPartGapSec}',
              '            slotType={(event.slot_type ?? "time") as "time" | "count"}\n            maxSlotsPerVideo={event.max_slots_per_video}\n            slotPartGapSec={slotPartGapSec}',
          )
          public_slots.write_text(page)

          submit_path = root / 'src/lib/actions/video/submitSlotVideo.ts'
          submit = submit_path.read_text().replace(
              'import { and, eq, isNull, or } from "drizzle-orm";',
              'import { and, asc, eq, isNull, or } from "drizzle-orm";',
          )
          old = '''  const slotGroupWhere = slotRow.reservation_group_id\n    ? and(\n        eq(slots.reservation_group_id, slotRow.reservation_group_id),\n        eq(slots.event_id, slotRow.event_id),\n        eq(slots.reserved_by_user_id, userId),\n        slotRow.x_user_id ? eq(slots.x_user_id, slotRow.x_user_id) : isNull(slots.x_user_id),\n      )!\n    : eq(slots.id, slotRow.id);\n  const submittedSlots = await db\n    .select()\n    .from(slots)\n    .where(slotGroupWhere)\n    .limit(MAX_ATOMIC_SUBMITTED_SLOTS + 1);\n  if (submittedSlots.length === 0 || submittedSlots.length > MAX_ATOMIC_SUBMITTED_SLOTS) {\n    return { ok: false, message: "同時に更新する枠数が上限を超えています。" };\n  }'''
          new = '''  const eventConfig = (\n    await db\n      .select({ max_slots_per_video: eventsTable.max_slots_per_video })\n      .from(eventsTable)\n      .where(eq(eventsTable.id, slotRow.event_id))\n      .limit(1)\n  )[0];\n  if (!eventConfig) {\n    return { ok: false, message: "イベントが見つかりません。" };\n  }\n\n  const slotGroupWhere = slotRow.reservation_group_id\n    ? and(\n        eq(slots.reservation_group_id, slotRow.reservation_group_id),\n        eq(slots.event_id, slotRow.event_id),\n        eq(slots.reserved_by_user_id, userId),\n        slotRow.x_user_id\n          ? eq(slots.x_user_id, slotRow.x_user_id)\n          : isNull(slots.x_user_id),\n      )!\n    : eq(slots.id, slotRow.id);\n  const submittedSlots = await db\n    .select()\n    .from(slots)\n    .where(slotGroupWhere)\n    .orderBy(asc(slots.start_time), asc(slots.sort_order), asc(slots.id))\n    .limit(MAX_ATOMIC_SUBMITTED_SLOTS + 1);\n  if (submittedSlots.length === 0) {\n    return { ok: false, message: "提出対象の枠が見つかりません。" };\n  }\n  if (submittedSlots.some((row) => row.status !== "reserved")) {\n    return { ok: false, message: "予約中でない枠を含むため提出できません。" };\n  }\n  if (submittedSlots.length > eventConfig.max_slots_per_video) {\n    return {\n      ok: false,\n      message: `このイベントでは1作品につき最大 ${eventConfig.max_slots_per_video} 枠までです。`,\n    };\n  }\n  if (submittedSlots.length > MAX_ATOMIC_SUBMITTED_SLOTS) {\n    return { ok: false, message: "同時に更新する枠数がシステム上限を超えています。" };\n  }'''
          if old not in submit:
              raise RuntimeError('submitSlotVideo target not found')
          submit_path.write_text(submit.replace(old, new))

          event_admin_path = root / 'src/lib/actions/event-admin.ts'
          event_admin = event_admin_path.read_text().replace(
              'import { and, eq, inArray, or } from "drizzle-orm";',
              'import { and, asc, desc, eq, inArray, or, sql } from "drizzle-orm";',
          )
          event_admin = event_admin.replace(
              '      .where(eq(xUserAccountLinks.auth_user_id, actorUserId))\n      .limit(1)',
              '      .where(eq(xUserAccountLinks.auth_user_id, actorUserId))\n      .orderBy(\n        desc(\n          sql`CASE WHEN ${xUserAccountLinks.x_user_id} = ${guard.user.active_x_user_id ?? ""} THEN 1 ELSE 0 END`,\n        ),\n        asc(xUserAccountLinks.created_at),\n        asc(xUserAccountLinks.x_user_id),\n      )\n      .limit(1)',
              1,
          )
          event_admin_path.write_text(event_admin)

          worker_path = root / 'workers/json-generator/rebuild.ts'
          worker = worker_path.read_text()
          worker = worker.replace('  max_slots_per_video, max_consecutive_slots_per_entry,\n', '  max_slots_per_video,\n')
          worker = worker.replace('ORDER BY e.start_time DESC, e.id ASC', 'ORDER BY e.start_time DESC, e.created_at DESC')
          worker = worker.replace('`SELECT es.role, es.display_name, es.public_role_label,', '`SELECT es.display_name, es.public_role_label,')
          worker_path.write_text(worker)

          queries_path = root / 'src/lib/db/queries.ts'
          queries_path.write_text(
              queries_path.read_text().replace(
                  '      role: eventStaff.role,',
                  '      permission_preset: eventStaff.permission_preset,',
              )
          )

          export_test = root / 'src/lib/eventExportPayload.test.mjs'
          test_source = export_test.read_text()
          test_source = test_source.replace('          chapters_json: \'[{"time_seconds":12,"label":"担当","end_seconds":24}]\',\n', '')
          test_source = test_source.replace('          show_on_player_bar: 1,\n          order_index: 0,\n', '')
          test_source = test_source.replace('  assert.equal(video.members[0].chapters[0].time_seconds, 12);\n  assert.equal(video.members[0].chapters[0].end_seconds, 24);\n', '')
          test_source = test_source.replace('  assert.equal(row.starts, "12");\n  assert.equal(row.ends, "24");', '  assert.equal(row.starts, "30");\n  assert.equal(row.ends, "");')
          export_test.write_text(test_source)
          PY

          cat > .github/workflows/export-agent-source.yml <<'ORIGINAL_WORKFLOW'
          name: Agent source export

          on:
            push:
              branches:
                - agent/db-canonical-migration-v2
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            export:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/upload-artifact@v4
                  with:
                    name: agent-source-${{ github.run_id }}
                    path: |
                      .
                      !.git/**
                      !node_modules/**
                      !.next/**
                      !.vercel/**
                    include-hidden-files: true
                    retention-days: 1
          ORIGINAL_WORKFLOW

          git add .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "イベント・owner・枠・公開API移行を正本仕様へ再調整"
          git push origin HEAD:agent/db-canonical-events
