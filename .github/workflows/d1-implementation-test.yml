name: D1 Implementation Test

on:
  push:
    branches:
      - agent/d1-max-read-reduction
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: d1-implementation-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove temporary workflow from validation worktree
        run: |
          rm -f .github/workflows/d1-implementation-test.yml
          git update-index --assume-unchanged .github/workflows/d1-implementation-test.yml || true

      - name: Install dependencies
        run: npm ci

      - name: Reproduce DB validation sequence
        run: |
          npm run check:db-schema
          npm run check:db-migration
          npm run check:db-d1-empty
          npm run check:db-d1-legacy

      - name: Capture legacy DB check
        id: legacy
        shell: bash
        run: |
          set +e
          npm run check:db-legacy > db-legacy.log 2>&1
          status=$?
          set -e
          cat db-legacy.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload legacy check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-legacy-log
          path: db-legacy.log
          if-no-files-found: error

      - name: Fail if legacy DB check failed
        if: steps.legacy.outputs.status != '0'
        run: exit 1
