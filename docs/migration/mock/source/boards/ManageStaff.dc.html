<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スタッフと権限</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <div class="c-side"><dc-import name="ManageNav" theme="{{theme}}" active="staff" hint-size="100%,900px"></dc-import></div>
  <main class="c-main">
    <dc-import name="ManageEventHead" theme="{{theme}}" tab="staff" hint-size="100%,96px"></dc-import>

    <nav class="subnav" aria-label="スタッフと権限" style="margin-top: 24px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><a href="#" class="il" aria-current="{{t.cur}}" onClick="{{t.pick}}"><i class="{{t.icon}}" aria-hidden="true"></i>{{t.label}}</a></sc-for>
    </nav>

    <!-- メンバー一覧 -->
    <sc-if value="{{tList}}" hint-placeholder-val="{{false}}">
      <div class="sl-list" role="table" aria-label="スタッフ" style="margin-top: 24px;">
        <div class="sl-h" role="row"><span>メンバー</span><span>担当</span><span>公開肩書</span><span></span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <div class="sl-r" role="row">
            <span class="row" style="gap: 10px; min-width: 0;"><img class="avatar" src="{{r.icon}}" alt="" style="width: 32px; height: 32px;"><span class="stack" style="gap: 0; min-width: 0;"><span class="ell">{{r.name}}</span><span class="t-sm muted ell">{{r.xid}}</span></span></span>
            <span><sc-if value="{{r.owner}}" hint-placeholder-val="{{false}}"><span class="il"><i class="fa-solid fa-crown" aria-hidden="true"></i>代表</span></sc-if><sc-if value="{{r.editable}}" hint-placeholder-val="{{true}}"><span class="sel-i"><select class="select" aria-label="担当" onChange="{{r.setPreset}}"><sc-for list="{{r.opts}}" as="o" hint-placeholder-count="7"><option value="{{o.v}}" selected="{{o.sel}}">{{o.label}}</option></sc-for></select></span></sc-if></span>
            <span class="t-sm sl-title">{{r.title}}<span class="muted"> · {{r.pub}}</span></span>
            <span class="row sl-acts" style="gap: 4px; justify-content: flex-end;"><sc-if value="{{r.editable}}" hint-placeholder-val="{{true}}"><button type="button" class="ib sm" aria-label="権限を個別に設定" title="権限を個別に設定" onClick="{{toMatrix}}"><i class="fa-solid fa-key"></i></button><button type="button" class="ib sm" aria-label="外す" title="外す"><i class="fa-solid fa-user-minus"></i></button></sc-if></span>
          </div>
        </sc-for>
      </div>

      <section class="c-sec" aria-labelledby="add">
        <h2 id="add" class="t-h3" style="margin-bottom: 12px;">スタッフを追加</h2>
        <form class="wrap-row" style="gap: 8px; align-items: flex-end;" onSubmit="{{prevent}}">
          <div class="field-i" style="width: 220px;"><x-import component-from-global-scope="FlameNode.TextField" label="X ID(@なし)" placeholder="username"></x-import><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></div>
          <label class="field"><span>担当</span><select class="select"><option>運営</option><option>枠管理担当</option><option>作品修正担当</option><option>レビュー担当</option><option>X ID 確認担当</option><option selected="{{yes}}">表示のみスタッフ</option><option>カスタム</option></select></label>
          <div style="width: 180px;"><x-import component-from-global-scope="FlameNode.TextField" label="公開肩書" placeholder="例: 配信"></x-import></div>
          <div style="flex: 1 1 200px;"><x-import component-from-global-scope="FlameNode.TextField" label="追加理由" placeholder="監査ログに残ります"></x-import></div>
          <button type="submit" class="fn-btn fn-btn--primary">追加</button>
        </form>
      </section>
    </sc-if>

    <!-- 権限マトリクス -->
    <sc-if value="{{tMatrix}}" hint-placeholder-val="{{true}}">
      <div class="wrap-row" style="justify-content: space-between; gap: 16px; margin-top: 24px;">
        <p class="il t-sm muted" style="margin: 0;"><i class="fa-solid fa-hand-pointer" aria-hidden="true"></i>マスを押して付け外し。担当の既定と違えば「カスタム」になります。</p>
        <span class="t-sm muted il"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true" style="color: var(--warning);"></i>危険な権限は付与時に理由が必要です</span>
      </div>
      <div class="t-scroll" style="margin-top: 16px;">
        <div class="pmg" role="table" aria-label="権限の詳細">
          <div class="pmg-row pmg-grp" role="row"><span></span><span></span><sc-for list="{{groups}}" as="g" hint-placeholder-count="3"><span style="grid-column: span {{g.n}};">{{g.label}}</span></sc-for></div>
          <div class="pmg-row pmg-keys" role="row"><span>メンバー</span><span>担当</span><sc-for list="{{keys}}" as="k" hint-placeholder-count="23"><span class="{{k.cls}}" title="{{k.desc}}"><span>{{k.label}}</span></span></sc-for></div>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
            <div class="pmg-row pmg-body" role="row">
              <span class="row" style="gap: 10px; min-width: 0;"><img class="avatar" src="{{r.icon}}" alt="" style="width: 24px; height: 24px;"><span class="ell">{{r.name}}</span></span>
              <span class="pm-pre-c"><span class="{{r.preCls}}">{{r.presetLabel}}</span></span>
              <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="23"><span class="{{c.cls}}"><button type="button" aria-label="{{c.aria}}" aria-pressed="{{c.on}}" disabled="{{c.lock}}" onClick="{{c.toggle}}"><i class="{{c.icon}}" aria-hidden="true"></i></button></span></sc-for>
            </div>
          </sc-for>
        </div>
      </div>
      <sc-if value="{{dirty}}" hint-placeholder-val="{{false}}">
        <div class="savebar"><span class="t-sm">{{dirtyText}}</span><span class="row" style="gap: 8px;"><button type="button" class="fn-btn fn-btn--tertiary fn-btn--sm" onClick="{{reset}}">元に戻す</button><button type="button" class="fn-btn fn-btn--primary fn-btn--sm" onClick="{{reset}}">変更を保存</button></span></div>
      </sc-if>
    </sc-if>

    <!-- 移譲・CSV -->
    <sc-if value="{{tMore}}" hint-placeholder-val="{{false}}">
      <div class="cols2" style="margin-top: 24px; align-items: start;">
        <section class="raised stack" style="gap: 12px; padding: 20px 24px;">
          <h3 class="t-h3">代表権限の移譲</h3>
          <label class="field"><span>移譲先</span><select class="select"><option>おたこ (@012345rty)</option><option>スティックのり (@Sticknorikun)</option><option>lalaClione (@lala_Clione)</option></select></label>
          <x-import component-from-global-scope="FlameNode.TextField" label="移譲理由" placeholder="監査ログに残ります"></x-import>
          <div><button type="button" class="fn-btn fn-btn--danger fn-btn--sm">代表権限を移譲</button></div>
        </section>
        <section class="raised stack" style="gap: 12px; padding: 20px 24px;">
          <h3 class="t-h3">スタッフCSV反映</h3>
          <label class="drop" style="padding: 16px;"><i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i><span class="t-sm">CSV を選ぶ(列: x_user_id, preset, public_title)</span><input type="file" accept=".csv" hidden></label>
          <x-import component-from-global-scope="FlameNode.TextField" label="反映理由" placeholder="監査ログに残ります"></x-import>
          <div><button type="button" class="fn-btn fn-btn--secondary fn-btn--sm">スタッフCSV反映</button></div>
        </section>
      </div>
    </sc-if>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"tab":{"editor":"enum","options":["list","matrix","more"],"default":"list"},"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { tab: null, edits: {} };
  }
  renderVals() {
    const s = this.state;
    const tab = s.tab || this.props.tab || 'list';
    // src/lib/auth/permissions/keys.ts の定義順・ラベル
    const K = [
      ['event.basic','基本情報','イベント'],['event.publish','募集・公開','イベント'],['event.slots','枠管理','イベント'],['event.members','スタッフ管理','イベント',1],['event.questions','投稿フォーム','イベント'],['event.review','審査・承認','イベント'],['event.notifications','通知・受信箱','イベント'],
      ['video.basics','基本情報','作品'],['video.descriptions','作品説明','作品'],['video.credits','楽曲','作品'],['video.members','メンバー','作品'],['video.member_chapters','チャプター','作品'],['video.status','公開状態','作品'],['video.primary_event','所属イベント','作品',1],['video.youtube_id','YouTube ID','作品',1],['video.identity','提出名義','作品',1],['video.permissions','共同編集','作品',1],
      ['event.public_api','公開API','公開データ',1],['event.static_rebuild','静的JSON','公開データ',1],['xid.link_requests','X ID 申請','公開データ']
    ];
    const P = {
      owner: ['代表', ['event.basic','event.publish','event.slots','event.members','event.questions','event.review','event.notifications','video.basics','video.descriptions','video.credits','video.members','video.member_chapters','video.status','video.permissions']],
      manager: ['運営', ['event.basic','event.publish','event.slots','event.questions','event.review','event.notifications','video.basics','video.descriptions','video.credits','video.members','video.member_chapters','video.status','video.permissions']],
      slot_manager: ['枠管理担当', ['event.slots']],
      content_editor: ['作品修正担当', ['video.basics','video.descriptions','video.credits','video.members','video.member_chapters']],
      reviewer: ['レビュー担当', ['event.review','video.status']],
      xid_reviewer: ['X ID 確認担当', ['xid.link_requests']],
      public_staff: ['表示のみスタッフ', []],
      custom: ['カスタム', []]
    };
    const base = [
      { id: 'a', name: '新概念', xid: '@metameta194', icon: '/_blob/525c7209e503b8327cbd5bf4a64e5fc8', preset: 'owner', title: '代表', pub: true },
      { id: 'b', name: 'おたこ', xid: '@012345rty', icon: '/_blob/fc027fe6fe3a001a22a1933270ce72b9', preset: 'manager', title: '運営', pub: true },
      { id: 'c', name: 'スティックのり', xid: '@Sticknorikun', icon: '/_blob/f5c1a8af077b887c7bb1d043f3cf69c1', preset: 'reviewer', title: '審査', pub: true },
      { id: 'd', name: 'lalaClione', xid: '@lala_Clione', icon: '/_blob/755d245a064a6f5935c3dccd9a941048', preset: 'slot_manager', title: '配信', pub: false },
      { id: 'e', name: 'あいこーすふぃあ', xid: '@Ico_sphere_', icon: '/_blob/191c3939aefb326fc04fd3ccf6db83a9', preset: 'public_staff', title: '—', pub: false }
    ];
    const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
    let changed = 0;
    const rows = base.map(m => {
      const e = s.edits[m.id];
      const perms = e ? e.perms : P[m.preset][1];
      const preset = e ? e.preset : m.preset;
      if (e) changed++;
      const owner = m.preset === 'owner';
      const setPerms = (np) => {
        const hit = Object.keys(P).find(k => k !== 'custom' && k !== 'owner' && same(P[k][1], np));
        this.setState({ edits: { ...this.state.edits, [m.id]: { perms: np, preset: hit || 'custom' } } });
      };
      return {
        ...m, owner, editable: !owner, presetLabel: P[preset][0],
        preCls: preset === 'custom' ? 'pm-custom' : '',
        pubDot: m.pub ? 'dot ok' : 'dot', pub: m.pub ? '公開' : '非公開',
        opts: Object.keys(P).filter(k => k !== 'owner').map(k => ({ v: k, label: P[k][0], sel: k === preset })),
        setPreset: (ev) => { const v = ev.target.value; this.setState({ edits: { ...this.state.edits, [m.id]: { perms: [...P[v][1]], preset: v } } }); },
        cells: K.map(([key, label, grp, danger], i) => {
          const on = perms.includes(key);
          const first = i === 0 || K[i - 1][2] !== grp;
          return {
            on, lock: owner,
            cls: ['pm-c', on ? 'on' : '', danger ? 'danger' : '', first ? 'gs' : ''].join(' ').trim(),
            icon: on ? (danger ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-check') : 'fa-solid fa-minus',
            aria: m.name + ' — ' + label + (on ? ' 付与済み' : ' 未付与'),
            toggle: () => setPerms(on ? perms.filter(x => x !== key) : [...perms, key])
          };
        })
      };
    });
    const groups = [['イベント', 7], ['作品', 10], ['公開データ・X ID', 3]].map(([label, n]) => ({ label, n }));
    const keys = K.map(([key, label, grp, danger], i) => ({ label, desc: key, cls: ['pm-k', danger ? 'danger' : '', (i === 0 || K[i - 1][2] !== grp) ? 'gs' : ''].join(' ').trim() }));
    const T = [['list', 'メンバー', 'fa-solid fa-users'], ['matrix', '権限の詳細', 'fa-solid fa-key'], ['more', '移譲・CSV', 'fa-solid fa-crown']];
    return {
      theme: this.props.theme ?? 'dark', yes: true, prevent: (e) => e.preventDefault(),
      tabs: T.map(([id, label, icon]) => ({ label, icon, cur: tab === id ? 'page' : 'false', pick: (e) => { e.preventDefault(); this.setState({ tab: id }); } })),
      tList: tab === 'list', tMatrix: tab === 'matrix', tMore: tab === 'more',
      toMatrix: () => this.setState({ tab: 'matrix' }),
      rows, groups, keys,
      dirty: changed > 0, dirtyText: changed + ' 人の権限を変更中 · 保存すると監査ログと「履歴」に残ります',
      reset: () => this.setState({ edits: {} })
    };
  }
}
</script>
</body>
</html>
