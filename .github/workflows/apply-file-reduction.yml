name: 共通化差分を適用

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/agent/apply-file-reduction.trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/maximize-file-reduction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: agent/maximize-file-reduction

      - name: 最新mainへ差分を適用
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent/file-reduction.patch.gz.b64.small-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/file-reduction.patch
          git fetch --depth=1 origin main:refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
          git apply --index /tmp/file-reduction.patch

      - name: 依存関係を取得
        run: npm ci

      - name: 型検査
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 単体テスト
        run: npm run test:unit

      - name: 統合テスト
        shell: bash
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration-test.log

      - name: 統合テストログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-log
          path: integration-test.log
          retention-days: 1

      - name: UI契約検査
        run: npm run check:ui-acceptance

      - name: 本番ビルド
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: ビルドログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 1

      - name: 日本語コミットで反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "挙動を維持したまま共通化してファイル数を削減"
          git push --force origin HEAD:agent/maximize-file-reduction
