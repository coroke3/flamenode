name: Agent PR88 fix touched runtime

on:
  push:
    branches:
      - agent/ux-and-status-simplification
    paths:
      - .github/workflows/agent-pr88-fix-touched-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-and-status-simplification
          fetch-depth: 0
      - name: Remove remaining legacy references in PR88 touched files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          event_admin = Path('src/lib/actions/event-admin.ts')
          text = event_admin.read_text()
          text = text.replace('visibility_status: "archived" as const,', 'visibility_status: "private" as const,')
          text = text.replace('.set({ visibility_status: "archived", updated_at: now })', '.set({ visibility_status: "private", updated_at: now })')
          text = text.replace('reason: "event_archive",', 'reason: "event_private",')
          event_admin.write_text(text)

          manage_edit = Path('app/(manage)/manage/events/[id]/edit/page.tsx')
          text = manage_edit.read_text()
          text = text.replace(
              '            max_consecutive_slots_per_entry:\n              ev.max_consecutive_slots_per_entry,\n',
              '',
          )
          manage_edit.write_text(text)

          dashboard = Path('app/(auth)/dashboard/page.tsx')
          text = dashboard.read_text()
          text = text.replace(',\n  type SlotBase,', ',')
          text = text.replace('let mySlot: SlotBase | null = null;', 'let mySlot: typeof slotsTable.$inferSelect | null = null;')
          text = text.replace('sortSlotsChronologically(slotRows as SlotBase[])[0]', 'sortSlotsChronologically(slotRows)[0]')
          dashboard.write_text(text)

          event_page = Path('app/(public)/event/[id]/page.tsx')
          text = event_page.read_text()
          text = text.replace('type SlotVisualStatus = SlotRow["status"] | "priority";', 'type SlotVisualStatus = SlotRow["status"];')
          old = '''function slotVisualStatus(slot: SlotRow, now: number): SlotVisualStatus {
            if (
              slot.priority_reclaim_until != null &&
              slot.priority_reclaim_until > now &&
              slot.status !== "available"
            ) {
              return "priority";
            }
            return slot.status;
          }

          function slotStatusLabel(status: SlotVisualStatus): string {
            if (status === "priority") return "優先再取得中";
          '''
          new = '''function slotVisualStatus(slot: SlotRow, _now: number): SlotVisualStatus {
            return slot.status;
          }

          function slotStatusLabel(status: SlotVisualStatus): string {
          '''
          if old not in text:
              raise SystemExit('public event slot visual block did not match')
          event_page.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/agent-pr88-fix-touched-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "状態整理対象runtimeの旧参照を除去"
          git push origin HEAD:agent/ux-and-status-simplification
