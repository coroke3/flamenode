name: Apply DB canonical foundation patch

on:
  pull_request:
    branches:
      - agent/db-canonical-migration-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/db-canonical-foundation
          fetch-depth: 0

      - name: Rebuild verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/db-canonical-foundation.patch.part-* > /tmp/db-canonical-foundation.patch.gz.b64
          base64 --decode /tmp/db-canonical-foundation.patch.gz.b64 > /tmp/db-canonical-foundation.patch.gz
          gzip --decompress --stdout /tmp/db-canonical-foundation.patch.gz > /tmp/db-canonical-foundation.patch
          echo "2d749659cb29c97b5524bbec443d06cb0248bdc84716fb0d3646f7323a68b436  /tmp/db-canonical-foundation.patch" | sha256sum --check

      - name: Apply non-workflow patch
        shell: bash
        run: git apply --index --exclude=.github/workflows/ci.yml /tmp/db-canonical-foundation.patch

      - name: Commit DB foundation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "DB正本移行の安全性検証を強化"

      - name: Push DB foundation
        shell: bash
        run: git push origin HEAD:agent/db-canonical-foundation
