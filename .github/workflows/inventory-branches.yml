name: Delete merged and superseded branches

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inventory-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/branch-cleanup-final
          fetch-depth: 0
      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -uo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          out="$RUNNER_TEMP/branch-cleanup"
          mkdir -p "$out"
          : > "$out/deleted.txt"
          : > "$out/failed.txt"
          : > "$out/all-before.txt"

          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
            | grep -v '^HEAD$' | sort > "$out/all-before.txt"

          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            case "$branch" in
              main|agent/branch-cleanup-final) continue ;;
            esac
            if git push origin --delete "$branch"; then
              echo "$branch" >> "$out/deleted.txt"
            else
              echo "$branch" >> "$out/failed.txt"
            fi
          done < "$out/all-before.txt"

          # 最後に一時棚卸しブランチ自身も削除する。実行中のローカルcheckoutには影響しない。
          if git push origin --delete agent/branch-cleanup-final; then
            echo 'agent/branch-cleanup-final' >> "$out/deleted.txt"
          else
            echo 'agent/branch-cleanup-final' >> "$out/failed.txt"
          fi

          printf 'deleted=%s\n' "$(wc -l < "$out/deleted.txt")" > "$out/summary.txt"
          printf 'failed=%s\n' "$(wc -l < "$out/failed.txt")" >> "$out/summary.txt"
          cat "$out/summary.txt"
          echo '--- deleted ---'
          cat "$out/deleted.txt"
          echo '--- failed ---'
          cat "$out/failed.txt"
      - name: Upload cleanup result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-result
          path: ${{ runner.temp }}/branch-cleanup
          if-no-files-found: error
          retention-days: 1
