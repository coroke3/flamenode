name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      # 実在しない値だけをPR CIに渡す。Cloudflare IDやOAuth secretは不要。
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify dependency tree
        run: npm ls --depth=0

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Typecheck
        shell: bash
        run: |
          mkdir -p .tmp
          set -o pipefail
          npm run typecheck 2>&1 | tee .tmp/typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics-${{ github.run_id }}
          path: .tmp/typecheck.log
          if-no-files-found: warn
          retention-days: 3

      - name: Lint
        run: npm run lint

      # test:unit already includes workers/**/*.test.mjs.
      - name: Unit and worker tests
        shell: bash
        run: |
          mkdir -p .tmp
          set -o pipefail
          npm run test:unit 2>&1 | tee .tmp/unit-tests.log

      - name: Upload unit test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics-${{ github.run_id }}
          path: .tmp/unit-tests.log
          if-no-files-found: warn
          retention-days: 3

      - name: Cloudflare CI contract tests
        run: npm run test:cloudflare-ci

      - name: Integration tests
        run: npm run test:integration

      # next-on-pages performs the production Next build; a separate next build is duplicate work.
      - name: Cloudflare Pages production build
        shell: bash
        run: |
          mkdir -p .tmp
          set -o pipefail
          npm run pages:build 2>&1 | tee .tmp/pages-build.log

      - name: Upload Pages build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-build-diagnostics-${{ github.run_id }}
          path: .tmp/pages-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Pages output check
        run: npm run check:pages-output

      - name: Cloudflare template check
        run: npm run check:cloudflare-template

      - name: Cloudflare fixture config check
        run: npm run check:cloudflare-config
        env:
          CLOUDFLARE_CONFIG_MODE: fixture

      - name: Prepare owner-check fixture database
        run: node scripts/create-owner-check-fixture.mjs

      - name: DB and owner checks
        env:
          FLAMENODE_OWNER_CHECK_DB: .tmp/owner-check.sqlite
        run: |
          npm run check:db-schema
          npm run check:db-legacy
          npm run check:event-owners

      - name: UI acceptance contracts
        run: npm run check:ui-acceptance

      - name: Project document checks
        run: npm run check:project-docs

      - name: Active documentation and DB history checks
        run: |
          npm run check:docs
          npm run check:db-history

  report-main:
    if: always() && github.event_name == 'push' && github.actor != 'github-actions[bot]'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record result only for the current main HEAD
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_sha="$(git rev-parse origin/main)"
          if [ "$current_sha" != "$CANDIDATE_SHA" ]; then
            echo "main moved to $current_sha; result for $CANDIDATE_SHA is intentionally not recorded."
            exit 0
          fi
          git reset --hard origin/main
          if [ "$VERIFY_RESULT" = "success" ]; then
            verdict="PASS"
          else
            verdict="FAIL"
          fi
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > docs/operations/last-main-ci.md <<EOF
          # 最新mainのCI結果

          > Status: Active
          > Result: ${verdict}
          > Verify job: ${VERIFY_RESULT}
          > Candidate commit: ${CANDIDATE_SHA}
          > Completed at: ${completed_at}
          > Workflow run: ${RUN_URL}

          この結果は、workflow完了時点でもCandidate commitがmain HEADだった場合だけ記録されます。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/last-main-ci.md
          git commit -m "CI: mainの検証結果を記録 ${CANDIDATE_SHA:0:7} (${verdict})"
          git push origin HEAD:main
