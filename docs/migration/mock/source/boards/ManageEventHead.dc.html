    <h1 class="t-display" style="margin: 0;">{{title}}</h1>
  </div></sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"tab":{"editor":"text","default":"overview"},"sub":{"editor":"text","default":""},"$preview":{"width":1100,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.sub || this.props.tab || 'overview';
    const M = {
      overview: ['概要', 'ms ms-dashboard', '今やることと進行状況'],
      inbox: ['受信箱', 'fa-solid fa-inbox', '審査・モデレーション・申請・通知失敗をまとめて処理'],
      pending: ['作品', 'fa-solid fa-film', '公開状態の確認と審査'],
      videos: ['作品', 'fa-solid fa-film', '公開状態の確認と審査'],
      slots: ['枠', 'ms ms-view_timeline', '生成・確保状況・一括操作'],
      audience: ['参加者', 'fa-solid fa-user-group', '登録者と提出状況'],
      playlist: ['配信・公開', 'ms ms-sensors', '再生リスト同期・作品情報API・公開データ更新'],
      delivery: ['配信・公開', 'ms ms-sensors', '再生リスト同期・作品情報API・公開データ更新'],
      edit: ['イベント設定', 'fa-solid fa-sliders', '基本情報・募集・投稿フォーム・枠ルール'],
      staff: ['スタッフと権限', 'ms ms-admin_panel_settings', '誰が何をできるか'],
      history: ['履歴', 'fa-solid fa-clock-rotate-left', 'このイベントで行われた変更と復元']
    }[k] || ['概要', 'ms ms-dashboard', ''];
    return {
      theme: this.props.theme ?? 'dark', title: M[0], icon: M[1], desc: M[2], showTitle: !this.props.notitle };
  }
}
</script>
