name = "flamenode-web"

main = ".open-next/worker.js"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

# Workers Builds may still run bare `wrangler deploy` against this tracked template.
# The build hook fails closed in WORKERS_CI before placeholder bindings can deploy.
[build]
command = "node scripts/workers-ci-wrangler-guard.mjs"

[observability]
enabled = true

# Dynamic requests are D1/R2/API heavy. Smart Placement lets Cloudflare run
# fetch handlers closer to the dominant backend only when that is faster.
# Static assets still bypass the Worker and remain edge-local below.
[placement]
mode = "smart"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = false

# OpenNext uses a self-service binding for cache revalidation.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "flamenode-web"

# Public, non-secret defaults. Production origins and BUILD_COMMIT_SHA are
# injected into the generated production config by the deploy verifier.
[vars]
NEXT_PUBLIC_SITE_NAME = "FlameNode"
NEXT_PUBLIC_SITE_DESCRIPTION = "動画とイベントをつなぐ動画プラットフォーム"
# Phase 1: Queue dispatch disabled by default (enable via runtime vars).
QUEUE_DISPATCH_ENABLED = "0"
QUEUE_CONTINUATION_ENABLED = "0"
QUEUE_YOUTUBE_SYNC_ENABLED = "0"
# R2 miss 後の bounded D1 fallback。明示 0 で停止。
PUBLIC_DEGRADED_D1_ENABLED = "1"
# Public visibility fence: observe = log-only, enforce = block. Build Variables で上書き可。
PUBLIC_VISIBILITY_GUARD_MODE = "observe"

[[queues.producers]]
queue = "flamenode-notification-wake"
binding = "NOTIFICATION_WAKE_QUEUE"

[[queues.producers]]
queue = "flamenode-static-rebuild-wake"
binding = "STATIC_REBUILD_WAKE_QUEUE"

[[queues.producers]]
queue = "flamenode-youtube-sync-wake"
binding = "YOUTUBE_SYNC_WAKE_QUEUE"

# Template bindings intentionally use placeholder IDs. Production deployment
# creates an ignored temporary config from verified Workers Builds variables.
[[d1_databases]]
binding = "DB"
database_name = "flamenode_db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "flamenode-storage"

# OpenNext incremental cache shares the existing R2 bucket under its own key
# prefix, avoiding another production resource while preserving revalidation.
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "flamenode-storage"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
