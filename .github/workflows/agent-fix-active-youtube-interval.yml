name: Apply active YouTube interval

on:
  push:
    branches:
      - agent/free-tier-background-worker

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/free-tier-background-worker
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 開催中イベントの期限を適用
        run: node scripts/agent-fix-active-youtube-interval.mjs
      - name: 変更をcommitしてpush
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep active event YouTube metadata within one hour"
          git push origin HEAD:agent/free-tier-background-worker
