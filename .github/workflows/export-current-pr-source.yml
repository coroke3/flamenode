name: Export current PR source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive integration source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=/tmp/flamenode-pr-source.zip HEAD
          git archive --format=zip --output=/tmp/flamenode-main-source.zip origin/main
          git archive --format=zip --output=/tmp/flamenode-x-identity-source.zip origin/agent/db-canonical-x-identity
          git archive --format=zip --output=/tmp/flamenode-events-source.zip origin/agent/db-canonical-events
      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flamenode-integration-sources-${{ github.run_id }}
          path: |
            /tmp/flamenode-pr-source.zip
            /tmp/flamenode-main-source.zip
            /tmp/flamenode-x-identity-source.zip
            /tmp/flamenode-events-source.zip
          retention-days: 1
