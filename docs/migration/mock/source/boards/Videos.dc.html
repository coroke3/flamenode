        <sc-for list="{{videos}}" as="v" hint-placeholder-count="12">
          <a href="VideoDetail.dc.html" style="display: block;">
            <x-import component-from-global-scope="FlameNode.VideoCard" title="{{v.title}}" thumbnail="{{v.thumb}}" duration="{{v.dur}}" creator="{{v.creator}}" creator-icon="{{v.cicon}}"></x-import>

        </sc-for>
      </div>

    <sc-if value="{{isList}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 32px;">
        <sc-for list="{{videos}}" as="v" hint-placeholder-count="12">
          <x-import component-from-global-scope="FlameNode.Row" title="{{v.title}}" meta="{{v.meta}}" thumbnail="{{v.thumb}}" on-click="{{noop}}"></x-import>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{isCompact}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 32px; columns: 2 420px; column-gap: 24px;">
        <sc-for list="{{videos}}" as="v" hint-placeholder-count="12">
          <x-import component-from-global-scope="FlameNode.Row" compact="{{yes}}" title="{{v.title}}" meta="{{v.meta}}" on-click="{{noop}}"></x-import>

      </div>

    <nav aria-label="ページ移動" class="row" style="gap: 0; margin-top: 56px;">

      <x-import component-from-global-scope="FlameNode.Button" variant="secondary" size="sm" aria-current="page">1</x-import>
      <x-import component-from-global-scope="FlameNode.Button" variant="tertiary" size="sm">2</x-import>
      <x-import component-from-global-scope="FlameNode.Button" variant="tertiary" size="sm">3</x-import>
      <span class="muted" style="padding: 0 12px;"><i class="fa-solid fa-ellipsis" aria-hidden="true"></i></span>
      <x-import component-from-global-scope="FlameNode.Button" variant="tertiary" size="sm">7</x-import>
      <x-import component-from-global-scope="FlameNode.Button" variant="tertiary" size="sm" aria-label="次へ"><i class="fa-solid fa-chevron-right"></i></x-import>
    </nav>
  </div>
  <div class="foot-spacer"></div>
  <dc-import name="PublicFooter" theme="{{theme}}" hint-size="100%,280px"></dc-import>
</div>
