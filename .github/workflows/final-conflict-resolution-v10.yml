              )
          audit_anchor = '''  await mutateWithAudit(db, {\n    mutationStatements: statements,\n'''
          projection = '''  const promotedTargetStaffIds = new Set(\n    promotedTargetStaff.map((row) => row.id),\n  );\n  const eventStaffAfterRows = snapshot.event_staff.flatMap((row) => {\n    if (row.x_user_id === source) {\n      if (targetStaffByEvent.has(row.event_id)) return [];\n      return [{ ...row, x_user_id: target, updated_at: now }];\n    }\n    if (row.x_user_id === target && promotedTargetStaffIds.has(row.id)) {\n      return [{ ...row, permission_preset: "owner", updated_at: now }];\n    }\n    return [{ ...row }];\n  });\n  const eventStaffAudits = buildEventStaffMergeAudits({\n    beforeRows: snapshot.event_staff,\n    afterRows: eventStaffAfterRows,\n    actorUserId: input.actorAuthUserId,\n    fromXId: source,\n    toXId: target,\n  });\n\n'''
          if "const eventStaffAudits = buildEventStaffMergeAudits" not in text:
              text = text.replace(audit_anchor, projection + audit_anchor, 1)
          audits_anchor = '''    audits: [\n      {\n        table_name: "x_users",\n'''
          if "...eventStaffAudits," not in text:
              text = text.replace(
                  audits_anchor,
                  '''    audits: [\n      ...eventStaffAudits,\n      {\n        table_name: "x_users",\n''',
                  1,
              )
          merge.write_text(text)
          PY

          rm -f src/lib/actions/merge-adminCore.ts src/lib/actions/merge-admin.test.mjs
          rm -rf .agent-trigger
          rm -f .github/workflows/final-conflict-resolution-v10.yml

          ! rg -n 'history_retention_days|priority_reclaim_until|audit_log_settings' workers/cleanup
          ! rg -n 'merge-adminCore' src app workers
          ! rg -n '\buser_id\b' src/lib/admin/permissionSimulator.ts src/components/admin/PermissionSimulatorPanel.tsx 'app/(admin)/admin/permissions/simulator/page.tsx'
          rg -n 'buildEventStaffMergeAudits|eventStaffAudits' src/lib/xid/merge.ts src/lib/xid/mergeAudits.ts

          git add -A
          git diff --cached --check
          git commit -m "残存競合を解消し監査・CleanupをDB正本へ統一"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Full merge gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          exec > >(tee .tmp/final-conflict-validation.log) 2>&1
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run test:workers
          npm run test:cloudflare-ci
          npm run test:integration
          npm run build
          npm run pages:build
          npm run check:pages-output
          npm run check:cloudflare-template
          CLOUDFLARE_CONFIG_MODE=fixture npm run check:cloudflare-config
          node scripts/create-owner-check-fixture.mjs
          FLAMENODE_OWNER_CHECK_DB=.tmp/owner-check.sqlite npm run check:db-schema
          npm run check:db-migration
          npm run check:db-legacy
          FLAMENODE_OWNER_CHECK_DB=.tmp/owner-check.sqlite npm run check:event-owners
          npm run check:db-d1-empty
          npm run check:db-d1-legacy
          npm run check:ui-acceptance
          npm run check:public-api-contract
          npm run check:public-api-leaks
          npm run check:project-docs
          npm run check:docs
          npm run check:db-history

      - name: Push verified resolution
        run: git push origin HEAD:agent/db-canonical-final-conflicts-v10

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-conflict-resolution-v10-${{ github.run_id }}
          path: .tmp/final-conflict-validation.log
          if-no-files-found: ignore
          retention-days: 7
