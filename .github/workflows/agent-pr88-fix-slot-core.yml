name: Agent PR88 fix slot core

on:
  push:
    branches:
      - agent/ux-and-status-simplification
    paths:
      - .github/workflows/agent-pr88-fix-slot-core.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-and-status-simplification
          fetch-depth: 0
      - name: Apply canonical slot grouping type
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/db-canonical-events
          git checkout origin/agent/db-canonical-events -- src/lib/utils/slotGroupingCore.ts
          python - <<'PY'
          from pathlib import Path
          dashboard = Path('app/(auth)/dashboard/page.tsx')
          text = dashboard.read_text()
          text = text.replace('collapseReservationGroups(slotRows as SlotBase[])', 'collapseReservationGroups(slotRows)')
          dashboard.write_text(text)

          template = Path('src/lib/admin/eventTemplateSettings.ts')
          text = template.read_text().replace(
              '新規イベントフォーム用の初期値。日時は空、公開状態は下書き。',
              '新規イベントフォーム用の初期値。日時は空、公開状態は非公開。',
          )
          template.write_text(text)
          PY
          rm .github/workflows/agent-pr88-fix-slot-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "共通枠型を修正後DB正本へ切替"
          git push origin HEAD:agent/ux-and-status-simplification
