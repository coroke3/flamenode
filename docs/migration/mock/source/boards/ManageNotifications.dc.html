<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>通知センター</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <div class="c-side"><dc-import name="ManageNav" theme="{{theme}}" active="notifications" hint-size="100%,900px"></dc-import></div>
  <main class="c-main">
    <div class="c-head">
      <div>
        <h1 class="t-display">通知センター</h1>
        <p class="muted">担当イベントに紐づく Discord 通知の配信状況</p>
      </div>
      <button type="button" class="fn-btn fn-btn--secondary fn-btn--sm">失敗 1 件をまとめて再送</button>
    </div>

    <div class="wrap-row" style="gap: 8px; margin-bottom: 20px;">
      <span class="sel-i"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i><select class="select i" aria-label="イベント"><option>すべての担当イベント</option><option>PVSF2026S</option></select></span>
      <span class="sel-i"><i class="fa-solid fa-filter" aria-hidden="true"></i><select class="select i" aria-label="状態"><option>すべての状態</option><option>配信待ち</option><option>送信中</option><option>送信済み</option><option>失敗</option></select></span>
    </div>

    <div class="t-scroll">
      <table class="tbl">
        <thead><tr><th>日時</th><th>通知</th><th>イベント</th><th>状態</th><th>最終失敗</th><th></th></tr></thead>
        <tbody>
          <tr><td class="t-num">10.04 11:03</td><td class="il"><i class="fa-solid fa-globe muted" aria-hidden="true"></i>公開通知 · 崇渦に関するお知らせ 前編</td><td>PVSF2026S</td><td><span class="st"><span class="dot err"></span>失敗</span></td><td class="muted t-sm">Discord 429</td><td class="num"><button type="button" class="ib sm" aria-label="再送"><i class="fa-solid fa-rotate-right"></i></button><button type="button" class="ib sm" aria-label="キャンセル"><i class="fa-solid fa-xmark"></i></button></td></tr>
          <tr><td class="t-num">10.05 09:00</td><td class="il"><i class="ms ms-pending_actions muted" aria-hidden="true"></i>締切リマインド</td><td>PVSF2026S</td><td><span class="st"><span class="dot info"></span>配信待ち</span></td><td class="muted">—</td><td class="num"><button type="button" class="ib sm" aria-label="キャンセル"><i class="fa-solid fa-xmark"></i></button></td></tr>
          <tr><td class="t-num">10.04 09:40</td><td class="il"><i class="ms ms-event_seat muted" aria-hidden="true"></i>枠確保通知</td><td>PVSF2026S</td><td><span class="st"><span class="dot ok"></span>送信済み</span></td><td class="muted">—</td><td></td></tr>
          <tr><td class="t-num">10.03 20:01</td><td class="il"><i class="fa-solid fa-check muted" aria-hidden="true"></i>承認通知 · 【サナドリウム/wiz_nicc】二次創作MV</td><td>PVSF2026S</td><td><span class="st"><span class="dot ok"></span>送信済み</span></td><td class="muted">—</td><td></td></tr>
          <tr><td class="t-num">10.03 18:12</td><td class="il"><i class="fa-solid fa-check muted" aria-hidden="true"></i>承認通知 · 【短編アニメ】魔法少女vs改造人間</td><td>年越し合作 2026</td><td><span class="st"><span class="dot ok"></span>送信済み</span></td><td class="muted">—</td><td></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
