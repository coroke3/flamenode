name: Export current source temporary

on:
  push:
    branches:
      - agent/db-canonical-migration-v2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=/tmp/flamenode-current-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: flamenode-current-source-${{ github.run_id }}
          path: /tmp/flamenode-current-source.zip
          retention-days: 1
