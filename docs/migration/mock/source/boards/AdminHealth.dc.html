<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DB ヘルスチェック</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0;background:#000}</style>
</helmet>
<div class="{{rootCls}}" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <sc-if value="{{full}}" hint-placeholder-val="{{false}}"><div class="c-side"><dc-import name="AdminNav" active="health" hint-size="100%,1240px"></dc-import></div></sc-if>
  <main class="c-main">
    <div class="c-head"><div><sc-if value="{{full}}" hint-placeholder-val="{{false}}"><h1 class="t-display">ヘルスチェック</h1></sc-if><p class="muted">データベースの整合性を読み取り専用で点検します。修復操作はありません。</p></div></div>
    <sc-if value="{{full}}" hint-placeholder-val="{{false}}"><nav class="subnav" aria-label="診断メニュー" style="margin-bottom: 24px;">
      <a href="AdminHealthHub.dc.html" class="il" aria-current="page"><i class="ms ms-monitor_heart" aria-hidden="true"></i>ヘルスチェック</a>
      <a href="AdminHealthHub.dc.html" class="il"><i class="ms ms-account_tree" aria-hidden="true"></i>DB整合性</a>
      <a href="AdminHealthHub.dc.html" class="il"><i class="ms ms-dns" aria-hidden="true"></i>Worker監視</a>
    </nav></sc-if>
    <div class="wrap-row" style="gap: 8px; margin-bottom: 20px;">
      <div class="seg" role="group" aria-label="診断モード"><sc-for list="{{_nav}}" as="t" hint-placeholder-count="2"><button type="button" class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for></div>
      <span class="t-sm muted" style="flex: 1 1 280px;">{{modeDesc}}</span>
      <span class="sel-i"><i class="fa-solid fa-filter" aria-hidden="true"></i><select class="select i" aria-label="状態フィルタ"><option>すべて</option><option>危険</option><option>警告</option><option>確認</option><option>OK</option></select></span>
    </div>
    <div class="notice" style="margin-bottom: 16px;"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true" style="color: var(--warning); padding-top: 4px;"></i><span class="t-sm">警告 2 件が検出されています。一覧から確認してください。</span></div>
    <div class="dt" style="--cols: minmax(240px,1.6fr) 100px 72px minmax(200px,1.4fr); --minw: 0px;">
      <div class="dt-h"><span>チェック項目</span><span>状態</span><span class="num">件数</span><span>サンプル / 備考</span></div>
      <div class="dt-r"><span>通知 outbox の最終失敗</span><span class="st"><span class="dot warn"></span>警告</span><span class="num">1</span><span class="t-mono t-sm ell">nfo_8c21a0</span></div>
      <div class="dt-r"><span>期限切れモデレーションケース</span><span class="st"><span class="dot warn"></span>警告</span><span class="num">1</span><span class="t-mono t-sm ell">mod_331c02</span></div>
      <div class="dt-r"><span>Active X ID 未設定の投稿者</span><span class="st"><span class="dot info"></span>確認</span><span class="num">4</span><span class="t-sm muted">サンプル (最大5件)</span></div>
      <div class="dt-r"><span>システム設定の欠落</span><span class="st"><span class="dot ok"></span>OK</span><span class="num">0</span><span class="muted">—</span></div>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embed":{"editor":"boolean","default":true},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'ops' }; }
  renderVals() {
    const r = this.__emb();
    const emb = this.props.embed ?? true;
    r.full = !emb; r.rootCls = emb ? 'p-root emb-root' : 'p-root';
    return r;
  }
  __emb() {
    const r = this.__rv();
    r._nav = (r.modes || []).map(x => ({ label: x.label, cur: x.id === r.mode ? 'page' : 'false', cls: x.id === r.mode ? 'on' : '', pick: (e) => { e && e.preventDefault && e.preventDefault(); r.setMode(x.id); } }));
    return r;
  }
  __rv() {
    const m = this.state.mode;
    return { theme: this.props.theme ?? 'dark', mode: m, setMode: (id) => this.setState({ mode: id }), modes: [{ id: 'ops', label: '運用チェック' }, { id: 'full', label: '全体診断' }], modeDesc: m === 'ops' ? '通知・モデレーション・設定など、通常運用に必要な項目だけを確認します。' : '参照切れ、派生行欠落、枠状態矛盾を含む全項目を確認しています。' };
  }
}
</script>
</body>
</html>
