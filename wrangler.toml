name = "flamenode"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# next-on-pages のビルド成果物 (npm run pages:build)
pages_build_output_dir = ".vercel/output/static"

# Cloudflare Dashboard → Pages → Settings → Builds と揃える
# Build command:     npm run pages:build
# Build output dir:  .vercel/output/static
# Node version:      22

[observability]
enabled = true

# 非シークレットの公開用環境変数 (シークレットは wrangler pages secret put で登録)
# 必須Pages secret: AUTH_SECRET, SPREADSHEET_IMPORT_PREVIEW_SECRET, Discord OAuth secret
[vars]
NEXT_PUBLIC_SITE_NAME = "FlameNode"
NEXT_PUBLIC_SITE_DESCRIPTION = "映像（フレーム）の結節点（ノード）。YouTube埋め込みを利用した動画プラットフォーム。"

# D1 (SQL DB) — ID は npm run cf:bootstrap または npm run cf:sync-ids で反映
[[d1_databases]]
binding = "DB"
database_name = "flamenode_db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# R2 (Object Storage)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "flamenode-storage"

# KV (cost guard / 軽量キャッシュ)
[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"
