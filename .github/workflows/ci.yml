name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: canonical-resolution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/db-canonical-conflict-resolution-v8'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/db-canonical-conflict-resolution-v8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 正本統合処理を実行
        shell: bash
        run: |
          cp .github/scripts/resolve-canonical-conflicts.sh /tmp/resolve-canonical-conflicts.sh
          chmod +x /tmp/resolve-canonical-conflicts.sh
          /tmp/resolve-canonical-conflicts.sh
      - name: 失敗時の組み立て済みソースを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-resolved-source-${{ github.run_id }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 3
