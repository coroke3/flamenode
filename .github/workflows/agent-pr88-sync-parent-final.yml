name: Agent PR88 sync parent final

on:
  push:
    branches:
      - agent/ux-and-status-simplification
    paths:
      - .github/workflows/agent-pr88-sync-parent-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-and-status-simplification
          fetch-depth: 0
      - name: Merge latest canonical parent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/db-canonical-migration-v2
          git merge --no-commit --no-ff -X ours origin/agent/db-canonical-migration-v2
          rm .github/workflows/agent-pr88-sync-parent-final.yml
          git add -A
          git commit -m "PR89最新headとの競合を解消"
          git push origin HEAD:agent/ux-and-status-simplification
