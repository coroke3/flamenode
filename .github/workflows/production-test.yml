name: Production Test

on:
  push:
    branches: [main]

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: true

jobs:
  release:
    if: contains(github.event.head_commit.message, '[production-test-v2]')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      CLOUDFLARE_CONFIG_MODE: production
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SITE_NAME: FlameNode
      AUTH_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_DISCORD_ID: ${{ secrets.AUTH_DISCORD_ID }}
      AUTH_DISCORD_SECRET: ${{ secrets.AUTH_DISCORD_SECRET }}
      BUILD_COMMIT_SHA: ${{ github.sha }}
      SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      FAST_JOBS_URL: ${{ vars.FAST_JOBS_URL }}
      CONTENT_JOBS_URL: ${{ vars.CONTENT_JOBS_URL }}
      SYNC_JOBS_URL: ${{ vars.SYNC_JOBS_URL }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "$CF_IDS_JSON" ] || missing+=("CF_IDS_JSON")
          [ -n "$NEXT_PUBLIC_SITE_URL" ] || missing+=("NEXT_PUBLIC_SITE_URL")
          [ -n "$AUTH_SECRET" ] || missing+=("AUTH_SECRET")
          [ -n "$AUTH_DISCORD_ID" ] || missing+=("AUTH_DISCORD_ID")
          [ -n "$AUTH_DISCORD_SECRET" ] || missing+=("AUTH_DISCORD_SECRET")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing production configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply and verify Cloudflare resource IDs
        run: |
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config
          npm run check:cloudflare-template

      - name: Verify release candidate
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run test:workers
          npm run test:cloudflare-ci
          npm run test:integration
          npm run check:ui-acceptance
          npm run check:project-docs
          npm run check:docs
          npm run check:db-history

      - name: Build and validate Pages artifact
        run: |
          npm run pages:build
          npm run check:pages-output
          npm run check:cloudflare-template

      - name: Deploy verified Pages artifact
        run: >-
          npm run pages:deploy:verified --
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-message="本番試験 ${GITHUB_SHA}"
          --commit-dirty=false

      - name: Deploy three Cron Workers
        run: npm run workers:deploy:verified

      - name: Smoke test production resources
        run: node scripts/smoke-cloudflare.mjs

  report:
    if: always() && contains(github.event.head_commit.message, '[production-test-v2]')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write production test result
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [ "$RELEASE_RESULT" = "success" ]; then
            verdict="PASS"
          else
            verdict="FAIL"
          fi
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > docs/operations/last-production-test.md <<EOF
          # 最新の本番試験結果

          > Status: Active
          > Result: ${verdict}
          > Release job: ${RELEASE_RESULT}
          > Candidate commit: ${CANDIDATE_SHA}
          > Completed at: ${completed_at}
          > Workflow run: ${RUN_URL}

          対象はCloudflare Pages、fast-jobs、content-jobs、sync-jobs、およびproduction smoke testです。

          この試験ではRemote D1のbootstrap、migration適用、データ変更を実行していません。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/last-production-test.md
          git commit -m "本番試験: 結果を記録 ${CANDIDATE_SHA:0:7} (${verdict})"
          git push origin HEAD:main
