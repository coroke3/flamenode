name: Record Production Test

on:
  workflow_run:
    workflows: ["Deploy Cloudflare"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: production-test-report
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Record tagged production release result
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail

          message="$(git log -1 --pretty=%B "$HEAD_SHA")"
          if ! grep -Fq '[deploy-production]' <<< "$message"; then
            echo "Not a tagged production candidate; no report is written."
            exit 0
          fi

          case "$RUN_CONCLUSION" in
            success) verdict="PASS" ;;
            *) verdict="FAIL" ;;
          esac

          cat > docs/operations/last-production-test.md <<EOF
          # 最新の本番試験結果

          > Status: Active
          > Result: ${verdict}
          > Workflow conclusion: ${RUN_CONCLUSION}
          > Candidate commit: ${HEAD_SHA}
          > Completed at: ${COMPLETED_AT}
          > Workflow run: ${RUN_URL}

          Deploy Cloudflare workflowは、release gate、production設定検査、Pages build/deploy、3 Worker deploy、production smoke testを順番に実行します。ResultがPASSの場合のみ、すべての必須jobが成功しています。

          D1 bootstrapとpending migration適用は、workflow_dispatchで明示指定した場合のみ実行されます。pushによる本番試験では実行しません。
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/last-production-test.md
          git commit -m "docs: record production test ${HEAD_SHA:0:7} (${RUN_CONCLUSION})"
          git push origin HEAD:main
