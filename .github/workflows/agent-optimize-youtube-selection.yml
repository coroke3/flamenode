name: Apply YouTube selection optimization

on:
  push:
    branches:
      - agent/cloudflare-free-tier-budget-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-free-tier-budget-fix
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 候補抽出を最適化
        run: node scripts/agent-optimize-youtube-selection.mjs
      - name: 変更をcommitしてpush
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Worker: YouTube候補抽出をindex駆動へ変更"
          git push origin HEAD:agent/cloudflare-free-tier-budget-fix
