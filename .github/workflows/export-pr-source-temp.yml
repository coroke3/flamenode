name: Export PR source temporary

on:
  push:
    branches:
      - agent/db-canonical-x-identity
  pull_request:
    branches:
      - agent/db-canonical-migration-v2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: pr-source-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 1
