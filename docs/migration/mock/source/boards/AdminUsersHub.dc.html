<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ユーザー</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0;background:#000}</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <div class="c-side"><dc-import name="AdminNav" active="users" hint-size="100%,1240px"></dc-import></div>
  <main class="c-main">
    <h1 class="t-display">ユーザー</h1>
    <div class="hub-bar">
      <nav class="subnav" aria-label="ユーザー" role="tablist"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><a href="#" class="il" role="tab" aria-current="{{t.cur}}" aria-selected="{{t.sel}}" onClick="{{t.pick}}"><i class="{{t.icon}}" aria-hidden="true"></i>{{t.label}}<span class="t-num muted">{{t.n}}</span></a></sc-for></nav>
      <div class="hub-links"></div>
    </div>
    <div class="hub-body">
      <sc-if value="{{t_0}}" hint-placeholder-val="{{true}}"><dc-import name="AdminUsers" hint-size="100%,1500px"></dc-import></sc-if>
      <sc-if value="{{t_1}}" hint-placeholder-val="{{false}}"><dc-import name="AdminXLink" hint-size="100%,1200px"></dc-import></sc-if>
      <sc-if value="{{t_2}}" hint-placeholder-val="{{false}}"><dc-import name="AdminXIdMerges" hint-size="100%,1300px"></dc-import></sc-if>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"tab":{"editor":"enum","options":["AdminUsers", "AdminXLink", "AdminXIdMerges"],"default":"AdminUsers"},"$preview":{"width":1440,"height":1760}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: null }; }
  renderVals() {
    const T = [["AdminUsers", "ユーザー", "fa-brands fa-discord", ""], ["AdminXLink", "X ID連携申請", "fa-solid fa-at", "3"], ["AdminXIdMerges", "X ID統合申請", "ms ms-merge", "1"]];
    const cur = this.state.tab || this.props.tab || T[0][0];
    const r = { theme: this.props.theme ?? 'dark',
      tabs: T.map(([id, label, icon, n]) => ({ label, icon, n, cur: id === cur ? 'page' : 'false', sel: id === cur ? 'true' : 'false', pick: (e) => { e.preventDefault(); this.setState({ tab: id }); } })) };
    T.forEach(([id], i) => { r['t_' + i] = id === cur; });
    return r;
  }
}
</script>
</body>
</html>
