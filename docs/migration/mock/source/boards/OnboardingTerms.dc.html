<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>初期設定 1/2</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#000}</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja">
  <div class="wrap row" style="min-height: 72px; justify-content: space-between;">
    <img class="logo-d" src="/_blob/eee88ecd1bced2fd7ce508f977487e59" alt="FlameNode" style="height: 18px;">
    <img class="logo-l" src="/_blob/eded756c59dbc57e0b63d862e98d3177" alt="FlameNode" style="height: 18px;">
    <span class="il t-sm muted"><i class="fa-regular fa-clock" aria-hidden="true"></i>約1分</span>
  </div>

  <div class="wrap" style="max-width: 880px; padding-top: 48px;">
    <div class="row" style="gap: 8px;" aria-label="初期設定 1 / 2">
      <span style="flex: 1; height: 4px; background: var(--ink);"></span>
      <span style="flex: 1; height: 4px; background: var(--surface-subtle);"></span>
    </div>
    <p class="t-label muted t-num" style="margin: 12px 0 0;">1 / 2</p>
    <h1 class="t-display" style="margin-top: 8px;">利用規約の確認</h1>

    <p class="t-label muted il" style="margin: 40px 0 12px;"><i class="fa-solid fa-unlock" aria-hidden="true"></i>現在利用できる機能</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2px;">
      <div class="raised row" style="gap: 14px; padding: 18px;"><span class="icon-tile"><i class="fa-solid fa-play" aria-hidden="true"></i></span><span class="stack"><span>作品の閲覧</span><span class="il t-sm muted"><i class="fa-solid fa-check" aria-hidden="true"></i>利用可能</span></span></div>
      <div class="raised row" style="gap: 14px; padding: 18px; opacity: .55;"><span class="icon-tile"><i class="ms ms-event_seat" aria-hidden="true"></i></span><span class="stack"><span>イベント枠の確保</span><span class="il t-sm muted"><i class="fa-solid fa-lock" aria-hidden="true"></i>規約同意後</span></span></div>
      <div class="raised row" style="gap: 14px; padding: 18px; opacity: .55;"><span class="icon-tile"><i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i></span><span class="stack"><span>作品の投稿</span><span class="il t-sm muted"><i class="fa-solid fa-lock" aria-hidden="true"></i>X ID 承認後</span></span></div>
    </div>

    <div class="row" style="justify-content: space-between; margin: 40px 0 12px;">
      <p class="t-label muted il" style="margin: 0;"><i class="fa-solid fa-list" aria-hidden="true"></i>主な内容</p>
      <span class="t-sm muted t-num">利用規約 v3.0</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 24px;">
      <span>投稿作品の取り扱い</span>
      <span class="il"><i class="fa-solid fa-ban muted" aria-hidden="true"></i>禁止事項</span>
      <span class="il"><i class="fa-solid fa-trash-can muted" aria-hidden="true"></i>アカウントおよび投稿の削除</span>
      <span>イベント参加時のルール</span>
    </div>

    <button type="button" class="il t-sm" style="margin-top: 24px; border: 0; background: none; padding: 0; color: var(--brand-text); cursor: pointer;" onClick="{{toggle}}" aria-expanded="{{openStr}}"><i class="{{toggleIcon}}" aria-hidden="true"></i>{{toggleLabel}}</button>
    <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
      <div class="prose t-sm" style="margin-top: 12px; max-height: 320px; overflow: auto; padding: 20px 24px; background: var(--surface-raised);" aria-label="利用規約全文">
        <h3>第1条 適用</h3><p class="muted">[規約本文 — 管理画面で公開中のバージョンの本文がここに表示されます]</p>
        <h3>第2条 投稿作品の取り扱い</h3><p class="muted">[規約本文]</p>
        <h3>第3条 禁止事項</h3><p class="muted">[規約本文]</p>
        <h3>第4条 アカウントおよび投稿の削除</h3><p class="muted">[規約本文]</p>
      </div>
    </sc-if>

    <div class="row" style="gap: 16px; margin-top: 32px; flex-wrap: wrap;">
      <x-import component-from-global-scope="FlameNode.Checkbox" label="利用規約に同意します"></x-import>
      <span style="flex: 1;"></span>
      <a href="OnboardingXId.dc.html" class="fn-btn fn-btn--primary">同意して続ける<i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
    </div>
  </div>
  <div class="foot-spacer"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1600}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: false }; }
  renderVals() {
    const o = this.state.open;
    return { theme: this.props.theme ?? 'dark', yes: true, open: o, openStr: o ? 'true' : 'false', toggle: () => this.setState({ open: !o }), toggleIcon: o ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down', toggleLabel: o ? '利用規約全文を閉じる' : '利用規約全文を表示' };
  }
}
</script>
</body>
</html>
