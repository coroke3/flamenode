name = "flamenode-content-jobs"
main = "index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers Free では 1時間未満の Cron は CPU 10ms 上限になる。
# 静的JSON生成とcleanupは重処理なので、1時間間隔にして長時間Cron枠を使う。
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "flamenode_db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "R2"
bucket_name = "flamenode-storage"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"
