name = "flamenode-fast-jobs"
main = "index.ts"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

# Recovery Cron: hourly fallback when Queue wake is missed.
[triggers]
crons = ["0 * * * *"]

[vars]
QUEUE_DISPATCH_ENABLED = "0"
QUEUE_CONTINUATION_ENABLED = "0"
QUEUE_YOUTUBE_SYNC_ENABLED = "0"

[[queues.producers]]
queue = "flamenode-notification-wake"
binding = "NOTIFICATION_WAKE_QUEUE"

[[queues.consumers]]
queue = "flamenode-notification-wake"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
retry_delay = 60
dead_letter_queue = "flamenode-notification-dlq"
max_concurrency = 1

[[d1_databases]]
binding = "DB"
database_name = "flamenode_db"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"
