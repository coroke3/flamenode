name = "flamenode-sync-jobs"
main = "index.ts"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Recovery Cron: metadata/score at :07, playlist sync at :52.
[triggers]
crons = ["7 * * * *", "52 * * * *"]

[vars]
# Google Cloud Consoleの1日quota。FlameNode全体で80%まで使用する。
YOUTUBE_DAILY_QUOTA_LIMIT = "10000"
QUEUE_DISPATCH_ENABLED = "0"
QUEUE_CONTINUATION_ENABLED = "0"
QUEUE_YOUTUBE_SYNC_ENABLED = "0"
GA4_SYNC_ENABLED = "0"
# Secrets:
# - YOUTUBE_API_KEY
# - YOUTUBE_OAUTH_CLIENT_ID
# - YOUTUBE_OAUTH_CLIENT_SECRET
# - YOUTUBE_OAUTH_REFRESH_TOKEN
# - GA4_PROPERTY_ID
# - GA4_SERVICE_ACCOUNT_EMAIL
# - GA4_SERVICE_ACCOUNT_PRIVATE_KEY

[[queues.producers]]
queue = "flamenode-youtube-sync-wake"
binding = "YOUTUBE_SYNC_WAKE_QUEUE"

[[queues.producers]]
queue = "flamenode-static-rebuild-wake"
binding = "STATIC_REBUILD_WAKE_QUEUE"

[[queues.consumers]]
queue = "flamenode-youtube-sync-wake"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
retry_delay = 300
dead_letter_queue = "flamenode-youtube-sync-dlq"
max_concurrency = 1

[[d1_databases]]
binding = "DB"
database_name = "flamenode_db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "R2"
bucket_name = "flamenode-storage"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"
