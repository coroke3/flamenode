name = "flamenode-background-jobs"
main = "index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = [
  "*/5 * * * *",
  "0 * * * *",
]

[[d1_databases]]
binding = "DB"
database_name = "flamenode_db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "R2"
bucket_name = "flamenode-storage"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

[vars]
# DISCORD_BOT_TOKEN, YOUTUBE_API_KEY, WORKER_ADMIN_TOKEN は wrangler secret put で設定する。
