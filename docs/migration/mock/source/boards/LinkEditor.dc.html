<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>リンク編集</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>
body{margin:0;background:#000}
.sns{display:grid;gap:4px}
.sns-row{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;gap:8px;align-items:center;height:40px;padding:0 4px 0 8px;background:var(--surface-subtle)}
.sns-row i.k{color:var(--ink-muted);text-align:center}
.sns-row .u{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sns-add{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;height:40px;padding:0 4px 0 8px;background:var(--surface-subtle)}
.sns-add input{border:0;background:transparent;color:var(--ink);font:400 14px/20px var(--font-sans);outline:none;min-width:0}
.sns-add .det{font-size:12px;color:var(--ink-muted);white-space:nowrap}
</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja" style="min-height: 0; background: transparent; padding-bottom: 0;">
    <div class="field">
      <span>その他のリンク <span class="muted t-num">{{snsCount}} / 8</span></span>
      <div class="sns">
        <sc-for list="{{sns}}" as="l" hint-placeholder-count="2">
          <div class="sns-row"><i class="{{l.icon}} k" aria-hidden="true"></i><span class="u">{{l.url}}</span><button type="button" class="ib sm" aria-label="{{l.del}}" onClick="{{l.rm}}"><i class="fa-solid fa-xmark"></i></button></div>
        </sc-for>
        <label class="sns-add"><i class="fa-solid fa-plus k" aria-hidden="true" style="color: var(--ink-muted); text-align: center;"></i><input type="url" placeholder="URL を貼り付け(種類は自動で判定)" aria-label="リンクを追加" value="{{draft}}" onInput="{{setDraft}}" onKeyDown="{{addKey}}"><span class="det">{{detected}}</span></label>
      </div>
    </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":640,"height":220}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sns: [['fa-brands fa-instagram', 'https://instagram.com/otako_anime'], ['fa-solid fa-palette', 'https://www.foriio.com/otako']], draft: '' }; }
  detect(u) { const m = [[/x\.com|twitter\.com/, 'X', 'fa-brands fa-x-twitter'], [/instagram\.com/, 'Instagram', 'fa-brands fa-instagram'], [/tiktok\.com/, 'TikTok', 'fa-brands fa-tiktok'], [/bsky\.app/, 'Bluesky', 'fa-brands fa-bluesky'], [/nicovideo\.jp|nico\.ms/, 'Niconico', 'ms ms-smart_display'], [/discord\.(gg|com)/, 'Discord', 'fa-brands fa-discord'], [/^mailto:/, 'Email', 'fa-regular fa-envelope'], [/foriio|pixiv|behance|artstation/, 'Portfolio', 'fa-solid fa-palette'], [/tumblr\.com/, 'Tumblr', 'fa-brands fa-tumblr']].find(([r]) => r.test(u)); return m ? [m[1], m[2]] : (/^https?:\/\//.test(u) ? ['Website', 'fa-solid fa-globe'] : null); }
  renderVals() {
    const S = this.state;
    const d = this.detect(S.draft.trim());
    const add = () => { if (!d || S.sns.length >= 8) return; this.setState({ sns: S.sns.concat([[d[1], S.draft.trim()]]), draft: '' }); };
    return {
      theme: this.props.theme ?? 'dark',
      snsCount: S.sns.length,
      sns: S.sns.map(([icon, url], i) => ({ icon, url, del: url + ' を削除', rm: () => this.setState({ sns: S.sns.filter((_, k) => k !== i) }) })),
      draft: S.draft, setDraft: (e) => this.setState({ draft: e.target.value }),
      detected: S.draft ? (d ? d[0] + ' として追加 ⏎' : 'URL を確認') : '',
      addKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } }
    };
  }
}
</script>
</body>
</html>
