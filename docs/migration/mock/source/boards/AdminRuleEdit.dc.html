<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>規約バージョン編集</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <div class="c-side"><dc-import name="AdminNav" theme="{{theme}}" active="rules" hint-size="100%,1240px"></dc-import></div>
  <main class="c-main">
    <a href="AdminRules.dc.html" class="il t-sm muted"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>規約一覧</a>
    <div class="c-head" style="margin-top: 8px;">
      <div class="row" style="gap: 16px;"><h1 class="t-display">v3.1</h1><span class="st"><span class="dot"></span>下書き</span></div>
    </div>
    <p class="il t-sm muted" style="margin: -24px 0 24px;"><i class="fa-solid fa-lock" aria-hidden="true"></i>下書き状態のときだけ編集できます。公開すると変更不可になります。</p>
    <div class="split">
      <form class="main form" onSubmit="{{prevent}}">
        <div class="cols2">
          <x-import component-from-global-scope="FlameNode.TextField" label="バージョンラベル *" default-value="v3.1"></x-import>
          <label class="field"><span>重要度</span><span class="sel-i"><i class="fa-solid fa-rotate" aria-hidden="true"></i><select class="select i"><option>軽微(再同意なし)</option><option>重要(再同意を要求)</option></select></span></label>
        </div>
        <x-import component-from-global-scope="FlameNode.TextField" label="本文 (Markdown) *" multiline="{{yes}}" default-value="## 第1条 適用&#10;…"></x-import>
        <div class="row" style="gap: 8px;"><button type="submit" class="fn-btn fn-btn--secondary">下書き保存</button></div>
      </form>
      <aside class="side stack" style="gap: 2px;">
        <button type="button" class="fn-btn fn-btn--primary" style="justify-content: flex-start;"><i class="fa-solid fa-upload" aria-hidden="true"></i>利用規約を公開</button>
        <p class="t-sm muted" style="margin: 8px 0 16px;">軽微な改定として公開します。重要な改定の場合は全ユーザーに再同意を求めます。</p>
        <button type="button" class="fn-btn fn-btn--danger" style="justify-content: flex-start;">バージョンをアーカイブ</button>
        <p class="t-sm muted" style="margin: 8px 0 0;">アーカイブします。この操作は取り消せません。</p>
      </aside>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark', yes: true, prevent: (e) => e.preventDefault() }; }
}
</script>
</body>
</html>
