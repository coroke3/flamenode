name = "flamenode-sync-jobs"
main = "index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers FreeはCron間隔にかかわらずCPU 10ms。
# YouTube最大200件とscore 150件を15分ごとに小分け処理する。
[triggers]
crons = ["7,22,37,52 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "flamenode_db"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

[vars]
# Google Cloud Consoleの1日quota。FlameNodeは80%まで使用する。
YOUTUBE_DAILY_QUOTA_LIMIT = "10000"
# 本番ではYOUTUBE_API_KEYだけをwrangler secretで設定する。
