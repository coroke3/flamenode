name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_workers:
        description: Workers もデプロイする
        type: boolean
        default: true
      deploy_pages:
        description: Pages をデプロイする
        type: boolean
        default: true
      apply_migrations:
        description: 本番 D1 に active baseline migration を適用する
        type: boolean
        default: true

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  build-pages-artifact:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Cloudflare resource IDs
        run: |
          if [ -z "$CF_IDS_JSON" ] && [ ! -f cloudflare/ids.json ]; then
            echo "::error::CF_IDS_JSON (GitHub Secret) または cloudflare/ids.json が必要です。"
            exit 1
          fi
          node scripts/sync-wrangler-ids.mjs

      - name: Verify production Cloudflare config
        run: npm run check:cloudflare-config

      - name: Typecheck and Pages build
        run: |
          npm run typecheck
          npm run pages:build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: FlameNode
          CI: "1"

      - name: Validate Pages artifact and templates
        run: |
          npm run check:pages-output
          npm run check:cloudflare-template

      - name: Upload immutable Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ github.sha }}
          path: .vercel/output/static
          if-no-files-found: error
          retention-days: 1

  migrate-d1:
    needs: build-pages-artifact
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.apply_migrations)
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies and apply IDs
        run: |
          npm ci
          if [ -z "$CF_IDS_JSON" ] && [ ! -f cloudflare/ids.json ]; then
            echo "::error::CF_IDS (GitHub Secret) または cloudflare/ids.json が必要です。"
            exit 1
          fi
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config

      - name: Apply active D1 baseline migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply flamenode_db --remote

  deploy-pages:
    needs: [build-pages-artifact, migrate-d1]
    if: >-
      always() &&
      needs.build-pages-artifact.result == 'success' &&
      (needs.migrate-d1.result == 'success' || needs.migrate-d1.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages))
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Wrangler
        run: npm ci --ignore-scripts

      - name: Apply Cloudflare resource IDs
        run: |
          if [ -z "$CF_IDS_JSON" ] && [ ! -f cloudflare/ids.json ]; then
            echo "::error::CF_IDS_JSON (GitHub Secret) または cloudflare/ids.json が必要です。"
            exit 1
          fi
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config

      - uses: actions/download-artifact@v4
        with:
          name: pages-${{ github.sha }}
          path: .vercel/output/static

      - name: Deploy the verified Pages artifact
        run: >-
          npx wrangler pages deploy .vercel/output/static
          --project-name=flamenode
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-message="Automated deployment ${GITHUB_SHA}"
          --commit-dirty=false

  deploy-workers:
    needs: [build-pages-artifact, migrate-d1, deploy-pages]
    if: >-
      always() &&
      needs.build-pages-artifact.result == 'success' &&
      (needs.migrate-d1.result == 'success' || needs.migrate-d1.result == 'skipped') &&
      (needs.deploy-pages.result == 'success' || needs.deploy-pages.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_workers))
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies and apply IDs
        run: |
          npm ci
          if [ -z "$CF_IDS_JSON" ] && [ ! -f cloudflare/ids.json ]; then
            echo "::error::CF_IDS_JSON (GitHub Secret) または cloudflare/ids.json が必要です。"
            exit 1
          fi
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config
          npm run check:cloudflare-template

      - name: Deploy the three Cron Workers in fixed order
        run: npm run workers:deploy

  smoke-production:
    needs: [deploy-pages, deploy-workers]
    if: >-
      always() &&
      (needs.deploy-pages.result == 'success' || needs.deploy-workers.result == 'success') &&
      needs.deploy-pages.result != 'failure' &&
      needs.deploy-workers.result != 'failure'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Smoke test the deployed health endpoint
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "::error::NEXT_PUBLIC_SITE_URL production variable is required for smoke test."; exit 1; }
          curl --fail --show-error --silent --retry 3 --retry-delay 5 "${SITE_URL%/}/api/health"
