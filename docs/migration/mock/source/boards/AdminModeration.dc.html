<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>モデレーション</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0;background:#000}</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <div class="c-side"><dc-import name="AdminNav" active="moderation" hint-size="100%,1240px"></dc-import></div>
  <main class="c-main">
    <div class="c-head"><div><h1 class="t-display">モデレーション</h1><p class="muted">重複・権利・一時停止・X ID再申請などの未解決ケースを最大100件表示します。解決済みのケースは状態フィルタで表示できます。</p></div></div>
    <div class="wrap-row" style="gap: 8px; margin-bottom: 20px;">
      <span class="sel-i"><i class="fa-solid fa-tag" aria-hidden="true"></i><select class="select i" aria-label="種別"><option>種別 すべて</option><option>権利・楽曲・素材確認</option><option>重複投稿</option><option>一時停止・確認中</option><option>X ID再申請</option><option>運営判断</option></select></span>
      <span class="sel-i"><i class="fa-solid fa-filter" aria-hidden="true"></i><select class="select i" aria-label="状態"><option>対応中</option><option>状態 すべて</option><option>解決</option><option>却下</option><option>期限切れ</option><option>キャンセル</option></select></span>
      <x-import component-from-global-scope="FlameNode.Checkbox" label="期限超過のみ"></x-import>
    </div>
    <sc-for list="{{cases}}" as="c" hint-placeholder-count="2">
      <details class="raised" style="padding: 0; margin-bottom: 2px;" open="{{c.open}}">
        <summary class="mod-sum">
          <span class="st"><span class="{{c.dot}}"></span>{{c.status}}</span>
          <span class="il t-sm"><i class="{{c.icon}}" aria-hidden="true"></i>{{c.type}}</span>
          <span class="row" style="gap: 10px; min-width: 0;"><img src="{{c.thumb}}" alt="" style="width: 72px; aspect-ratio: 16/9; object-fit: cover; flex: none;"><span class="ell">{{c.video}}</span></span>
          <span class="il t-sm t-num" style="color: {{c.dueColor}};"><i class="fa-regular fa-calendar" aria-hidden="true"></i>{{c.due}}</span>
          <span class="il t-sm muted ell"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i>{{c.x}}</span>
        </summary>
        <div class="split" style="padding: 0 20px 20px; gap: 24px;">
          <dl class="kv main" style="font-size: 13px; grid-template-columns: 96px 1fr;"><dt>公開理由</dt><dd>{{c.reason}}</dd><dt>運営メモ</dt><dd>{{c.note}}</dd></dl>
          <form class="side stack" style="gap: 10px;">
            <div class="row" style="gap: 6px;">
              <span class="sel-i" style="flex: 1;"><i class="ms ms-inventory_2" aria-hidden="true"></i><select class="select i" aria-label="ケース状態" style="width: 100%;"><option>解決</option><option>却下</option><option>キャンセル</option><option>期限切れ</option></select></span>
              <span class="sel-i" style="flex: 1;"><i class="fa-solid fa-film" aria-hidden="true"></i><select class="select i" aria-label="作品状態" style="width: 100%;"><option>作品状態は変更しない</option><option>審査待ち</option><option>公開</option><option>非公開</option><option>無効</option></select></span>
            </div>
            <x-import component-from-global-scope="FlameNode.TextField" aria-label="対応メモ" placeholder="対応メモ"></x-import>
            <div><button type="button" class="fn-btn fn-btn--secondary fn-btn--sm">更新</button></div>
          </form>
        </div>
      </details>
    </sc-for>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'dark',
      cases: [
        { open: true, status: '対応中', dot: 'dot warn', type: '権利・楽曲・素材確認', icon: 'fa-solid fa-scale-balanced', video: '空白合作', thumb: '/_blob/191c3939aefb326fc04fd3ccf6db83a9', due: '04.05 まで', dueColor: 'var(--ink)', x: 'vIXyOepPI395671', reason: '楽曲の利用許諾を確認中です', note: '作曲者のガイドラインURLを確認' },
        { open: false, status: '期限超過', dot: 'dot err', type: '重複投稿', icon: 'fa-regular fa-clone', video: '祟渦に関するお知らせ 後編', thumb: '/_blob/be71b2f744d470e10fb8c8ca733bbace', due: '03.30 まで', dueColor: 'var(--warning)', x: 'metameta194', reason: '同じ作品が2件登録されています', note: '012345rty 名義と重複' }
      ]
    };
  }
}
</script>
</body>
</html>
