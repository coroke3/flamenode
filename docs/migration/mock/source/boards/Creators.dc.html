<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>クリエイター一覧</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}

</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja">
  <dc-import name="PublicHeader" active="user" hint-size="100%,72px"></dc-import>

  <div class="wrap" style="padding-top: 56px;">
    <div class="wrap-row" style="justify-content: space-between; gap: 16px; align-items: flex-end;">
      <h1 class="t-display">クリエイター</h1>
      <span class="t-sm muted t-num">318人</span>
    </div>

    <form role="search" class="wrap-row" style="gap: 8px; margin-top: 32px;" onSubmit="{{prevent}}">
      <div class="field-i" style="flex: 1 1 260px; max-width: 360px;">
        <x-import component-from-global-scope="FlameNode.TextField" type="search" aria-label="クリエイター検索" placeholder="名前 / X ID"></x-import>
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      </div>
      <span style="flex: 1;"></span>
      <span class="sel-i" title="並び替え"><i class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i><select class="select i" aria-label="並び替え"><option>おすすめ順</option><option>作品数順</option><option>名前順</option></select></span>
      <span class="row" role="group" aria-label="表示形式" style="gap: 0;"><sc-for list="{{views}}" as="w" hint-placeholder-count="3"><button type="button" class="{{w.cls}}" aria-label="{{w.label}}" onClick="{{w.pick}}"><i class="{{w.icon}}"></i></button></sc-for></span>
    </form>

    <sc-if value="{{isIcon}}" hint-placeholder-val="{{true}}">
    <div class="cr-icons" style="margin-top: 48px;">
      <sc-for list="{{creators}}" as="c" hint-placeholder-count="12">
        <a href="Creator.dc.html" class="stack" style="gap: 12px; align-items: center; text-align: center;">
          <img class="round" src="{{c.img}}" alt="" style="width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--surface-raised);">
          <span class="stack" style="gap: 2px;">
            <span class="cr-name" style="font-size: 15px;">{{c.name}}</span>
            <span class="meta-i cr-meta" style="justify-content: center;"><span>{{c.x}}</span><span class="t-num">{{c.works}}</span></span>
          </span>
        </a>
      </sc-for>
    </div>
    </sc-if>
    <sc-if value="{{isList}}" hint-placeholder-val="{{false}}">
      <div class="dt" style="--cols: minmax(220px,1.4fr) 80px 96px minmax(220px,1.6fr) 72px; --minw: 0px; margin-top: 40px;">
        <div class="dt-h"><span>クリエイター</span><span class="num">作品</span><span class="num">参加イベント</span><span>最新作</span><span class="num">初投稿</span></div>
        <sc-for list="{{creators}}" as="c" hint-placeholder-count="12">
          <a href="Creator.dc.html" class="dt-r">
            <span class="row" style="gap: 12px; min-width: 0;"><img class="avatar" src="{{c.img}}" alt="" style="width: 40px; height: 40px;"><span class="stack" style="gap: 0; min-width: 0;"><span class="ell">{{c.name}}</span><span class="sub">@{{c.x}}</span></span></span>
            <span class="num">{{c.works}}</span>
            <span class="num">{{c.events}}</span>
            <span class="stack" style="gap: 0; min-width: 0;"><span class="ell t-sm">{{c.latest}}</span><span class="sub">{{c.latestEv}}</span></span>
            <span class="num muted">{{c.since}}</span>
          </a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{isWorks}}" hint-placeholder-val="{{false}}">
      <div class="cr-works" style="margin-top: 40px;">
        <sc-for list="{{creators}}" as="c" hint-placeholder-count="6">
          <a href="Creator.dc.html" class="raised stack" style="gap: 16px; padding: 20px;">
            <span class="row" style="gap: 14px;"><img class="avatar" src="{{c.img}}" alt="" style="width: 56px; height: 56px;"><span class="stack" style="gap: 2px; flex: 1; min-width: 0;"><span class="ell" style="font-size: 15px;">{{c.name}}</span><span class="meta-i t-sm"><span>@{{c.x}}</span><span class="t-num">{{c.works}}</span><span class="t-num">{{c.events}}</span></span></span></span>
            <span style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;">
              <sc-for list="{{c.recent}}" as="r" hint-placeholder-count="3"><img src="{{r.thumb}}" alt="{{r.title}}" title="{{r.title}}" style="width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;"></sc-for>
            </span>
          </a>
        </sc-for>
      </div>
    </sc-if>
  </div>
  <div class="foot-spacer"></div>
  <dc-import name="PublicFooter" hint-size="100%,280px"></dc-import>
</div>
</x-dc>

</body>
</html>
