name: D1 Implementation Test

on:
  push:
    branches:
      - agent/d1-max-read-reduction
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: d1-implementation-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove temporary workflow from validation worktree
        run: |
          rm -f .github/workflows/d1-implementation-test.yml
          git update-index --assume-unchanged .github/workflows/d1-implementation-test.yml || true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Worker queue tests diagnostic
        continue-on-error: true
        run: node --test --experimental-strip-types workers/json-generator/queue.test.mjs

      - name: Worker rebuild tests diagnostic
        continue-on-error: true
        run: node --test --experimental-strip-types workers/json-generator/rebuild.test.mjs

      - name: Worker json-generator tests diagnostic
        continue-on-error: true
        run: node --test --experimental-strip-types workers/json-generator/*.test.mjs

      - name: Worker tests
        run: npm run test:workers

      - name: Cloudflare CI tests
        run: npm run test:cloudflare-ci

      - name: Static rebuild tests
        run: npm run test:static-rebuild

      - name: Full verification suite
        run: npm run verify:full
