<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アイコン選択</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>
body{margin:0}
.ic-field{display:grid;gap:8px}
.ic-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ic-l{font:400 14px/20px var(--font-sans);color:var(--ink)}
.ic-body{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;margin-top:8px;align-items:start}
.ic-now{display:grid;gap:6px;justify-items:center;text-align:center}
.ic-now img,.ic-blank{width:96px;height:96px;object-fit:cover;display:grid;place-items:center;background:var(--surface-subtle);color:var(--ink-muted);font-size:28px}
.ic-panel{display:grid;gap:12px;min-width:0}
.ic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;max-width:520px}
.ic-body:has(.ic-grid) .ic-now{display:none}
.ic-c{position:relative;aspect-ratio:1/1;padding:3px;border:1px solid var(--border-subtle);border-radius:4px;background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--ink-muted);overflow:hidden;min-width:0}
.ic-c:hover{background:var(--surface-subtle)}
.ic-c.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand);color:var(--ink)}
.ic-c img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4px}
.ic-c .ic-tag{position:absolute;left:4px;bottom:4px;font-size:12px;line-height:16px;padding:0 4px;background:rgba(0,0,0,.72);color:#fff}
.ic-c .ic-tag:empty{display:none}
.ic-c .fa-check{position:absolute;top:2px;right:2px;width:16px;height:16px;display:grid;place-items:center;background:var(--brand);color:var(--on-brand,#000);border-radius:50%;font-size:9px}
.ic-none{font-size:18px}
.ic-none .ic-tag{background:transparent;color:inherit}
.ic-url summary{cursor:pointer;list-style:none}
.ic-url summary::-webkit-details-marker{display:none}
.ic-url .input{margin-top:8px;width:100%;max-width:520px}
.ic-drop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px;background:var(--surface-subtle)}
.ic-drop{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:20px;background:var(--surface-subtle);transition:background .15s}
.ic-drop.over{background:var(--surface-active)}
.ic-drop-n{flex-basis:100%;font-size:11px;line-height:16px;color:var(--ink-muted)}
.ic-vp img.fit-w{width:100%;height:auto}
.ic-doneRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ic-crop{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.ic-vp{position:relative;width:280px;height:280px;overflow:hidden;background:var(--surface-subtle);cursor:grab;touch-action:none;user-select:none}
.ic-vp:active{cursor:grabbing}
.ic-vp img{position:absolute;left:50%;top:50%;height:100%;width:auto;max-width:none;pointer-events:none}
.ic-ctl{display:grid;gap:16px;align-content:start}
.ic-zoom{display:flex;align-items:center;gap:8px}
.ic-zoom input{flex:1;min-width:80px;accent-color:var(--ink)}
@media (max-width:640px){
  .ic-body{grid-template-columns:64px minmax(0,1fr);gap:12px}
  .ic-now img,.ic-blank{width:64px;height:64px;font-size:20px}
  .ic-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .ic-crop{grid-template-columns:1fr}
  .ic-body:has(.ic-crop){grid-template-columns:1fr}
  .ic-body:has(.ic-crop) .ic-now{display:none}
  .ic-vp{width:100%;max-width:280px;height:auto;aspect-ratio:1/1;justify-self:center}
}
</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja" style="min-height: 0; background: transparent; padding-bottom: 0;">
            <div class="ic-field" role="group" aria-labelledby="ic-l" aria-describedby="ic-h">
  <div class="ic-top">
    <span class="ic-l" id="ic-l">{{label}}</span>
    <div class="seg sm" role="tablist" aria-label="作品アイコンの設定方法">
      <button type="button" role="tab" class="{{icTabSel}}" aria-selected="{{icSelTab}}" onClick="{{icToSel}}">候補から選ぶ</button>
      <button type="button" role="tab" class="{{icTabUp}}" aria-selected="{{icUpTab}}" onClick="{{icToUp}}">新規アップロード</button>
    </div>
  </div>
  <p class="t-sm muted" id="ic-h" style="margin: 0;">{{help}}</p>
  <div class="ic-body">
    <div class="ic-now" aria-live="polite">
      <sc-if value="{{icHasImg}}" hint-placeholder-val="{{true}}"><img src="{{icPreview}}" alt="選択中のアイコン"></sc-if>
      <sc-if value="{{icNoImg}}" hint-placeholder-val="{{false}}"><span class="ic-blank"><i class="fa-solid fa-user" aria-hidden="true"></i></span></sc-if>
      <span class="t-xs muted">{{icModeLabel}}</span>
    </div>
    <div class="ic-panel">
      <sc-if value="{{icSelTab}}" hint-placeholder-val="{{true}}">
        <div class="ic-grid" role="radiogroup" aria-label="アイコン候補">
          <sc-for list="{{icCands}}" as="c" hint-placeholder-count="4">
            <button type="button" class="{{c.cls}}" role="radio" aria-checked="{{c.on}}" aria-label="{{c.title}}" title="{{c.title}}" onClick="{{c.pick}}"><img src="{{c.url}}" alt=""><i class="{{c.ck}}" aria-hidden="true"></i></button>
          </sc-for>
          <button type="button" class="{{icNoneCls}}" role="radio" aria-checked="{{icNone}}" aria-label="アイコンを指定しない" title="アイコンを指定しない" onClick="{{icPickNone}}"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
        <sc-if value="{{icUpNote}}" hint-placeholder-val="{{false}}"><p class="il t-sm" role="status" style="margin: 0;"><i class="fa-solid fa-triangle-exclamation st-ic warn" aria-hidden="true"></i>アップロード画像を選択中です。候補を選ぶとアップロードは破棄されます。</p></sc-if>
        <details class="ic-url"><summary class="il t-sm muted" style="cursor: pointer;"><i class="fa-solid fa-link" aria-hidden="true"></i>URL で指定</summary><input class="select" type="url" maxlength="500" placeholder="https://" aria-label="アイコン URL" value="{{icUrl}}" style="width: 100%; max-width: 520px; margin-top: 8px; padding: 0 12px; background-image: none;"></details>
      </sc-if>
      <sc-if value="{{icPick}}" hint-placeholder-val="{{false}}">
        <div class="{{dropCls}}" onDragOver="{{icOver}}" onDragLeave="{{icLeave}}" onDrop="{{icDrop}}">
          <span class="t-sm">ここに画像をドロップ</span>
          <span class="t-xs muted">または</span>
          <label class="fn-btn fn-btn--secondary fn-btn--sm" style="cursor: pointer;">ファイルを選ぶ<input type="file" accept="image/png,image/jpeg,image/webp" onChange="{{icFile}}" style="display: none;"></label>
          <button type="button" class="fn-btn fn-btn--tertiary fn-btn--sm" onClick="{{icLoad}}">サンプルで試す</button>
          <span class="ic-drop-n">PNG・JPEG・WEBP / 2MB まで。正方形に切り抜いて 256×256 に変換</span>
        </div>
        <sc-if value="{{icErr}}" hint-placeholder-val="{{false}}"><p class="t-sm" role="alert" style="margin: 0; color: var(--danger);">{{icErr}}</p></sc-if>
        <sc-if value="{{icDone}}" hint-placeholder-val="{{false}}">
          <div class="ic-doneRow" role="status"><i class="fa-solid fa-check st-ic ok" aria-hidden="true"></i><span class="t-sm" style="flex: 1;">{{doneMsg}}</span><button type="button" class="fn-btn fn-btn--tertiary fn-btn--sm" onClick="{{icDiscard}}">破棄して元に戻す</button></div>
        </sc-if>
        <sc-if value="{{icNotDone}}" hint-placeholder-val="{{true}}"><p class="t-xs muted" style="margin: 0;">ファイルを選んだ時点では保存されません。</p></sc-if>
      </sc-if>
      <sc-if value="{{icCrop}}" hint-placeholder-val="{{false}}">
        <div class="ic-crop">
          <div class="ic-vp" role="img" tabindex="0" aria-label="切り抜きプレビュー。ドラッグまたは矢印キーで位置を調整" onPointerDown="{{icDown}}" onPointerMove="{{icMove}}" onPointerUp="{{icUp}}" onPointerLeave="{{icUp}}" onKeyDown="{{icKey}}">
            <img src="{{cropSrc}}" alt="" draggable="false" onLoad="{{icImgLoad}}" class="{{cropFit}}" style="transform: translate(calc(-50% + {{icX}}px), calc(-50% + {{icY}}px)) scale({{icScale}});">
          </div>
          <div class="ic-ctl">
            <label class="ic-zoom"><span class="t-xs muted">縮小</span><input type="range" min="1" max="3" step="0.01" value="{{icScale}}" aria-label="拡大率" onChange="{{icZoom}}"><span class="t-xs muted">拡大</span><span class="t-num t-sm" style="width: 44px; text-align: right;">{{icPct}}</span></label>
            <p class="t-xs muted" style="margin: 0;">ドラッグ・矢印キーで位置を調整(Shift で大きく動く)。確定するまで保存されません。</p>
            <div class="row" style="gap: 8px; flex-wrap: wrap;">
              <button type="button" class="fn-btn fn-btn--primary fn-btn--sm" onClick="{{icUse}}"><i class="fa-solid fa-check" aria-hidden="true"></i>この画像を使用</button>
              <label class="fn-btn fn-btn--tertiary fn-btn--sm" style="cursor: pointer;">選び直し<input type="file" accept="image/png,image/jpeg,image/webp" onChange="{{icFile}}" style="display: none;"></label>
              <button type="button" class="fn-btn fn-btn--tertiary fn-btn--sm" onClick="{{icCancel}}">キャンセル</button>
            </div>
          </div>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"icon":{"editor":"enum","options":["select","crop","uploaded"],"default":"select"},"ctx":{"editor":"enum","options":["video","xid"],"default":"video"},"$preview":{"width":720,"height":520}}'>

    const cands = [['/_blob/fc027fe6fe3a001a22a1933270ce72b9', 'X', 'X のアイコン'], ['/_blob/f5c1a8af077b887c7bb1d043f3cf69c1', '', '過去の作品で使用'], ['/_blob/be71b2f744d470e10fb8c8ca733bbace', '', '過去の作品で使用'], ['/_blob/6ecfc7b6882f277d815f563e873f25ee', '', '過去の作品で使用']];
    const picked = (url, mode) => this.setState({ icSel: url, icMode: mode, icTab: 'sel', icStage: 'pick' });
    const upNow = S.icMode === 'upload';
    const icVals = {
      icSelTab: S.icTab === 'sel', icUpTab: S.icTab === 'up',
      icTabSel: S.icTab === 'sel' ? 'on' : '', icTabUp: S.icTab === 'up' ? 'on' : '',
      icToSel: () => this.setState({ icTab: 'sel', icStage: upNow ? 'pick' : S.icStage }), icToUp: () => this.setState({ icTab: 'up' }),
      icPreview: upNow ? (S.upDone || UP) : S.icSel, cropSrc: S.upSrc || UP, cropFit: (S.icR || 16 / 9) >= 1 ? 'fit-h' : 'fit-w',
      dropCls: 'ic-drop' + (S.drop ? ' over' : ''), icErr: S.icErr || '',

      icModeLabel: upNow ? 'アップロード' : !S.icSel ? 'なし' : S.icSel === cands[0][0] ? 'X のアイコン' : '過去の作品',

      icNone: !upNow && !S.icSel ? 'true' : 'false', icNoneCls: !upNow && !S.icSel ? 'ic-c ic-none on' : 'ic-c ic-none', icPickNone: () => picked('', 'none'),

      icScale: S.icS.toFixed(2), icPct: Math.round(S.icS * 100) + '%', icX: Math.round(S.icX), icY: Math.round(S.icY),
      icZoom: (e) => { const s = Number(e.target.value); this.setState(Object.assign({ icS: s }, this.icClamp(S.icX, S.icY, s))); },

</script>
</body>
</html>
