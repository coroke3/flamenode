name: PR186 first-slot ordering repair

on:
  push:
    branches:
      - feat/event-slot-description-export-compat

permissions:
  contents: write

concurrency:
  group: pr186-slot-order-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/event-slot-description-export-compat
          fetch-depth: 0
      - name: Patch playlist source ordering
        shell: python
        run: |
          from pathlib import Path
          path = Path("workers/youtube-playlist-sync/index.ts")
          text = path.read_text()
          old = '''    `WITH event_videos AS (
       SELECT video_id
       FROM video_events
       WHERE event_id = ?1
       UNION
       SELECT id AS video_id
       FROM videos
       WHERE primary_event_id = ?1
     )
     SELECT v.youtube_video_id
     FROM event_videos ev
     INNER JOIN videos v ON v.id = ev.video_id
     LEFT JOIN slots s
       ON s.event_id = ?1
      AND s.video_id = v.id
      AND s.status = 'submitted'
     WHERE v.youtube_video_id IS NOT NULL
       AND v.youtube_video_id <> ''
       AND v.visibility_status = 'public'
     GROUP BY v.youtube_video_id
     ORDER BY
       CASE WHEN COUNT(s.id) > 0 THEN 0 ELSE 1 END,
       MIN(CASE WHEN s.start_time IS NULL THEN 9223372036854775807 ELSE s.start_time END),
       MIN(CASE WHEN s.sort_order IS NULL THEN 2147483647 ELSE s.sort_order END),
       MIN(COALESCE(v.scheduled_time, v.created_at)),
       MIN(v.id)
     LIMIT ?2`,'''
          new = '''    `WITH event_videos AS (
       SELECT video_id
       FROM video_events
       WHERE event_id = ?1
       UNION
       SELECT id AS video_id
       FROM videos
       WHERE primary_event_id = ?1
     ),
     ranked_submitted_slots AS (
       SELECT
         s.video_id,
         s.start_time,
         s.sort_order,
         ROW_NUMBER() OVER (
           PARTITION BY s.video_id
           ORDER BY
             CASE WHEN s.start_time IS NULL THEN 1 ELSE 0 END,
             s.start_time,
             CASE WHEN s.sort_order IS NULL THEN 2147483647 ELSE s.sort_order END,
             s.id
         ) AS slot_rank
       FROM slots s
       WHERE s.event_id = ?1
         AND s.status = 'submitted'
     )
     SELECT v.youtube_video_id
     FROM event_videos ev
     INNER JOIN videos v ON v.id = ev.video_id
     LEFT JOIN ranked_submitted_slots rs
       ON rs.video_id = v.id
      AND rs.slot_rank = 1
     WHERE v.youtube_video_id IS NOT NULL
       AND v.youtube_video_id <> ''
       AND v.visibility_status = 'public'
     GROUP BY v.youtube_video_id
     ORDER BY
       CASE WHEN COUNT(rs.video_id) > 0 THEN 0 ELSE 1 END,
       MIN(CASE WHEN rs.start_time IS NULL THEN 9223372036854775807 ELSE rs.start_time END),
       MIN(CASE WHEN rs.sort_order IS NULL THEN 2147483647 ELSE rs.sort_order END),
       MIN(COALESCE(v.scheduled_time, v.created_at)),
       MIN(v.id)
     LIMIT ?2`,'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one source-order block, found {count}")
          path.write_text(text.replace(old, new))
      - run: git diff --check
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/youtube-playlist-sync/index.ts
          git commit -m "fix: rank playlist by first submitted slot"
          git push origin HEAD:feat/event-slot-description-export-compat
