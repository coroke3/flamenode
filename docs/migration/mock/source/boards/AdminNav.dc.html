<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>管理サイドバー</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<nav class="{{navCls}}" aria-label="管理ナビゲーション" lang="ja" style="background: var(--surface-raised); color: var(--ink); font-family: var(--font-sans); min-height: 100%;">
  <div class="c-mbar">
    <button type="button" class="ib" aria-label="{{mLabel}}" aria-expanded="{{mOpen}}" onClick="{{mToggle}}"><i class="{{mIcon}}"></i></button>
    <span class="c-mbar-t"><span class="t-label muted">{{mArea}}</span><span class="ell">{{mCur}}</span></span>
    <a href="CommandPalette.dc.html" class="ib" aria-label="移動・操作を検索"><i class="fa-solid fa-magnifying-glass"></i></a>
  </div>
  <div class="brand">
    <img class="logo-d" src="/_blob/eee88ecd1bced2fd7ce508f977487e59" alt="FlameNode" style="height: 16px;">
    <img class="logo-l" src="/_blob/eded756c59dbc57e0b63d862e98d3177" alt="FlameNode" style="height: 16px;">
    <span class="t-label muted">管理</span>
  </div>
  <div class="row" style="gap: 2px; padding: 0 12px 8px;">
    <a href="Manage.dc.html" class="ib sm" style="padding: 0;" aria-label="運営へ"><i class="fa-solid fa-clipboard-list"></i></a>
    <a href="Main.dc.html" class="ib sm" style="padding: 0;" aria-label="公開サイトへ"><i class="fa-solid fa-globe"></i></a>
    <span style="flex: 1;"></span>
    <button type="button" class="ib sm" style="padding: 0;" aria-label="検索"><i class="fa-solid fa-magnifying-glass"></i></button>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="8">
    <span class="grp">{{g.title}}</span>
    <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
      <a href="{{it.href}}" class="{{it.cls}}" aria-current="{{it.cur}}">
        <span class="il" style="gap: 10px;"><i class="{{it.icon}}" aria-hidden="true" style="width: 16px; text-align: center;"></i>{{it.label}}</span>
        <span class="n">{{it.n}}</span>
      </a>
    </sc-for>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"dashboard"},"$preview":{"width":264,"height":1240}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { m: false }; }
  renderVals() {
    const a = this.props.active ?? 'dashboard';
    const G = [
      ['概要', [['dashboard', 'ダッシュボード', 'ms ms-dashboard', 'Admin.dc.html', '']]],
      ['対応', [['videos', '作品', 'fa-solid fa-film', 'AdminVideosHub.dc.html', '12'], ['users', 'ユーザー / X ID', 'fa-solid fa-users', 'AdminUsersHub.dc.html', '4'], ['moderation', 'モデレーション', 'fa-solid fa-flag', 'AdminModeration.dc.html', '2']]],
      ['サイト', [['events', 'イベント', 'fa-solid fa-calendar-days', 'AdminEventsHub.dc.html', ''], ['announcements', 'お知らせ', 'fa-solid fa-bullhorn', 'AdminAnnouncements.dc.html', ''], ['rules', '規約', 'fa-solid fa-scale-balanced', 'AdminRules.dc.html', '']]],
      ['運用', [['notifications', '通知配信', 'fa-solid fa-bell', 'AdminNotifications.dc.html', '1'], ['health', '稼働状況', 'ms ms-monitor_heart', 'AdminHealthHub.dc.html', ''], ['static', '静的JSON再生成', 'fa-solid fa-file-code', 'AdminStaticBuilds.dc.html', ''], ['quota', 'YouTube クォータ', 'fa-solid fa-chart-pie', 'AdminYoutubeQuota.dc.html', ''], ['costguard', '稼働モード', 'fa-solid fa-gauge-high', 'AdminCostGuard.dc.html', ''], ['audit', '監査ログ', 'fa-solid fa-clock-rotate-left', 'AdminAuditHub.dc.html', '']]],
      ['高度な管理', [['security', 'セキュリティ', 'fa-solid fa-shield-halved', 'AdminSecurity.dc.html', ''], ['permsim', '権限シミュレーター', 'fa-solid fa-key', 'AdminPermSim.dc.html', ''], ['api', '公開API', 'fa-solid fa-plug', 'AdminApi.dc.html', ''], ['import', '旧形式インポート', 'fa-solid fa-file-import', 'AdminImport.dc.html', ''], ['spreadsheet', 'DBスプレッドシート', 'fa-solid fa-table', 'AdminSpreadsheet.dc.html', '']]]
    ];
    const mOpen = !!this.state.m;
    const mx = { navCls: 'c-nav' + (mOpen ? ' open' : ''), mOpen: mOpen ? 'true' : 'false', mLabel: mOpen ? 'メニューを閉じる' : 'メニューを開く', mIcon: mOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-bars', mToggle: () => this.setState({ m: !this.state.m }), mArea: '管理', mCur: (G.flatMap(g => g[1]).find(x => x[0] === a) || [0, 'ダッシュボード'])[1] };
    return { ...mx,
      groups: G.map((g) => ({ title: g[0], items: g[1].map((x) => ({ key: x[0], label: x[1], icon: x[2], href: x[3], n: x[4], cls: x[0] === a ? 'on' : '', cur: x[0] === a ? 'page' : 'false' })) }))
    };
  }
}
</script>
</body>
</html>
