name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      deploy_workers:
        description: Cron Worker 1本をデプロイする
        type: boolean
        default: true
      deploy_pages:
        description: Cloudflare Pagesをデプロイする
        type: boolean
        default: true
      bootstrap_database:
        description: 空の本番D1を初期構築する
        type: boolean
        default: false
      apply_pending_migrations:
        description: 既存本番D1へ未適用migrationを適用する
        type: boolean
        default: false
      delete_legacy_workers:
        description: 新Workerのsmoke成功後に旧3 Workerを削除する
        type: boolean
        default: false

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: production-candidate-placeholder
      AUTH_DISCORD_ID: production-candidate-placeholder
      AUTH_DISCORD_SECRET: production-candidate-placeholder
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存関係をインストール
        run: npm ci --no-audit --no-fund

      - name: 依存関係とlockfileを検証
        run: |
          npm ls --depth=0
          git diff --exit-code -- package-lock.json

      - name: release候補を検証
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run test:workers
          npm run test:cloudflare-ci
          npm run test:integration
          npm run build
          npm run pages:build
          npm run check:pages-output
          npm run check:cloudflare-template
          npm run check:ui-acceptance
          npm run check:public-api-leaks
          npm run check:project-docs
          npm run check:docs
          npm run check:db-history

      - name: fixture DB不変条件を検証
        env:
          CLOUDFLARE_CONFIG_MODE: fixture
          FLAMENODE_OWNER_CHECK_DB: .tmp/owner-check.sqlite
        run: |
          npm run check:cloudflare-config
          node scripts/create-owner-check-fixture.mjs
          npm run check:db-schema
          npm run check:db-legacy
          npm run check:event-owners

  validate-inputs:
    needs: release-gate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      BACKGROUND_JOBS_URL: ${{ vars.BACKGROUND_JOBS_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_DISCORD_ID: ${{ secrets.AUTH_DISCORD_ID }}
      AUTH_DISCORD_SECRET: ${{ secrets.AUTH_DISCORD_SECRET }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
    steps:
      - name: production設定を検証
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "$CF_IDS_JSON" ] || missing+=("CF_IDS_JSON")
          [ -n "$NEXT_PUBLIC_SITE_URL" ] || missing+=("NEXT_PUBLIC_SITE_URL")
          [ -n "$AUTH_SECRET" ] || missing+=("AUTH_SECRET")
          [ -n "$AUTH_DISCORD_ID" ] || missing+=("AUTH_DISCORD_ID")
          [ -n "$AUTH_DISCORD_SECRET" ] || missing+=("AUTH_DISCORD_SECRET")
          if [ "${{ inputs.deploy_workers }}" = "true" ]; then
            [ -n "$BACKGROUND_JOBS_URL" ] || missing+=("BACKGROUND_JOBS_URL")
            [ -n "$DISCORD_BOT_TOKEN" ] || missing+=("DISCORD_BOT_TOKEN")
            [ -n "$YOUTUBE_API_KEY" ] || missing+=("YOUTUBE_API_KEY")
            [ -n "$WORKER_ADMIN_TOKEN" ] || missing+=("WORKER_ADMIN_TOKEN")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing production configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          if [ "${{ inputs.bootstrap_database }}" = "true" ] &&
             [ "${{ inputs.apply_pending_migrations }}" = "true" ]; then
            echo "::error::bootstrap_database and apply_pending_migrations cannot both be true."
            exit 1
          fi
          if [ "${{ inputs.delete_legacy_workers }}" = "true" ] &&
             [ "${{ inputs.deploy_workers }}" != "true" ]; then
            echo "::error::delete_legacy_workers requires deploy_workers=true."
            exit 1
          fi

  build-pages-artifact:
    needs: [release-gate, validate-inputs]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      CLOUDFLARE_CONFIG_MODE: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 依存関係をインストール
        run: npm ci --no-audit --no-fund
      - name: Cloudflare resource IDを適用して検証
        run: |
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config
      - name: production Pages artifactをビルド
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: FlameNode
          AUTH_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_DISCORD_ID: ${{ secrets.AUTH_DISCORD_ID }}
          AUTH_DISCORD_SECRET: ${{ secrets.AUTH_DISCORD_SECRET }}
          CI: "1"
        run: npm run pages:build
      - name: Pages artifactを検証
        run: |
          npm run check:pages-output
          npm run check:cloudflare-template
      - name: commit固定artifactを保存
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ github.sha }}
          path: .vercel/output/static
          if-no-files-found: error
          retention-days: 1

  bootstrap-d1:
    needs: [release-gate, validate-inputs, build-pages-artifact]
    if: inputs.bootstrap_database
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      CLOUDFLARE_CONFIG_MODE: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 依存関係とresource IDを準備
        run: |
          npm ci --no-audit --no-fund
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config
      - name: production D1が空であることを確認
        run: node scripts/check-d1-bootstrap-state.mjs --remote --expect-empty
      - name: production D1を初期構築
        run: npx wrangler d1 migrations apply flamenode_db --remote

  migrate-d1:
    needs: [release-gate, validate-inputs, build-pages-artifact]
    if: inputs.apply_pending_migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      CLOUDFLARE_CONFIG_MODE: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 依存関係とresource IDを準備
        run: |
          npm ci --no-audit --no-fund
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config
      - name: baseline markerを確認
        run: node scripts/check-d1-bootstrap-state.mjs --remote --expect-initialized
      - name: pending migrationを適用
        run: npx wrangler d1 migrations apply flamenode_db --remote

  deploy-pages:
    needs: [release-gate, validate-inputs, build-pages-artifact, bootstrap-d1, migrate-d1]
    if: >-
      always() &&
      inputs.deploy_pages &&
      needs.release-gate.result == 'success' &&
      needs.validate-inputs.result == 'success' &&
      needs.build-pages-artifact.result == 'success' &&
      (needs.bootstrap-d1.result == 'success' || needs.bootstrap-d1.result == 'skipped') &&
      (needs.migrate-d1.result == 'success' || needs.migrate-d1.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      CLOUDFLARE_CONFIG_MODE: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Wranglerとresource IDを準備
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config
      - uses: actions/download-artifact@v4
        with:
          name: pages-${{ github.sha }}
          path: .vercel/output/static
      - name: 検証済みPages artifactをdeploy
        run: >-
          npm run pages:deploy:verified --
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-message="検証済みproduction deploy ${GITHUB_SHA}"
          --commit-dirty=false

  deploy-workers:
    needs: [release-gate, validate-inputs, build-pages-artifact, bootstrap-d1, migrate-d1, deploy-pages]
    if: >-
      always() &&
      inputs.deploy_workers &&
      needs.release-gate.result == 'success' &&
      needs.validate-inputs.result == 'success' &&
      needs.build-pages-artifact.result == 'success' &&
      (needs.bootstrap-d1.result == 'success' || needs.bootstrap-d1.result == 'skipped') &&
      (needs.migrate-d1.result == 'success' || needs.migrate-d1.result == 'skipped') &&
      (needs.deploy-pages.result == 'success' || (!inputs.deploy_pages && needs.deploy-pages.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      CLOUDFLARE_CONFIG_MODE: production
      BUILD_COMMIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 依存関係とresource IDを準備
        run: |
          npm ci --no-audit --no-fund
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config
          npm run check:cloudflare-template
      - name: 統合Cron Workerを先行deploy
        run: npm run workers:deploy:verified
      - name: 統合Cron Workerへsecretを設定
        shell: bash
        run: |
          set -euo pipefail
          cd workers/background-jobs
          printf '%s' "$DISCORD_BOT_TOKEN" | npx wrangler secret put DISCORD_BOT_TOKEN
          printf '%s' "$YOUTUBE_API_KEY" | npx wrangler secret put YOUTUBE_API_KEY
          printf '%s' "$WORKER_ADMIN_TOKEN" | npx wrangler secret put WORKER_ADMIN_TOKEN

  smoke-production:
    needs: [release-gate, deploy-pages, deploy-workers]
    if: >-
      always() &&
      inputs.deploy_pages &&
      inputs.deploy_workers &&
      needs.release-gate.result == 'success' &&
      needs.deploy-pages.result == 'success' &&
      needs.deploy-workers.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: production resourceをsmoke test
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          BACKGROUND_JOBS_URL: ${{ vars.BACKGROUND_JOBS_URL }}
          BUILD_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/smoke-cloudflare.mjs

  delete-legacy-workers:
    needs: [smoke-production]
    if: >-
      always() &&
      inputs.delete_legacy_workers &&
      needs.smoke-production.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELETE_LEGACY_WORKERS: "1"
      SKIP_BACKGROUND_DEPLOY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 旧3 Cron Workerを削除
        run: |
          npm ci --no-audit --no-fund
          npm run workers:deploy:verified
