name: Apply Discord KV write budget

on:
  push:
    branches:
      - agent/external-api-guardrails-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/external-api-guardrails-v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Discord KV書込予算を適用
        run: node scripts/agent-discord-kv-write-budget.mjs
      - name: 変更をcommitしてpush
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "最適化: Discord DM cacheのKV書込を日次予算内へ制限"
          git push origin HEAD:agent/external-api-guardrails-v2
