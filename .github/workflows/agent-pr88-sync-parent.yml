name: Agent PR88 sync parent

on:
  push:
    branches:
      - agent/ux-and-status-simplification
    paths:
      - .github/workflows/agent-pr88-sync-parent.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-and-status-simplification
          fetch-depth: 0
      - name: Merge latest parent branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/db-canonical-migration-v2
          set +e
          git merge --no-commit --no-ff -X theirs origin/agent/db-canonical-migration-v2
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            if [ "${#unresolved[@]}" -gt 0 ]; then
              git checkout --theirs -- "${unresolved[@]}"
              git add -- "${unresolved[@]}"
            fi
          fi
          rm .github/workflows/agent-pr88-sync-parent.yml
          git add -A
          git commit -m "PR89最新headへ追従"
          git push origin HEAD:agent/ux-and-status-simplification
