name: MIG-0504 user route visual smoke
on:
  pull_request:
    paths:
      - "scripts/migration-user-routes.visual.mjs"
      - "scripts/migration-user-routes.test.mjs"
      - ".github/workflows/mig-0504-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user-route-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@flamenode/ui
      - run: npm run build --workspace=@flamenode/site
      - name: Install isolated visual test browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture 390px and 1440px fixture routes, fail on overflow/hydration errors
        run: |
          python3 -m http.server 4329 --bind 127.0.0.1 --directory apps/site/dist > "$RUNNER_TEMP/mig-0504-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node scripts/migration-user-routes.visual.mjs
      - name: Upload all screenshots for human comparison with approved mock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mig-0504-visual-screenshots
          path: artifacts/mig-0504-visual/*.png
          if-no-files-found: error
          retention-days: 14
