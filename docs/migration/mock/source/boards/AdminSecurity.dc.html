<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>セキュリティチェック</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0;background:#000}</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <div class="c-side"><dc-import name="AdminNav" active="security" hint-size="100%,1240px"></dc-import></div>
  <main class="c-main">
    <div class="c-head">
      <div><h1 class="t-display">セキュリティ</h1><p class="muted">権限・認証状態の整合性を読み取り専用で点検します。初期表示では実行せず、必要なときだけ明示的に実行します。</p></div>
      <button type="button" class="fn-btn fn-btn--primary"><i class="fa-solid fa-play" aria-hidden="true"></i>診断を実行</button>
    </div>
    <div class="stack" style="gap: 12px; padding: 48px 0; align-items: flex-start;">
      <span class="icon-tile lg"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i></span>
      <span class="t-h3">セキュリティ診断は未実行です</span>
      <span class="t-sm muted">実行すると、漏洩・権限矛盾の可能性がある項目を状態フィルタ付きの一覧で表示します。</span>
    </div>
    <h2 class="il t-label muted" style="margin: 0 0 8px;"><i class="fa-solid fa-eye" aria-hidden="true"></i>実行後の表示例</h2>
    <div class="dt" style="--cols: minmax(240px,1.6fr) 100px 72px minmax(200px,1.4fr); --minw: 0px; opacity: .7;">
      <div class="dt-h"><span>チェック項目</span><span>状態</span><span class="num">件数</span><span>サンプル / 備考</span></div>
      <div class="dt-r"><span>BAN ユーザーの有効セッション</span><span class="st"><span class="dot ok"></span>OK</span><span class="num">0</span><span class="muted">—</span></div>
      <div class="dt-r"><span>owner 不在のイベント</span><span class="st"><span class="dot err"></span>危険</span><span class="num">1</span><span class="t-mono t-sm">toshikoshi</span></div>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
