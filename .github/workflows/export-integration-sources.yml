name: Export integration sources

on:
  push:
    branches:
      - agent/db-canonical-migration-v2
    paths:
      - .github/workflows/export-integration-sources.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-integration-sources.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export branch snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-sources
          git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin \
            | sort > integration-sources/branches.txt

          refs=(
            main
            agent/db-canonical-migration-v2
            agent/db-canonical-events
            agent/db-canonical-foundation
            agent/db-canonical-x-identity
            agent/db-canonical-videos-import
            agent/chapter-comment-delete-and-validation
            agent/ux-and-status-simplification
            agent/unify-custom-questions
          )

          for ref in "${refs[@]}"; do
            if git show-ref --verify --quiet "refs/remotes/origin/${ref}"; then
              safe_name="${ref//\//__}"
              git archive --format=tar "origin/${ref}" | gzip -9 > "integration-sources/${safe_name}.tar.gz"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: integration-sources-${{ github.run_id }}
          path: integration-sources
          if-no-files-found: error
          retention-days: 1
