name: Repository Audit Snapshot 32da

on:
  pull_request:
    paths:
      - ".github/workflows/repo-audit-snapshot-32da.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: tar --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='.vercel' --exclude='.tmp' -czf /tmp/flamenode-32da-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: flamenode-32da-source-${{ github.sha }}
          path: /tmp/flamenode-32da-source.tar.gz
          retention-days: 1
