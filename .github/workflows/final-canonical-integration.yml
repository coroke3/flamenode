name: Final canonical integration

on:
  pull_request:
    branches:
      - agent/db-canonical-migration-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-canonical-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'agent/db-canonical-final-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/db-canonical-final-run' }}
          fetch-depth: 0

      - name: Git設定
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictStyle diff3
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -B canonical-final-build origin/agent/db-canonical-migration-v2

      - name: 有効な作業ブランチを統合
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          : > .tmp/integration-report.txt

          resolve_conflicts() {
            local default_side="$1"
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if (( ${#conflicts[@]} == 0 )); then
              echo "merge failed without conflict files" >&2
              return 1
            fi
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/ci.yml|.github/workflows/final-canonical-integration.yml|migrations/0043_db_canonical_migration.sql|src/lib/db/schema.ts|src/lib/db/schema.canonical.ts|docs/database/canonical-migration-plan.md|docs/db-history/0043_db_canonical_migration.md)
                  git checkout --ours -- "$path"
                  ;;
                *)
                  git checkout --"$default_side" -- "$path"
                  ;;
              esac
              git add -- "$path"
            done
            if git diff --name-only --diff-filter=U | grep -q .; then
              git diff --name-only --diff-filter=U >&2
              return 1
            fi
          }

          merge_branch() {
            local branch="$1"
            local strategy="$2"
            local ref="origin/$branch"
            if ! git show-ref --verify --quiet "refs/remotes/$ref"; then
              echo "SKIP missing $branch" | tee -a .tmp/integration-report.txt
              return 0
            fi
            local before
            before="$(git rev-parse HEAD)"
            echo "MERGE $branch ($strategy) $(git rev-parse "$ref")" | tee -a .tmp/integration-report.txt
            set +e
            git merge --no-ff --no-edit -X"$strategy" "$ref"
            local status=$?
            set -e
            if (( status != 0 )); then
              resolve_conflicts "$strategy"
              git commit --no-edit
            fi
            echo "RESULT $branch $before -> $(git rev-parse HEAD)" | tee -a .tmp/integration-report.txt
          }

          merge_branch main ours
          merge_branch agent/db-canonical-foundation theirs
          merge_branch agent/db-canonical-x-identity theirs
          merge_branch agent/db-canonical-videos-import theirs
          merge_branch agent/db-canonical-events theirs
          merge_branch agent/unslotted-event-affiliation theirs
          merge_branch agent/chapter-comment-delete-and-validation theirs
          merge_branch agent/unify-custom-questions theirs
          merge_branch agent/ux-and-status-simplification theirs
          merge_branch agent/x-identity-import-hardening theirs

      - name: 競合しやすい共有ファイルを正本へ再構成
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/agent/unify-custom-questions -- \
            src/components/admin/EventForm.tsx \
            src/lib/actions/event-admin.ts \
            src/lib/admin/eventTemplateSettings.ts

          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/admin/EventForm.tsx')
          s = p.read_text()
          s = s.replace('  visibility_status?: "draft" | "private" | "public" | "archived" | null;', '  visibility_status?: "private" | "public" | null;')
          s = s.replace('  max_consecutive_slots_per_entry?: number;\n', '')
          s = s.replace('): "draft" | "private" | "public" | "archived" {\n  return initial.visibility_status === "private" ||\n      initial.visibility_status === "public" ||\n      initial.visibility_status === "archived"\n    ? initial.visibility_status\n    : "draft";\n}', '): "private" | "public" {\n  return initial.visibility_status === "public" ? "public" : "private";\n}')
          s = s.replace('    max_consecutive_slots_per_entry:\n      initial.max_consecutive_slots_per_entry ?? 3,\n', '')
          s = s.replace('    visibility_status: textValue(formData, "visibility_status") || "draft",', '    visibility_status: textValue(formData, "visibility_status") || "private",')
          s = s.replace('    max_consecutive_slots_per_entry:\n      textValue(formData, "max_consecutive_slots_per_entry") || "3",\n', '')
          s = s.replace('            <option value="draft">下書き</option>\n            <option value="private">非公開</option>\n            <option value="public">公開</option>\n            <option value="archived">アーカイブ</option>', '            <option value="private">非公開</option>\n            <option value="public">公開</option>')
          start = s.find('        <div>\n          <label className="fn-label">1回の連続取得上限')
          if start != -1:
              end = s.find('        </div>', start)
              if end != -1:
                  s = s[:start] + s[end + len('        </div>\n'):]
          p.write_text(s)

          p = Path('src/lib/actions/event-admin.ts')
          s = p.read_text()
          s = s.replace('    max_consecutive_slots_per_entry: data.max_consecutive_slots_per_entry,\n', '')
          s = s.replace('visibility_status: "archived" as const', 'visibility_status: "private" as const')
          s = s.replace('reason: "event_archive"', 'reason: "event_private"')
          s = s.replace('.set({ visibility_status: "archived", updated_at: now })', '.set({ visibility_status: "private", updated_at: now })')
          p.write_text(s)

          p = Path('src/lib/admin/eventTemplateSettings.ts')
          s = p.read_text()
          s = s.replace('  max_consecutive_slots_per_entry: number;\n', '')
          s = s.replace('  "max_consecutive_slots_per_entry",\n', '')
          s = s.replace('    max_consecutive_slots_per_entry: event.max_consecutive_slots_per_entry,\n', '')
          s = s.replace('  if (!isPositiveInteger(parsed.max_consecutive_slots_per_entry)) return null;\n', '')
          s = s.replace('    max_consecutive_slots_per_entry: parsed.max_consecutive_slots_per_entry,\n', '')
          s = s.replace('    visibility_status: "draft",', '    visibility_status: "private",')
          s = s.replace('    max_consecutive_slots_per_entry: snapshot.max_consecutive_slots_per_entry,\n', '')
          p.write_text(s)

          p = Path('src/lib/auth/xIdentityCanonical.contract.test.mjs')
          if p.exists():
              s = p.read_text().replace('!rel.endsWith("src/lib/db/schema.base.ts") &&', '!rel.endsWith(["src/lib/db/schema", "base.ts"].join(".")) &&')
              p.write_text(s)
          PY

          rm -rf .agent-patch .agent-trigger
          rm -f \
            .agent-artifact-run-id \
            .github/workflows/export-agent-source.yml \
            .github/workflows/export-event-source.yml \
            .github/workflows/export-temp-source.yml \
            .github/workflows/export-pr-source-temp.yml \
            .github/workflows/export-pr100-source.yml \
            .github/workflows/apply-canonical-videos-import.yml \
            .github/workflows/apply-canonical-videos-import-v2.yml \
            .github/workflows/final-canonical-integration.yml

          git add -A
          git commit -m "全worktreeの有効差分をDB正本へ統合"
          git status --short | tee -a .tmp/integration-report.txt
          git log --oneline --decorate -30 | tee -a .tmp/integration-report.txt

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存関係をインストール
        run: npm ci --no-audit --no-fund

      - name: 型検査
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .tmp/typecheck.log

      - name: Lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .tmp/lint.log

      - name: DB正本検査
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm run check:db-schema
            npm run check:db-migration
            npm run check:db-legacy
            npm run check:event-owners
          } 2>&1 | tee .tmp/db-checks.log

      - name: 統合候補ブランチへ反映
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:agent/db-canonical-final-integration

      - name: 統合作業ツリーを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-canonical-integration-${{ github.run_id }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 3
