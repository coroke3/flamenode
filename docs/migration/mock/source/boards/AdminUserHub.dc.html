    <div class="row" style="gap: 20px; margin-top: 16px; flex-wrap: wrap;">
      <img class="avatar" src="/_blob/6ecfc7b6882f277d815f563e873f25ee" alt="" style="width: 72px; height: 72px;">

      <sc-if value="{{t_1}}" hint-placeholder-val="{{false}}"><dc-import name="AdminUserEdit" theme="{{theme}}" hint-size="100%,1100px"></dc-import></sc-if>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"tab":{"editor":"enum","options":["AdminUser", "AdminUserEdit"],"default":"AdminUser"},"$preview":{"width":1440,"height":1840}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: null }; }
  renderVals() {
    const T = [["AdminUser", "ユーザー詳細", "fa-solid fa-id-card", ""], ["AdminUserEdit", "設定編集", "fa-solid fa-sliders", ""]];
    const cur = this.state.tab || this.props.tab || T[0][0];
    const r = { theme: this.props.theme ?? 'dark',
      tabs: T.map(([id, label, icon, n]) => ({ label, icon, n, cur: id === cur ? 'page' : 'false', sel: id === cur ? 'true' : 'false', pick: (e) => { e.preventDefault(); this.setState({ tab: id }); } })) };
    T.forEach(([id], i) => { r['t_' + i] = id === cur; });
    return r;
  }
}
</script>
