name = "flamenode-content-jobs"
main = "index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers FreeはCron間隔にかかわらずCPU 10ms。
# 1回1 targetに固定し、15分間隔で小分け処理する。
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "flamenode_db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "R2"
bucket_name = "flamenode-storage"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"
