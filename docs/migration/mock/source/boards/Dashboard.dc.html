<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ダッシュボード</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootCls}}" data-theme="{{theme}}" lang="ja">
  <sc-if value="{{full}}" hint-placeholder-val="{{false}}"><dc-import name="PublicHeader" theme="{{theme}}" active="" hint-size="100%,72px"></dc-import></sc-if>

  <div class="wrap" style="padding-top: 32px;">
    <sc-if value="{{full}}" hint-placeholder-val="{{false}}"><nav class="subnav" aria-label="マイページ">
      <a href="MyPage.dc.html" class="il" aria-current="page"><i class="fa-solid fa-house" aria-hidden="true"></i>ダッシュボード</a>
      <a href="MyPage.dc.html" class="il"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i>参加・投稿</a>
      <a href="MyPage.dc.html" class="il"><i class="fa-solid fa-bookmark" aria-hidden="true"></i>ライブラリ</a>
      <a href="MyPage.dc.html" class="il"><i class="fa-solid fa-gear" aria-hidden="true"></i>設定</a>
    </nav></sc-if>

    <div class="wrap-row dash-head" style="justify-content: space-between; gap: 24px; margin-top: 8px; align-items: center;">
      <div class="row" style="gap: 16px;">
        <img class="avatar pf-av" src="/_blob/fc027fe6fe3a001a22a1933270ce72b9" alt="" style="width: 96px; height: 96px;">
        <div class="stack" style="gap: 2px;">
          <h1 class="t-display" style="margin: 0;">{{name}}</h1>
          <span class="t-sm muted">{{handle}}</span>
        </div>
      </div>
      <div class="row" style="gap: 8px;">
        <a href="MyPage.dc.html" class="fn-btn fn-btn--primary"><i class="fa-solid fa-plus" aria-hidden="true"></i><span class="dh-long">作品を</span>投稿する</a>
      </div>
    </div>

    <sc-if value="{{banner.show}}" hint-placeholder-val="{{false}}">
      <div class="notice" style="margin-top: 32px; align-items: center;">
        <i class="{{banner.icon}}" aria-hidden="true" style="font-size: 16px;"></i>
        <span class="stack" style="gap: 2px; flex: 1;"><b class="t-sm">{{banner.title}}</b><span class="t-sm muted">{{banner.body}}</span></span>
        <a href="{{banner.href}}" class="fn-btn fn-btn--secondary fn-btn--sm">{{banner.cta}}</a>
      </div>
    </sc-if>

    <!-- 次にやること(参加・投稿タブと同じカード) -->
    <section aria-labelledby="next" style="margin-top: 32px;">
      <h2 id="next" class="vh">次にやること</h2>
      <div class="row ent-next raised" style="gap: 20px; flex-wrap: wrap; padding: 20px; align-items: center;">
        <img src="/_blob/be71b2f744d470e10fb8c8ca733bbace" alt="" style="width: 120px; aspect-ratio: 16/9; object-fit: cover; display: block;">
        <span class="stack" style="gap: 6px; flex: 1 1 180px;">
          <span style="font-size: 18px;">PVSF2026S に作品を提出</span>
          <span class="meta-i"><span class="t-num">11.03 18:24 – 18:36(連続2枠)</span></span>
          <div class="dl dl-sm" role="timer" aria-label="提出締切まであと3日(10.07 23:59)"><span class="dl-k t-xs muted">提出締切 <span class="t-num">10.07 23:59</span></span><span class="dl-v" aria-hidden="true"><span class="dl-u">あと</span><b class="dl-n t-num">3</b><span class="dl-u">日</span></span></div>
        </span>
        <a href="EntrySlotted.dc.html" class="fn-btn fn-btn--primary">続きから提出</a>
      </div>
    </section>

    <div class="metrics" style="margin-top: 40px;" aria-label="アカウント統計">
      <div class="metric"><b>1,284</b><span>累計いいね</span></div>
      <div class="metric"><b>86,320</b><span>累計再生数</span></div>
      <div class="metric"><b>10</b><span>投稿作品</span></div>
      <div class="metric"><b>9</b><span>参加イベント</span></div>
    </div>

    <section aria-labelledby="works" class="dash-works" style="margin-top: 56px;">
      <div class="sec-head" style="align-items: center; flex-wrap: wrap; gap: 12px;">
        <h2 id="works" class="t-h2">作品 <span class="t-num muted t-sm" style="font-weight: 400;">{{workCount}}</span></h2>
        <div class="seg sm" role="tablist" aria-label="作品の絞り込み"><sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><button type="button" role="tab" class="{{f.cls}}" aria-selected="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
      </div>
      <sc-for list="{{works}}" as="w" hint-placeholder-count="5">
        <a href="VideoEdit.dc.html" class="fn-row">
          <img class="fn-row__thumb" src="{{w.thumb}}" alt="">
          <span class="fn-row__body"><span class="fn-row__title">{{w.title}}</span><span class="fn-row__meta">{{w.meta}}</span></span>
          <span class="fn-row__trail row" style="gap: 12px;"><sc-if value="{{w.collab}}" hint-placeholder-val="{{false}}"><span class="tag-c t-xs muted">共同編集</span></sc-if><span class="st t-sm"><i class="{{w.dot}}" aria-hidden="true"></i>{{w.state}}</span></span>
        </a>
      </sc-for>
      <sc-if value="{{hasMore}}" hint-placeholder-val="{{true}}"><button type="button" class="fn-btn fn-btn--tertiary dash-more" onClick="{{showAll}}">すべて表示<span class="t-num muted">{{moreCount}}</span></button></sc-if>
    </section>
  </div>
  <sc-if value="{{full}}" hint-placeholder-val="{{false}}"><div class="foot-spacer"></div>
  <dc-import name="PublicFooter" theme="{{theme}}" hint-size="100%,320px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embed":{"editor":"boolean","default":true},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"xstate":{"editor":"enum","options":["ok","pending","none","onboarding"],"default":"ok"},"$preview":{"width":1440,"height":2100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'all', all: false }; }
  renderVals() {
    const r = this.__emb();
    const emb = this.props.embed ?? true;
    r.full = !emb; r.rootCls = emb ? 'p-root emb-root' : 'p-root';
    return r;
  }
  __works(T) {
    const f = this.state.f || 'all'; const all = !!this.state.all;
    const W = [
      { title: '崇渦に関するお知らせ 前編', meta: 'PVSF2026S · 提出 10.04', state: '審査待ち', dot: 'ms ms-pending_actions st-ic warn', thumb: T[4], collab: false },
      { title: '魔法少女 このは・グリモワール 最終決戦編', meta: 'PVSF2026Sp · 2026.03.29', state: '公開', dot: 'fa-solid fa-eye st-ic ok', thumb: T[4], collab: false },
      { title: '祟渦に関するお知らせ 後編', meta: 'ホラー映画合作 · PVSF2026Sp', state: '公開', dot: 'fa-solid fa-eye st-ic ok', thumb: T[6], collab: true },
      { title: '【短編アニメ】魔法少女vs改造人間', meta: 'PVSF2025Sp · 2025.03.30', state: '公開', dot: 'fa-solid fa-eye st-ic ok', thumb: T[5], collab: false },
      { title: '【自主制作アニメ】めざした空の向こう側', meta: 'PVSF2025Sp · 2025.03.30', state: '非公開', dot: 'fa-solid fa-eye-slash st-ic mute', thumb: T[1], collab: false },
      { title: 'Mitchie Mメドレー合作', meta: 'Mitchie Mメドレー合作 · PVSF2025S', state: '公開', dot: 'fa-solid fa-eye st-ic ok', thumb: T[3], collab: true },
      { title: 'ホラー映画ロケ下見.mp4', meta: 'ホラー映画合作 · PVSF2025S', state: '非公開', dot: 'fa-solid fa-eye-slash st-ic mute', thumb: T[0], collab: true },
    ];
    const list = W.filter(w => f === 'all' || (f === 'collab' ? w.collab : !w.collab));
    const N = 5; const shown = all ? list : list.slice(0, N);
    return {
      works: shown, workCount: String(list.length).padStart(2, '0'), hasMore: list.length > N && !all, moreCount: String(list.length - N),
      showAll: () => this.setState({ all: true }),
      filters: [['all', 'すべて'], ['mine', '自分'], ['collab', '共同編集']].map(([id, label]) => ({ label, cls: f === id ? 'on' : '', on: f === id ? 'true' : 'false', pick: () => this.setState({ f: id, all: false }) }))
    };
  }
  __emb() {
    const T = ['/_blob/525c7209e503b8327cbd5bf4a64e5fc8','/_blob/191c3939aefb326fc04fd3ccf6db83a9','/_blob/fc027fe6fe3a001a22a1933270ce72b9','/_blob/6ecfc7b6882f277d815f563e873f25ee','/_blob/3d8d62bbac75243d266ec6e3de039e6d','/_blob/f5c1a8af077b887c7bb1d043f3cf69c1','/_blob/be71b2f744d470e10fb8c8ca733bbace','/_blob/755d245a064a6f5935c3dccd9a941048'];
    const xs = this.props.xstate ?? 'ok';
    const B = {
      ok: { show: false },
      pending: { show: true, icon: 'ms ms-pending_actions', title: '申請完了・承認待ち', body: 'X ID 連携の申請を運営が確認中です。その間も枠は確保できます。', cta: '申請を確認', href: 'MyPage.dc.html' },
      none: { show: true, icon: 'fa-brands fa-x-twitter', title: 'X ID 未連携', body: 'X ID を連携し、運営が承認すると作品を投稿できます。', cta: 'X ID を連携する', href: 'MyPage.dc.html' },
      onboarding: { show: true, icon: 'fa-solid fa-list-check', title: '初期設定が未完了です', body: '利用規約への同意と活動名義の登録が終わると投稿できます。', cta: '初期設定を続ける', href: 'OnboardingTerms.dc.html' },
    }[xs];
    const named = xs === 'ok';
    return {
      theme: this.props.theme ?? 'dark', banner: B,
      name: named ? 'おたこ' : 'ゲスト', handle: named ? '@012345rty · 活動名義' : (xs === 'pending' ? 'X ID 承認待ち' : 'X ID 未登録'),
      ...this.__works(T),
      xids: named ? [
        { id: '012345rty', name: 'おたこ', icon: T[2], state: 'アクティブ', dot: 'fa-solid fa-check st-ic ok' },
        { id: 'otako_sub', name: 'おたこ(サブ)', icon: T[3], state: '承認待ち', dot: 'ms ms-pending_actions st-ic warn' },
      ] : []
    };
  }
}
</script>
</body>
</html>
