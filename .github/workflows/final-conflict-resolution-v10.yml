name: Final canonical conflict resolution v10

on:
  push:
    branches:
      - agent/db-canonical-final-conflicts-v10
    paths:
      - .agent-trigger/final-conflict-resolution-v10
  pull_request:
    branches:
      - agent/db-canonical-migration-v2
    paths:
      - .agent-trigger/final-conflict-resolution-v10
      - .github/workflows/final-conflict-resolution-v10.yml

permissions:
  contents: write

concurrency:
  group: final-canonical-conflict-resolution-v10
  cancel-in-progress: false

jobs:
  resolve-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/db-canonical-final-conflicts-v10
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply final semantic conflict resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .tmp src/lib/xid

          cat > workers/cleanup/retention.ts <<'EOF'
          /** cleanup Worker の保持期限・リトライ計算。 */

          export const SENT_TTL_SEC = 14 * 24 * 60 * 60;
          export const FAILED_TTL_SEC = 30 * 24 * 60 * 60;
          export const AUDIT_COMPACT_AFTER_DAYS_DEFAULT = 30;
          export const AUDIT_CLEANUP_BATCH_LIMIT = 500;
          export const CLEANUP_MAX_RETRIES = 3;

          export interface NotificationCutoffs {
            sentCutoff: number;
            failedCutoff: number;
          }

          export interface AuditCleanupSettings {
            compactAfterDays: number;
          }

          export interface RetryDecision {
            shouldRetry: boolean;
            reason: string;
          }

          function clampPositiveInteger(
            value: unknown,
            min: number,
            max: number,
            fallback: number,
          ): number {
            const raw = Number(value ?? fallback);
            if (!Number.isFinite(raw) || raw <= 0) return fallback;
            return Math.min(Math.max(Math.floor(raw), min), max);
          }

          export function computeNotificationCutoffs(now: number): NotificationCutoffs {
            return {
              sentCutoff: now - SENT_TTL_SEC,
              failedCutoff: now - FAILED_TTL_SEC,
            };
          }

          export function normalizeAuditCleanupSettings(
            row:
              | { audit_compact_after_days?: unknown }
              | null
              | undefined,
          ): AuditCleanupSettings {
            return {
              compactAfterDays: clampPositiveInteger(
                row?.audit_compact_after_days,
                1,
                365,
                AUDIT_COMPACT_AFTER_DAYS_DEFAULT,
              ),
            };
          }

          export function computeAuditCompactCutoff(
            now: number,
            compactAfterDays: number,
          ): number {
            const days = clampPositiveInteger(
              compactAfterDays,
              1,
              365,
              AUDIT_COMPACT_AFTER_DAYS_DEFAULT,
            );
            return now - days * 86400;
          }

          export function shouldRetryCleanupError(
            attemptCount: number,
            error: unknown,
          ): RetryDecision {
            if (attemptCount >= CLEANUP_MAX_RETRIES) {
              return { shouldRetry: false, reason: "max_retries_reached" };
            }
            const message = String(
              (error as { message?: unknown })?.message ?? error ?? "",
            ).toLowerCase();
            if (
              message.includes("no such column") ||
              message.includes("no such table") ||
              message.includes("syntax error")
            ) {
              return { shouldRetry: false, reason: "schema_error" };
            }
            if (
              message.includes("too many") ||
              message.includes("rate") ||
              message.includes("timeout") ||
              message.includes("network") ||
              message.includes("429") ||
              message.includes("503")
            ) {
              return { shouldRetry: true, reason: "transient_error" };
            }
            return { shouldRetry: true, reason: "unknown_error" };
          }
          EOF

          cat > workers/cleanup/index.ts <<'EOF'
          /** 通知・インポートpreview・監査ログの期限切れデータを削除する。 */
          import {
            computeAuditCompactCutoff,
            computeNotificationCutoffs,
            normalizeAuditCleanupSettings,
            shouldRetryCleanupError,
            AUDIT_CLEANUP_BATCH_LIMIT,
            AUDIT_COMPACT_AFTER_DAYS_DEFAULT,
            CLEANUP_MAX_RETRIES,
            type AuditCleanupSettings,
          } from "./retention.ts";
          import { logWorkerJob, safeErrorSummary } from "../shared/safeLog.ts";

          export interface Env {
            DB: D1Database;
          }

          export async function runCleanupWithRetry(
            env: Env,
          ): Promise<{ processed: number; failed: number }> {
            const startedMs = Date.now();
            const runId = crypto.randomUUID();
            let attempt = 0;
            let lastError: unknown = null;
            while (attempt < CLEANUP_MAX_RETRIES) {
              try {
                await runCleanup(env);
                return { processed: 1, failed: 0 };
              } catch (error) {
                attempt += 1;
                lastError = error;
                const decision = shouldRetryCleanupError(attempt, error);
                logWorkerJob({
                  worker: "content-jobs",
                  job: "cleanup-retry",
                  run_id: runId,
                  started_at: new Date(startedMs).toISOString(),
                  processed: 0,
                  skipped: 0,
                  failed: 1,
                  duration_ms: Date.now() - startedMs,
                  result: "failed",
                  error: `${decision.reason}:${safeErrorSummary(error)}`,
                });
                if (!decision.shouldRetry) break;
                await new Promise((resolve) => setTimeout(resolve, 100 * attempt));
              }
            }
            logWorkerJob({
              worker: "content-jobs",
              job: "cleanup-give-up",
              run_id: runId,
              started_at: new Date(startedMs).toISOString(),
              processed: 0,
              skipped: 0,
              failed: 1,
              duration_ms: Date.now() - startedMs,
              result: "failed",
              error: safeErrorSummary(lastError),
            });
            return { processed: 0, failed: 1 };
          }

          export async function readAuditCleanupSettings(
            env: Env,
          ): Promise<AuditCleanupSettings> {
            try {
              const row = await env.DB.prepare(
                `SELECT audit_compact_after_days
                 FROM system_settings
                 WHERE id = 'default'
                 LIMIT 1`,
              ).first<{ audit_compact_after_days: number | null }>();
              return normalizeAuditCleanupSettings(row);
            } catch (error) {
              console.warn(
                JSON.stringify({
                  worker: "content-jobs",
                  job: "cleanup-audit-settings",
                  result: "fallback",
                  error: safeErrorSummary(error),
                }),
              );
              return { compactAfterDays: AUDIT_COMPACT_AFTER_DAYS_DEFAULT };
            }
          }

          export async function runCleanup(env: Env): Promise<void> {
            const now = Math.floor(Date.now() / 1000);
            const { sentCutoff, failedCutoff } = computeNotificationCutoffs(now);
            const { compactAfterDays } = await readAuditCleanupSettings(env);
            const compactCutoff = computeAuditCompactCutoff(now, compactAfterDays);

            await env.DB.prepare(
              `DELETE FROM notification_outbox
               WHERE status = 'sent' AND created_at IS NOT NULL AND created_at < ?1
               LIMIT ?2`,
            ).bind(sentCutoff, AUDIT_CLEANUP_BATCH_LIMIT).run();

            await env.DB.prepare(
              `DELETE FROM notification_outbox
               WHERE status IN ('failed', 'dead_letter')
                 AND created_at IS NOT NULL
                 AND created_at < ?1
               LIMIT ?2`,
            ).bind(failedCutoff, AUDIT_CLEANUP_BATCH_LIMIT).run();

            await env.DB.prepare(
              `DELETE FROM spreadsheet_import_runs
               WHERE nonce IN (
                 SELECT nonce
                 FROM spreadsheet_import_runs
                 WHERE consumed_at IS NOT NULL OR expires_at < ?1
                 ORDER BY COALESCE(consumed_at, expires_at) ASC
                 LIMIT ?2
               )`,
            ).bind(now, AUDIT_CLEANUP_BATCH_LIMIT).run();

            await env.DB.prepare(
              `UPDATE audit_logs
               SET restore_status = 'expired'
               WHERE restore_status = 'restorable'
                 AND expires_at IS NOT NULL
                 AND expires_at < ?1
               LIMIT ?2`,
            ).bind(now, AUDIT_CLEANUP_BATCH_LIMIT).run();

            await env.DB.prepare(
              `DELETE FROM audit_logs
               WHERE expires_at IS NOT NULL AND expires_at < ?1
               LIMIT ?2`,
            ).bind(now, AUDIT_CLEANUP_BATCH_LIMIT).run();

            await env.DB.prepare(
              `UPDATE audit_logs
               SET before_json = NULL,
                   after_json = NULL,
                   inverse_patch_json = NULL,
                   restore_status = CASE
                     WHEN restore_status = 'restorable' THEN 'not_restorable'
                     ELSE restore_status
                   END
               WHERE created_at < ?1
                 AND (before_json IS NOT NULL OR after_json IS NOT NULL)
               LIMIT ?2`,
            ).bind(compactCutoff, AUDIT_CLEANUP_BATCH_LIMIT).run();
          }
          EOF

          cat > workers/cleanup/retention.test.mjs <<'EOF'
          import { test } from "node:test";
          import assert from "node:assert/strict";
          import {
            computeAuditCompactCutoff,
            computeNotificationCutoffs,
            normalizeAuditCleanupSettings,
            shouldRetryCleanupError,
            AUDIT_COMPACT_AFTER_DAYS_DEFAULT,
            CLEANUP_MAX_RETRIES,
            SENT_TTL_SEC,
            FAILED_TTL_SEC,
          } from "./retention.ts";

          test("通知保持期限を現在時刻から計算する", () => {
            const now = 2_000_000_000;
            const cutoffs = computeNotificationCutoffs(now);
            assert.equal(cutoffs.sentCutoff, now - SENT_TTL_SEC);
            assert.equal(cutoffs.failedCutoff, now - FAILED_TTL_SEC);
          });

          test("system_settings.audit_compact_after_daysを正規化する", () => {
            assert.deepEqual(normalizeAuditCleanupSettings(null), {
              compactAfterDays: AUDIT_COMPACT_AFTER_DAYS_DEFAULT,
            });
            assert.equal(
              normalizeAuditCleanupSettings({ audit_compact_after_days: 14 })
                .compactAfterDays,
              14,
            );
            assert.equal(
              normalizeAuditCleanupSettings({ audit_compact_after_days: -1 })
                .compactAfterDays,
              AUDIT_COMPACT_AFTER_DAYS_DEFAULT,
            );
          });

          test("監査payload軽量化cutoffを計算する", () => {
            const now = 2_000_000_000;
            assert.equal(computeAuditCompactCutoff(now, 14), now - 14 * 86400);
          });

          test("cleanupリトライ判定はschema errorを再試行しない", () => {
            assert.equal(
              shouldRetryCleanupError(0, new Error("no such column: old_column"))
                .shouldRetry,
              false,
            );
            assert.equal(
              shouldRetryCleanupError(CLEANUP_MAX_RETRIES, new Error("timeout"))
                .shouldRetry,
              false,
            );
            assert.equal(
              shouldRetryCleanupError(0, new Error("HTTP 503")).shouldRetry,
              true,
            );
          });
          EOF

          cat > workers/cleanup/index.test.mjs <<'EOF'
          import { test } from "node:test";
          import assert from "node:assert/strict";
          import {
            runCleanup,
            runCleanupWithRetry,
            readAuditCleanupSettings,
          } from "./index.ts";

          function makePreparedMock(sql, recorder, firstReturn) {
            return {
              bind(...args) {
                this.binds = args;
                return this;
              },
              async first() {
                recorder.push({ sql, op: "first", binds: this.binds ?? [] });
                return firstReturn ?? null;
              },
              async run() {
                recorder.push({ sql, op: "run", binds: this.binds ?? [] });
                return { success: true };
              },
            };
          }

          function makeEnv(options = {}) {
            const recorder = [];
            return {
              recorder,
              env: {
                DB: {
                  prepare(sql) {
                    const firstReturn = sql.includes("audit_compact_after_days")
                      ? options.settings ?? { audit_compact_after_days: 30 }
                      : null;
                    return makePreparedMock(sql, recorder, firstReturn);
                  },
                },
              },
            };
          }

          test("cleanupはsystem_settings.audit_*だけを設定正本として使う", async () => {
            const { env, recorder } = makeEnv({
              settings: { audit_compact_after_days: 14 },
            });
            await runCleanup(env);
            const sql = recorder.map((entry) => entry.sql).join("\n");
            assert.match(sql, /audit_compact_after_days/);
            assert.doesNotMatch(sql, /history_retention_days/);
            assert.doesNotMatch(sql, /audit_log_settings/);
            assert.doesNotMatch(sql, /priority_reclaim_until/);
            assert.match(sql, /DELETE FROM notification_outbox/);
            assert.match(sql, /DELETE FROM spreadsheet_import_runs/);
            assert.match(sql, /DELETE FROM audit_logs/);
            const compact = recorder.find(
              (entry) => entry.sql.includes("before_json = NULL"),
            );
            assert.ok(compact);
            const expected = Math.floor(Date.now() / 1000) - 14 * 86400;
            assert.ok(Math.abs(compact.binds[0] - expected) <= 5);
          });

          test("設定読取失敗時は監査compact既定値へ戻す", async () => {
            const env = {
              DB: {
                prepare() {
                  return {
                    async first() {
                      throw new Error("D1 unavailable");
                    },
                  };
                },
              },
            };
            assert.deepEqual(await readAuditCleanupSettings(env), {
              compactAfterDays: 30,
            });
          });

          test("一時エラーは再試行しschema errorは再試行しない", async () => {
            let firstCalls = 0;
            const transientEnv = {
              DB: {
                prepare() {
                  return {
                    bind() { return this; },
                    async first() {
                      firstCalls += 1;
                      if (firstCalls === 1) throw new Error("Too many requests");
                      return { audit_compact_after_days: 30 };
                    },
                    async run() { return { success: true }; },
                  };
                },
              },
            };
            const result = await runCleanupWithRetry(transientEnv);
            assert.equal(result.failed, 0);
            assert.ok(firstCalls >= 2);
          });
          EOF

          cat > src/lib/xid/mergeAudits.ts <<'EOF'
          import type { WriteAuditLogInput } from "../audit/types.ts";

          export type EventStaffSnapshot = {
            id: string;
            event_id: string;
            x_user_id: string;
            display_name: string;
            permission_preset: string;
            custom_permission_keys_json: string | null;
            is_public: number;
            public_role_label: string | null;
            approved_by_auth_user_id: string | null;
            approved_at: number | null;
            created_at: number;
            updated_at: number;
          };

          function sameSnapshot(
            before: EventStaffSnapshot,
            after: EventStaffSnapshot,
          ): boolean {
            return Object.keys(before).every(
              (key) =>
                before[key as keyof EventStaffSnapshot] ===
                after[key as keyof EventStaffSnapshot],
            );
          }

          export function buildEventStaffMergeAudits(input: {
            beforeRows: readonly EventStaffSnapshot[];
            afterRows: readonly EventStaffSnapshot[];
            actorUserId: string;
            fromXId: string;
            toXId: string;
          }): WriteAuditLogInput[] {
            const afterById = new Map(
              input.afterRows.map((row) => [row.id, row] as const),
            );
            return input.beforeRows.flatMap((before): WriteAuditLogInput[] => {
              const after = afterById.get(before.id) ?? null;
              if (!after) {
                return [{
                  table_name: "event_staff",
                  target_id: before.id,
                  operation: "DELETE",
                  before: { ...before },
                  after: null,
                  actor_user_id: input.actorUserId,
                  reason: `X ID統合によるスタッフ重複解消: @${input.fromXId} → @${input.toXId}`,
                  context: "x-id-merge:event-staff",
                  retention_class: "restorable",
                  restore_strategy: "recreate_deleted",
                  strict: true,
                }];
              }
              if (sameSnapshot(before, after)) return [];
              return [{
                table_name: "event_staff",
                target_id: before.id,
                operation: "UPDATE",
                before: { ...before },
                after: { ...after },
                actor_user_id: input.actorUserId,
                reason: `X ID統合によるスタッフ更新: @${input.fromXId} → @${input.toXId}`,
                context: "x-id-merge:event-staff",
                retention_class: "restorable",
                restore_strategy: "update_before",
                strict: true,
              }];
            });
          }
          EOF

