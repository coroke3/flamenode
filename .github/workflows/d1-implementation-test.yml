name: D1 Implementation Test

on:
  push:
    branches:
      - agent/d1-max-read-reduction
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: d1-implementation-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove temporary workflow from validation worktree
        run: |
          rm -f .github/workflows/d1-implementation-test.yml
          git update-index --assume-unchanged .github/workflows/d1-implementation-test.yml || true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Worker tests
        run: |
          set +e
          npm run test:workers > /tmp/worker-tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "----- worker failure summary -----"
            grep -E "not ok|ERR_|AssertionError|Error:|fail|FAIL" /tmp/worker-tests.log | tail -n 120 || true
            echo "----- worker log tail -----"
            tail -n 160 /tmp/worker-tests.log
            exit "$status"
          fi
          tail -n 20 /tmp/worker-tests.log

      - name: Cloudflare CI tests
        run: npm run test:cloudflare-ci

      - name: Static rebuild tests
        run: npm run test:static-rebuild

      - name: Full verification suite
        run: npm run verify:full
