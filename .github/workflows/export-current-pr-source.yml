name: Export current PR source

on:
  push:
    branches:
      - agent/db-canonical-migration-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive integration sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/flamenode-integration-sources
          git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin \
            | sort > /tmp/flamenode-integration-sources/branches.txt
          refs=(
            main
            agent/db-canonical-migration-v2
            agent/db-canonical-events
            agent/db-canonical-foundation
            agent/db-canonical-x-identity
            agent/db-canonical-videos-import
            agent/chapter-comment-delete-and-validation
            agent/ux-and-status-simplification
            agent/unify-custom-questions
          )
          for ref in "${refs[@]}"; do
            if git show-ref --verify --quiet "refs/remotes/origin/${ref}"; then
              safe_name="${ref//\//__}"
              git archive --format=zip --output="/tmp/flamenode-integration-sources/${safe_name}.zip" "origin/${ref}"
            fi
          done
      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flamenode-all-integration-sources-${{ github.run_id }}
          path: /tmp/flamenode-integration-sources
          retention-days: 1
