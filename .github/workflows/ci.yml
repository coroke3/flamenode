name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Canonical runtime patchesを統合
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/db-canonical-migration-v2' && hashFiles('.agent-patch/part-*') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          touch .tmp/canonical-runtime-applied
          git config merge.conflictStyle diff3

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.patch" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/90" \
            -o /tmp/canonical-events.patch

          set +e
          git apply --3way --index /tmp/canonical-events.patch
          event_apply_status=$?
          set -e
          if [ "$event_apply_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf '%s\n' "${conflicts[@]}" > .tmp/canonical-event-conflicts.txt
            python - <<'PYRESOLVE'
          from pathlib import Path

          allowed = {
              'app/(auth)/dashboard/page.tsx',
              'src/lib/actions/event-staff-admin.ts',
              'src/lib/actions/slot.ts',
              'src/lib/api/publicDto.ts',
              'src/lib/auth/ownership.ts',
              'src/lib/event/eventOwnership.ts',
          }
          conflict_file = Path('.tmp/canonical-event-conflicts.txt')
          conflicts = {line.strip() for line in conflict_file.read_text().splitlines() if line.strip()}
          unexpected = conflicts - allowed
          if unexpected:
              raise SystemExit(f'Unexpected event merge conflicts: {sorted(unexpected)}')
          if not conflicts:
              raise SystemExit('event patch failed without conflict files')

          for file_name in conflicts:
              path = Path(file_name)
              lines = path.read_text().splitlines(True)
              output = []
              index = 0
              while index < len(lines):
                  if not lines[index].startswith('<<<<<<<'):
                      output.append(lines[index])
                      index += 1
                      continue
                  index += 1
                  ours = []
                  while index < len(lines) and not lines[index].startswith('|||||||') and not lines[index].startswith('======='):
                      ours.append(lines[index])
                      index += 1
                  if index < len(lines) and lines[index].startswith('|||||||'):
                      index += 1
                      while index < len(lines) and not lines[index].startswith('======='):
                          index += 1
                  if index >= len(lines) or not lines[index].startswith('======='):
                      raise SystemExit(f'Malformed conflict in {file_name}')
                  index += 1
                  while index < len(lines) and not lines[index].startswith('>>>>>>>'):
                      index += 1
                  if index >= len(lines):
                      raise SystemExit(f'Unclosed conflict in {file_name}')
                  index += 1
                  output.extend(ours)
              path.write_text(''.join(output))
          PYRESOLVE
            git add -- "${conflicts[@]}"
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo '未解決のイベント競合が残っています' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi

          git checkout HEAD -- .github/workflows/export-agent-source.yml
          cat .agent-patch/part-* | base64 -d | gzip -d > /tmp/canonical-videos-import.patch
          echo "08ec23c94c21c429615e0d525a9ce151e1522f91f37c48edf0719db6f88b2151  /tmp/canonical-videos-import.patch" | sha256sum -c -
          git apply --3way --index /tmp/canonical-videos-import.patch

          if git diff --cached --name-only | grep -Eq '^(migrations/|src/lib/db/schema(\.canonical)?\.ts$)'; then
            echo '担当外のDBスキーマまたはマイグレーション変更を検出しました' >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 実行環境を表示
        run: |
          node --version
          npm --version

      - name: 依存関係をインストール
        run: npm ci --no-audit --no-fund

      - name: 依存関係ツリーを検証
        run: npm ls --depth=0

      - name: lockfileが変更されていないことを検証
        run: git diff --exit-code -- package-lock.json

      - name: 型検査
        shell: bash
        run: |
          mkdir -p .tmp
          set -o pipefail
          npm run typecheck 2>&1 | tee .tmp/typecheck.log

      - name: 型検査ログを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics-${{ github.run_id }}
          path: .tmp/typecheck.log
          if-no-files-found: warn
          retention-days: 3

      - name: Lint
        run: npm run lint

      - name: Unitテスト
        shell: bash
        run: |
          mkdir -p .tmp
          set -o pipefail
          npm run test:unit 2>&1 | tee .tmp/unit-tests.log

      - name: Unitテストログを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics-${{ github.run_id }}
          path: .tmp/unit-tests.log
          if-no-files-found: warn
          retention-days: 3

      - name: Workerテスト
        run: npm run test:workers

      - name: Cloudflare CI契約テスト
        run: npm run test:cloudflare-ci

      - name: 統合テスト
        shell: bash
        run: |
          mkdir -p .tmp
          set -o pipefail
          npm run test:integration 2>&1 | tee .tmp/integration-tests.log

      - name: 統合テストログを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-diagnostics-${{ github.run_id }}
          path: .tmp/integration-tests.log
          if-no-files-found: warn
          retention-days: 3

      - name: Next.js本番ビルド
        run: npm run build

      - name: Cloudflare Pagesビルド
        shell: bash
        run: |
          mkdir -p .tmp
          set -o pipefail
          npm run pages:build 2>&1 | tee .tmp/pages-build.log

      - name: Pagesビルドログを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-build-diagnostics-${{ github.run_id }}
          path: .tmp/pages-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Pages成果物を検査
        run: npm run check:pages-output

      - name: Cloudflareテンプレートを検査
        run: npm run check:cloudflare-template

      - name: Cloudflare fixture設定を検査
        run: npm run check:cloudflare-config
        env:
          CLOUDFLARE_CONFIG_MODE: fixture

      - name: owner検査用DBを準備
        run: node scripts/create-owner-check-fixture.mjs

      - name: DBとowner不変条件を検査
        env:
          FLAMENODE_OWNER_CHECK_DB: .tmp/owner-check.sqlite
        run: |
          npm run check:db-schema
          npm run check:db-migration
          npm run check:db-legacy
          npm run check:event-owners

      - name: D1空DBマイグレーションを検査
        run: npm run check:db-d1-empty

      - name: D1旧DBマイグレーションを検査
        run: npm run check:db-d1-legacy

      - name: UI受入契約を検査
        run: npm run check:ui-acceptance

      - name: 公開API DTO契約を検査
        run: npm run check:public-api-contract

      - name: 公開API漏えいを静的検査
        run: npm run check:public-api-leaks

      - name: プロジェクト文書を検査
        shell: bash
        run: |
          mkdir -p .tmp
          set -o pipefail
          npm run check:project-docs 2>&1 | tee .tmp/project-docs.log

      - name: 文書検査ログを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-docs-diagnostics-${{ github.run_id }}
          path: .tmp/project-docs.log
          if-no-files-found: warn
          retention-days: 3

      - name: Active文書とDB履歴を検査
        run: |
          npm run check:docs
          npm run check:db-history

      - name: Canonical runtime統合失敗時の作業ツリーを保存
        if: failure() && hashFiles('.tmp/canonical-runtime-applied') != ''
        uses: actions/upload-artifact@v4
        with:
          name: canonical-runtime-integration-${{ github.run_id }}
          path: |
            .
            /tmp/canonical-events.patch
            /tmp/canonical-videos-import.patch
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 1

      - name: 検証済みCanonical runtimeを統合ブランチへ反映
        if: success() && hashFiles('.tmp/canonical-runtime-applied') != ''
        shell: bash
        run: |
          set -euo pipefail
          previous_ci_commit="$(git log --format=%H -- .github/workflows/ci.yml | sed -n '2p')"
          if [ -z "$previous_ci_commit" ]; then
            echo '復元対象のCI workflowを特定できません' >&2
            exit 1
          fi
          git show "$previous_ci_commit:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm -rf .agent-patch .agent-trigger
          rm -f .github/workflows/apply-canonical-videos-import.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "イベント・作品・監査・旧形式インポートを新正本へ統合"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  report-main:
    if: always() && github.event_name == 'push' && github.actor != 'github-actions[bot]'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 現在のmainだけ結果を記録
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_sha="$(git rev-parse origin/main)"
          if [ "$current_sha" != "$CANDIDATE_SHA" ]; then
            echo "mainが$current_shaへ更新済みのため、$CANDIDATE_SHAの結果は記録しません。"
            exit 0
          fi
          git reset --hard origin/main
          if [ "$VERIFY_RESULT" = "success" ]; then
            verdict="PASS"
          else
            verdict="FAIL"
          fi
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > docs/operations/last-main-ci.md <<EOF
          # 最新mainのCI結果

          > Status: Active
          > Result: ${verdict}
          > Verify job: ${VERIFY_RESULT}
          > Candidate commit: ${CANDIDATE_SHA}
          > Completed at: ${completed_at}
          > Workflow run: ${RUN_URL}

          この結果は、workflow完了時点でもCandidate commitがmain HEADだった場合だけ記録されます。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/last-main-ci.md
          git commit -m "CI: mainの検証結果を記録 ${CANDIDATE_SHA:0:7} (${verdict})"
          git push origin HEAD:main
