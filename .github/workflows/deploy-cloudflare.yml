name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      deploy_workers:
        description: Workersをデプロイする
        type: boolean
        default: true

      deploy_pages:
        description: Pagesをデプロイする
        type: boolean
        default: true

      bootstrap_database:
        description: 空の本番D1を初期構築する
        type: boolean
        default: false

      apply_pending_migrations:
        description: 未適用migrationを本番D1へ適用する
        type: boolean
        default: false

  push:
    branches: [main]

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  release-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: production-candidate-placeholder
      AUTH_DISCORD_ID: production-candidate-placeholder
      AUTH_DISCORD_SECRET: production-candidate-placeholder
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify dependency tree and lockfile
        run: |
          npm ls --depth=0
          git diff --exit-code -- package-lock.json

      - name: Verify application and workers
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run test:workers
          npm run test:cloudflare-ci
          npm run test:integration
          npm run build
          npm run pages:build
          npm run check:pages-output
          npm run check:cloudflare-template
          npm run check:ui-acceptance
          npm run check:project-docs
          npm run check:docs
          npm run check:db-history

      - name: Verify fixture database contracts
        env:
          CLOUDFLARE_CONFIG_MODE: fixture
          FLAMENODE_OWNER_CHECK_DB: .tmp/owner-check.sqlite
        run: |
          npm run check:cloudflare-config
          node scripts/create-owner-check-fixture.mjs
          npm run check:db-schema
          npm run check:db-legacy
          npm run check:event-owners

  validate-inputs:
    needs: release-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate required production configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "$CF_IDS_JSON" ] || missing+=("CF_IDS_JSON")
          [ -n "$NEXT_PUBLIC_SITE_URL" ] || missing+=("NEXT_PUBLIC_SITE_URL")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing production configuration: %s\n' "${missing[*]}"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ "${{ inputs.bootstrap_database }}" = "true" ] &&
             [ "${{ inputs.apply_pending_migrations }}" = "true" ]; then
            echo "::error::bootstrap_database and apply_pending_migrations cannot both be true."
            exit 1
          fi

  build-pages-artifact:
    needs: [release-gate, validate-inputs]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      CLOUDFLARE_CONFIG_MODE: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Cloudflare resource IDs
        run: |
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config

      - name: Build production Pages artifact
        run: npm run pages:build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: FlameNode
          AUTH_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_DISCORD_ID: ${{ secrets.AUTH_DISCORD_ID }}
          AUTH_DISCORD_SECRET: ${{ secrets.AUTH_DISCORD_SECRET }}
          CI: "1"

      - name: Validate Pages artifact and templates
        run: |
          npm run check:pages-output
          npm run check:cloudflare-template

      - name: Upload immutable Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ github.sha }}
          path: .vercel/output/static
          if-no-files-found: error
          retention-days: 1

  bootstrap-d1:
    needs: [release-gate, validate-inputs, build-pages-artifact]
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_database
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      CLOUDFLARE_CONFIG_MODE: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and apply IDs
        run: |
          npm ci --no-audit --no-fund
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config
      - name: Verify production D1 is empty
        run: node scripts/check-d1-bootstrap-state.mjs --remote --expect-empty
      - name: Bootstrap production D1
        run: npx wrangler d1 migrations apply flamenode_db --remote

  migrate-d1:
    needs: [release-gate, validate-inputs, build-pages-artifact]
    if: github.event_name == 'workflow_dispatch' && inputs.apply_pending_migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      CLOUDFLARE_CONFIG_MODE: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and apply IDs
        run: |
          npm ci --no-audit --no-fund
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config
      - name: Verify baseline marker
        run: node scripts/check-d1-bootstrap-state.mjs --remote --expect-initialized
      - name: Apply pending migrations
        run: npx wrangler d1 migrations apply flamenode_db --remote

  deploy-pages:
    needs: [release-gate, validate-inputs, build-pages-artifact, bootstrap-d1, migrate-d1]
    if: >-
      always() &&
      needs.release-gate.result == 'success' &&
      needs.validate-inputs.result == 'success' &&
      needs.build-pages-artifact.result == 'success' &&
      (needs.bootstrap-d1.result == 'success' || needs.bootstrap-d1.result == 'skipped') &&
      (needs.migrate-d1.result == 'success' || needs.migrate-d1.result == 'skipped') &&
      (github.event_name == 'push' || inputs.deploy_pages)
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      CLOUDFLARE_CONFIG_MODE: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Wrangler and apply IDs
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config
      - uses: actions/download-artifact@v4
        with:
          name: pages-${{ github.sha }}
          path: .vercel/output/static
      - name: Deploy the verified Pages artifact
        run: >-
          npm run pages:deploy:verified --
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-message="Verified production deployment ${GITHUB_SHA}"
          --commit-dirty=false

  deploy-workers:
    needs: [release-gate, validate-inputs, build-pages-artifact, bootstrap-d1, migrate-d1, deploy-pages]
    if: >-
      always() &&
      needs.release-gate.result == 'success' &&
      needs.validate-inputs.result == 'success' &&
      needs.build-pages-artifact.result == 'success' &&
      (needs.bootstrap-d1.result == 'success' || needs.bootstrap-d1.result == 'skipped') &&
      (needs.migrate-d1.result == 'success' || needs.migrate-d1.result == 'skipped') &&
      needs.deploy-pages.result == 'success' &&
      (github.event_name == 'push' || inputs.deploy_workers)
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
      CLOUDFLARE_CONFIG_MODE: production
      BUILD_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and apply IDs
        run: |
          npm ci --no-audit --no-fund
          node scripts/sync-wrangler-ids.mjs
          npm run check:cloudflare-config
          npm run check:cloudflare-template
      - name: Deploy the three Cron Workers in fixed order
        run: npm run workers:deploy:verified

  smoke-production:
    needs: [release-gate, deploy-pages, deploy-workers]
    if: >-
      always() &&
      needs.release-gate.result == 'success' &&
      needs.deploy-pages.result == 'success' &&
      needs.deploy-workers.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Smoke test deployed resources
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          FAST_JOBS_URL: ${{ vars.FAST_JOBS_URL }}
          CONTENT_JOBS_URL: ${{ vars.CONTENT_JOBS_URL }}
          SYNC_JOBS_URL: ${{ vars.SYNC_JOBS_URL }}
          BUILD_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/smoke-cloudflare.mjs
