name: Export PR100 source

on:
  push:
    branches:
      - agent/x-identity-import-hardening
  pull_request:
    branches:
      - agent/db-canonical-migration-v2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: pr100-source-${{ github.run_id }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 1
