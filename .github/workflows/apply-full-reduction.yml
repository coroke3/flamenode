name: Apply Full Reduction

on:
  push:
    branches:
      - agent/full-reduction-32da-20260714

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-reduction-32da-20260714
          fetch-depth: 0

      - name: Apply reviewed reduction
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/reduction-mod.part-* | base64 -d | xz -dc > /tmp/reduction.patch
          git apply --index --whitespace=error-all /tmp/reduction.patch
          git rm -r "設計/参考資料/参考旧ページ"
          git rm workers/json-generator/index.ts
          git rm .github/patches/reduction-mod.part-*
          git rm .github/workflows/apply-full-reduction.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "挙動を維持して全体を再最適化し不要コードを削減"
          git push origin HEAD:agent/full-reduction-32da-20260714
