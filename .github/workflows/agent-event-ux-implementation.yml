name: Apply event UX implementation

on:
  push:
    branches:
      - feature/event-ux-slot-limits-stability-20260821
    paths:
      - scripts/agent-event-ux-implementation.mjs.gz.b64
      - .github/workflows/agent-event-ux-implementation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/event-ux-slot-limits-stability-20260821
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          base64 -d scripts/agent-event-ux-implementation.mjs.gz.b64 | gzip -d > /tmp/agent-event-ux-implementation.mjs
          node --check /tmp/agent-event-ux-implementation.mjs
          node /tmp/agent-event-ux-implementation.mjs

      - name: Commit implementation
        shell: bash
        run: |
          rm -f scripts/agent-event-ux-implementation.mjs.gz.b64 .github/workflows/agent-event-ux-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/'(public)'/event/'[id]'/slots/page.tsx \
            docs/operations/static-delivery.md \
            migrations/0059_event_slot_reservation_limits.sql \
            src/components/admin/EventForm.tsx \
            src/components/admin/EventSettingsPreview.tsx \
            src/components/admin/EventStaffManager.tsx \
            src/components/admin/YoutubeDescriptionTemplateEditor.tsx \
            src/components/admin/eventUxEnhancements.contract.test.mjs \
            src/components/event/SlotGrid.tsx \
            src/components/forms/YoutubeDescriptionPreview.tsx \
            src/lib/actions/event-admin.ts \
            src/lib/actions/slot.ts \
            src/lib/actions/slotReservationLimit.contract.test.mjs \
            src/lib/admin/eventTemplateSettings.ts \
            src/lib/db/schema.canonical.ts \
            src/lib/event/eventForm.ts \
            src/lib/event/eventPayload.ts \
            src/lib/publicData/publicJsonCacheTtl.ts \
            src/lib/publicData/topSlotStatsTtl.contract.test.mjs \
            src/lib/slots/slotGuidance.ts \
            src/lib/slots/slotReservationLimit.ts \
            src/lib/slots/slotReservationLimit.test.mjs \
            workers/shared/staticR2CacheControl.ts \
            scripts/agent-event-ux-implementation.mjs.gz.b64 \
            .github/workflows/agent-event-ux-implementation.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "イベント設定UXと枠上限を強化"
          git push origin HEAD:feature/event-ux-slot-limits-stability-20260821
