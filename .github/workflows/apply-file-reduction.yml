name: 共通化差分を適用

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/agent/apply-file-reduction.trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/maximize-file-reduction'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: agent/maximize-file-reduction

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 最新mainへ差分を適用
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent/file-reduction.patch.gz.b64.small-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/file-reduction.patch
          git fetch --force --depth=1 origin main:refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
          git apply --index /tmp/file-reduction.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "挙動を維持したまま共通化してファイル数を削減"

      - name: 依存関係を取得
        run: npm ci --no-audit --no-fund

      - name: 正式CI検証スクリプトを準備
        shell: bash
        run: |
          cat > /tmp/validate-flamenode.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          npm ls --depth=0
          git diff --exit-code -- package-lock.json
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run test:workers
          npm run test:cloudflare-ci
          npm run test:integration
          npm run build
          npm run pages:build
          npm run check:pages-output
          npm run check:cloudflare-template
          CLOUDFLARE_CONFIG_MODE=fixture npm run check:cloudflare-config
          mkdir -p .tmp
          rm -f .tmp/owner-check.sqlite
          node scripts/create-owner-check-fixture.mjs
          FLAMENODE_OWNER_CHECK_DB=.tmp/owner-check.sqlite npm run check:db-schema
          FLAMENODE_OWNER_CHECK_DB=.tmp/owner-check.sqlite npm run check:db-legacy
          FLAMENODE_OWNER_CHECK_DB=.tmp/owner-check.sqlite npm run check:event-owners
          npm run check:ui-acceptance
          npm run check:public-api-leaks
          npm run check:project-docs
          npm run check:docs
          npm run check:db-history
          EOF
          chmod +x /tmp/validate-flamenode.sh

      - name: 正式CI相当の全検証
        shell: bash
        run: |
          set -o pipefail
          /tmp/validate-flamenode.sh 2>&1 | tee /tmp/validation.log

      - name: 検証ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-reduction-validation-log
          path: /tmp/validation.log
          retention-days: 1

      - name: 最終コミット直前に最新mainへ追従
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            current_base="$(git rev-parse HEAD^)"
            git fetch --force --depth=1 origin main:refs/remotes/origin/main
            latest_main="$(git rev-parse refs/remotes/origin/main)"
            if [ "$current_base" = "$latest_main" ]; then
              break
            fi

            echo "mainが${current_base}から${latest_main}へ更新されたため再適用・再検証します。"
            git diff --binary HEAD^ HEAD > /tmp/current-refactor.patch
            git reset --hard "$latest_main"
            git apply --3way --index /tmp/current-refactor.patch
            git commit -m "挙動を維持したまま共通化してファイル数を削減"
            set -o pipefail
            /tmp/validate-flamenode.sh 2>&1 | tee -a /tmp/validation.log
            set +o pipefail
          done

          git fetch --force --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse refs/remotes/origin/main)"

      - name: 検証済みコミットを反映
        shell: bash
        run: git push --force origin HEAD:agent/maximize-file-reduction
