name: D1 Implementation Test

on:
  push:
    branches:
      - agent/d1-max-read-reduction
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: d1-implementation-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove temporary workflow from validation worktree
        run: |
          rm -f .github/workflows/d1-implementation-test.yml
          git update-index --assume-unchanged .github/workflows/d1-implementation-test.yml || true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Worker json-generator diagnostic
        continue-on-error: true
        run: node --test --experimental-strip-types workers/json-generator/*.test.mjs

      - name: Worker shared diagnostic
        continue-on-error: true
        run: |
          files=$(find workers/shared -type f -name '*.test.mjs' -print)
          if [ -n "$files" ]; then node --test --experimental-strip-types $files; fi

      - name: Worker fast-jobs diagnostic
        continue-on-error: true
        run: |
          files=$(find workers/fast-jobs -type f -name '*.test.mjs' -print 2>/dev/null || true)
          if [ -n "$files" ]; then node --test --experimental-strip-types $files; fi

      - name: Worker sync-jobs diagnostic
        continue-on-error: true
        run: |
          files=$(find workers/sync-jobs -type f -name '*.test.mjs' -print 2>/dev/null || true)
          if [ -n "$files" ]; then node --test --experimental-strip-types $files; fi

      - name: Worker youtube-playlist-sync diagnostic
        continue-on-error: true
        run: |
          files=$(find workers/youtube-playlist-sync -type f -name '*.test.mjs' -print 2>/dev/null || true)
          if [ -n "$files" ]; then node --test --experimental-strip-types $files; fi

      - name: Other worker tests diagnostic
        continue-on-error: true
        run: |
          files=$(find workers -type f -name '*.test.mjs' \
            ! -path 'workers/json-generator/*' \
            ! -path 'workers/shared/*' \
            ! -path 'workers/fast-jobs/*' \
            ! -path 'workers/sync-jobs/*' \
            ! -path 'workers/youtube-playlist-sync/*' -print)
          if [ -n "$files" ]; then node --test --experimental-strip-types $files; fi

      - name: Worker tests
        run: npm run test:workers

      - name: Cloudflare CI tests
        run: npm run test:cloudflare-ci

      - name: Static rebuild tests
        run: npm run test:static-rebuild

      - name: Full verification suite
        run: npm run verify:full
