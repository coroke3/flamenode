name: Integrate remaining worktrees

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: integrate-remaining-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/db-canonical-migration-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 枠なし投稿専用差分を取得
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/unslotted-event-affiliation agent/chapter-comment-delete-and-validation
          git checkout origin/agent/unslotted-event-affiliation -- \
            'app/(auth)/entry/unslotted/page.tsx' \
            'src/components/forms/UnslottedPostForm.tsx' \
            'src/lib/actions/video/createFreeVideo.ts' \
            'src/lib/event/unslottedPostPolicy.ts' \
            'src/lib/event/unslottedPostPolicy.test.mjs' \
            'src/lib/video/resolveUnslottedEventSyncTarget.ts'

          git checkout origin/agent/chapter-comment-delete-and-validation -- \
            'app/api/event-endpoints/[id]/route.ts' \
            'src/components/admin/EventExportLinkBuilder.tsx' \
            'src/lib/api/eventExportCache.ts' \
            'src/lib/api/eventExportData.ts' \
            'src/lib/api/eventExportPayload.ts' \
            'src/lib/eventExportPayload.test.mjs'
          git diff --cached --check

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration

      - name: 検証済み差分を反映
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/integrate-unslotted-worktree.yml
          git add -A
          git diff --cached --check
          git commit -m "枠なし投稿とイベント公開APIを新正本へ統合"
          git push --force-with-lease origin HEAD:agent/db-canonical-migration-v2

      - name: 失敗時ログ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-worktrees-${{ github.run_id }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
          include-hidden-files: true
          retention-days: 3
