name = "flamenode-sync-jobs"
main = "index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# 再生リストのイベント別間隔判定はD1で行う。既存metadata/scoreは12時間gateを維持。
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "flamenode_db"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

[vars]
# Secrets:
# - YOUTUBE_API_KEY
# - YOUTUBE_OAUTH_CLIENT_ID
# - YOUTUBE_OAUTH_CLIENT_SECRET
# - YOUTUBE_OAUTH_REFRESH_TOKEN
# Optional var: YOUTUBE_PLAYLIST_DAILY_QUOTA_UNITS (default 4500, max 8000)
