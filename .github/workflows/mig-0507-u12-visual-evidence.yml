name: MIG-0507 U12 exact-head visual evidence (PR 448 only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/mig-0507-u12-visual-evidence.yml
permissions:
  contents: read
jobs:
  capture-u12:
    if: github.event.pull_request.number == 448
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAPTURE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        run: test "$(git rev-parse HEAD)" = "$CAPTURE_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Build fixture site and verify capture contract
        run: |
          npm run build --workspace=@flamenode/contracts
          npm run build --workspace=@flamenode/domain
          npm run build --workspace=@flamenode/ui
          npm run build --workspace=@flamenode/site
          node --test scripts/fixtures/videoScreenshotCapture.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --global playwright@1.56.1 --no-audit --no-fund
          playwright install --with-deps chromium
      - name: Capture both local fixture states and approved mock references
        run: |
          set -eu
          root="$RUNNER_TEMP/mig0507-u12"
          mkdir -p "$root/member-present" "$root/no-youtube"
          python3 -m http.server 4329 --bind 127.0.0.1 --directory apps/site/dist > "$RUNNER_TEMP/u12-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4329/dKw1xV41f8s/ -o /dev/null
          node scripts/fixtures/videoScreenshotCapture.mjs http://127.0.0.1:4329 dKw1xV41f8s "$root/member-present"
          node scripts/fixtures/videoScreenshotCapture.mjs http://127.0.0.1:4329 vid-bbb "$root/no-youtube" --no-youtube
          cp docs/migration/mock/screenshots/VideoDetail.mobile.jpg "$root/approved.mobile.jpg"
          cp docs/migration/mock/screenshots/VideoDetail.desktop.jpg "$root/approved.desktop.jpg"
          printf '%s\n' "$CAPTURE_HEAD" > "$root/head.txt"
          test "$(find "$root/member-present" "$root/no-youtube" -type f -name '*.png' | wc -l)" -eq 4
      - name: Upload complete fixture evidence (not approval)
        uses: actions/upload-artifact@v4
        with:
          name: mig-0507-u12-exact-head-evidence
          path: ${{ runner.temp }}/mig0507-u12
          if-no-files-found: error
          retention-days: 7
