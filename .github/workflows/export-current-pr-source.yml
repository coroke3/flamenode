name: Export current PR source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive current source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=/tmp/flamenode-pr-source.zip HEAD
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: flamenode-pr-source-${{ github.run_id }}
          path: /tmp/flamenode-pr-source.zip
          retention-days: 1
