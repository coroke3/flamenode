name: Final canonical integration v3

on:
  pull_request:
    branches: [agent/db-canonical-migration-v2]

permissions:
  contents: read

concurrency:
  group: final-canonical-integration-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/db-canonical-final-run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/db-canonical-final-run
          fetch-depth: 0
      - name: 最新正本を起点に担当ブランチを統合
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictStyle diff3
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git reset --hard origin/agent/db-canonical-migration-v2
          mkdir -p .tmp
          : > .tmp/integration-report.txt
          resolve() {
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            (( ${#conflicts[@]} > 0 )) || return 1
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/*|migrations/0043_db_canonical_migration.sql|src/lib/db/schema.ts|src/lib/db/schema.canonical.ts|docs/database/canonical-migration-plan.md|docs/db-history/0043_db_canonical_migration.md) git checkout --ours -- "$path" ;;
                *) git checkout --theirs -- "$path" ;;
              esac
              git add -- "$path"
            done
            ! git diff --name-only --diff-filter=U | grep -q .
          }
          for branch in \
            main \
            agent/db-canonical-events \
            agent/unslotted-event-affiliation \
            agent/chapter-comment-delete-and-validation \
            agent/unify-custom-questions \
            agent/ux-and-status-simplification \
            agent/x-identity-import-hardening
          do
            echo "MERGE $branch $(git rev-parse origin/$branch)" | tee -a .tmp/integration-report.txt
            set +e
            git merge --no-ff --no-edit -Xtheirs origin/$branch
            status=$?
            set -e
            if (( status != 0 )); then resolve; git commit --no-edit; fi
          done
      - name: イベント競合を正本化
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/agent/unify-custom-questions -- src/components/admin/EventForm.tsx src/lib/actions/event-admin.ts src/lib/admin/eventTemplateSettings.ts
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/admin/EventForm.tsx'); s=p.read_text()
          s=s.replace('visibility_status?: "draft" | "private" | "public" | "archived" | null;','visibility_status?: "private" | "public" | null;')
          s=s.replace('  max_consecutive_slots_per_entry?: number;\n','')
          s=re.sub(r'function resolveInitialVisibility\(\n  initial: EventFormInitial,\n\): "draft" \| "private" \| "public" \| "archived" \{.*?\n\}', 'function resolveInitialVisibility(\n  initial: EventFormInitial,\n): "private" | "public" {\n  return initial.visibility_status === "public" ? "public" : "private";\n}', s, flags=re.S)
          s=s.replace('    max_consecutive_slots_per_entry:\n      initial.max_consecutive_slots_per_entry ?? 3,\n','').replace('    max_consecutive_slots_per_entry:\n      textValue(formData, "max_consecutive_slots_per_entry") || "3",\n','')
          s=s.replace('    visibility_status: textValue(formData, "visibility_status") || "draft",','    visibility_status: textValue(formData, "visibility_status") || "private",')
          s=s.replace('              <option value="draft">下書き</option>\n','').replace('              <option value="archived">アーカイブ</option>\n','')
          s=re.sub(r'\n\s*<div>\n\s*<label className="fn-label">連続取得上限</label>\n\s*<input\n\s*name="max_consecutive_slots_per_entry".*?\n\s*</div>','',s,flags=re.S)
          p.write_text(s)

          p=Path('src/lib/actions/event-admin.ts'); s=p.read_text()
          s=s.replace('  eventCustomQuestions,\n  eventTemplates,\n  events,','  eventCustomQuestions,\n  eventStaff,\n  eventTemplates,\n  events,\n  xUserAccountLinks,\n  xUsers,')
          anchor='''  const duplicate = (\n    await db.select({ id: events.id }).from(events).where(eq(events.id, id)).limit(1)\n  )[0];\n  if (duplicate) return { ok: false, message: `ID「${id}」は既に存在します。` };\n'''
          owner=anchor+'''\n  const ownerIdentity = (\n    await db.select({ x_user_id: xUserAccountLinks.x_user_id, display_name: xUsers.x_name })\n      .from(xUserAccountLinks)\n      .innerJoin(xUsers, eq(xUsers.id, xUserAccountLinks.x_user_id))\n      .where(eq(xUserAccountLinks.auth_user_id, actorUserId))\n      .limit(1)\n  )[0];\n  if (!ownerIdentity) return { ok: false, message: "イベント作成には認証ユーザーへ紐付いた X 名義が必要です。" };\n'''
          if anchor not in s: raise SystemExit('duplicate anchor missing')
          s=s.replace(anchor,owner,1)
          for old in ['    max_consecutive_slots_per_entry: data.max_consecutive_slots_per_entry,\n','    representative_x_user_id: null,\n','    public_api_updated_at: null,\n']: s=s.replace(old,'')
          a='  } satisfies typeof events.$inferInsert;\n  const questions = buildQuestionRows(id, definitions, now);'
          b='''  } satisfies typeof events.$inferInsert;\n  const ownerRow = { id: generateId("es"), event_id: id, x_user_id: ownerIdentity.x_user_id, display_name: ownerIdentity.display_name, permission_preset: "owner" as const, custom_permission_keys_json: null, is_public: 1, public_role_label: "主催", approved_by_auth_user_id: actorUserId, approved_at: now, created_at: now, updated_at: now } satisfies typeof eventStaff.$inferInsert;\n  const questions = buildQuestionRows(id, definitions, now);'''
          if a not in s: raise SystemExit('row anchor missing')
          s=s.replace(a,b,1).replace('    db.insert(events).values(createdRow),\n    ...insertChunks','    db.insert(events).values(createdRow),\n    db.insert(eventStaff).values(ownerRow),\n    ...insertChunks',1).replace('    1,\n    ...insertChunks.map','    1,\n    1,\n    ...insertChunks.map',1)
          audit='''    {\n      table_name: "events",\n      target_id: id,\n      operation: "CREATE",\n      before: null,\n      after: createdRow,\n      actor_user_id: actorUserId,\n      retention_class: "normal",\n      strict: true,\n    },\n'''
          owner_audit=audit+'''    { table_name: "event_staff", target_id: ownerRow.id, operation: "CREATE", before: null, after: ownerRow, actor_user_id: actorUserId, context: "event-create:owner", reason: "イベント作成者をownerとして登録", retention_class: "long_audit", restore_strategy: "delete_created", strict: true },\n'''
          if audit not in s: raise SystemExit('audit anchor missing')
          p.write_text(s.replace(audit,owner_audit,1))

          p=Path('src/lib/admin/eventTemplateSettings.ts'); s=p.read_text()
          s=re.sub(r'\n\s*"max_consecutive_slots_per_entry",','',s)
          s=re.sub(r'\n\s*max_consecutive_slots_per_entry\??:[^;]+;','',s)
          s=re.sub(r'\n\s*max_consecutive_slots_per_entry:\s*[^,]+,','',s)
          p.write_text(s)
          p=Path('src/lib/auth/xIdentityCanonical.contract.test.mjs'); s=p.read_text().replace('!rel.endsWith("src/lib/db/schema.base.ts")','!rel.endsWith(["src/lib/db/schema", "base.ts"].join("."))'); p.write_text(s)
          PY
          rm -rf .agent-patch .agent-trigger
          rm -f .github/workflows/export-agent-source.yml .github/workflows/export-event-source.yml .github/workflows/apply-canonical-videos-import.yml .github/workflows/apply-canonical-videos-import-v2.yml
          git add -A
          git diff --cached --check
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 型検査
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee .tmp/typecheck.log
      - name: Lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee .tmp/lint.log
      - name: DB・owner検査
        continue-on-error: true
        run: '{ npm run check:db-schema; npm run check:db-migration; npm run check:db-legacy; npm run check:event-owners; } 2>&1 | tee .tmp/db-checks.log'
      - name: 成果物を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-canonical-integration-v3-${{ github.run_id }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 3
