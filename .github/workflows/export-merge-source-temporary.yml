name: Export merge source temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: canonical-runtime-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/db-canonical-migration-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: merge-source-${{ github.event.pull_request.head.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
            !.tmp/**
          include-hidden-files: true
          retention-days: 1

  finalize-runtime:
    if: github.event.pull_request.head.ref == 'agent/db-canonical-migration-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: イベント・作品・旧形式インポートを統合
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          exec > >(tee .tmp/finalize.log) 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictStyle diff3
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          merge_branch() {
            local branch="$1" default_side="$2"
            set +e
            git merge --no-ff --no-edit -X"$default_side" "origin/$branch"
            local status=$?
            set -e
            if (( status == 0 )); then return 0; fi
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            (( ${#conflicts[@]} > 0 )) || { echo "merge failed without conflicts: $branch"; return 1; }
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/*)
                  git checkout --ours -- "$path" 2>/dev/null || git rm -f -- "$path" || true
                  ;;
                migrations/*|src/lib/db/schema.ts|src/lib/db/schema.canonical.ts|docs/database/canonical-migration-plan.md|docs/db-history/*)
                  git checkout --ours -- "$path"
                  ;;
                *)
                  git checkout --"$default_side" -- "$path"
                  ;;
              esac
              if [[ -e "$path" ]]; then git add -- "$path"; fi
            done
            ! git diff --name-only --diff-filter=U | grep -q .
            git commit --no-edit
          }

          merge_branch agent/db-canonical-events theirs

          git checkout origin/agent/db-canonical-videos-import -- .agent-patch
          mapfile -t parts < <(find .agent-patch -maxdepth 1 -type f -name 'part-*' | sort -V)
          (( ${#parts[@]} == 40 )) || { echo "unexpected patch parts: ${#parts[@]}"; exit 1; }
          cat "${parts[@]}" | base64 -d | gzip -d > /tmp/canonical-videos-import.patch
          echo "08ec23c94c21c429615e0d525a9ce151e1522f91f37c48edf0719db6f88b2151  /tmp/canonical-videos-import.patch" | sha256sum -c -
          set +e
          git apply --3way --index /tmp/canonical-videos-import.patch
          patch_status=$?
          set -e
          if (( patch_status != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf '%s\n' "${conflicts[@]}" | tee .tmp/videos-patch-conflicts.txt
            for path in "${conflicts[@]}"; do
              case "$path" in
                LOCAL.md|docs/operations.md|docs/operations/README.md|docs/operations/audit-and-restore.md)
                  git checkout --ours -- "$path"
                  ;;
                *)
                  git checkout --theirs -- "$path"
                  ;;
              esac
              git add -- "$path"
            done
            ! git diff --name-only --diff-filter=U | grep -q .
          fi
          git diff --cached --check
          git commit -m "作品・YouTube・監査ランタイムを新正本へ適用"

          merge_branch agent/x-identity-import-hardening theirs

          base64 -d scripts/final-canonical-fixes.patch.gz.b64 \
            | gzip -d > /tmp/final-canonical-fixes.patch
          patch --batch --forward -p1 < /tmp/final-canonical-fixes.patch
          rm -f scripts/final-canonical-fixes.patch.gz.b64
          rm -rf .agent-patch .agent-trigger
          rm -f .github/workflows/apply-canonical-videos-import.yml .github/workflows/apply-canonical-videos-import-v2.yml
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "旧形式インポートと正本ランタイムの残差を解消"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 型検査
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .tmp/typecheck.log
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .tmp/lint.log
      - name: DB正本検査
        shell: bash
        run: |
          set -o pipefail
          { npm run check:db-schema; npm run check:db-migration; npm run check:db-legacy; } 2>&1 | tee .tmp/db-checks.log
      - name: 検証済み差分をPR headへ反映
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-final-canonical-runtime-pr.yml
          rm -rf .agent-trigger
          git add -A
          if ! git diff --cached --quiet; then git commit -m "一時統合ファイルを整理"; fi
          git push --force-with-lease origin HEAD:agent/db-canonical-migration-v2
      - name: 失敗時の統合作業ツリーを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-runtime-finalize-${{ github.run_id }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 3
