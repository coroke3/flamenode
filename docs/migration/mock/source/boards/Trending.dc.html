<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>急上昇</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#000}</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja">
  <dc-import name="PublicHeader" active="list" hint-size="100%,72px"></dc-import>

  <div class="wrap" style="padding-top: 56px; max-width: 1120px;">
    <div class="wrap-row" style="justify-content: space-between; align-items: flex-end; gap: 16px;">
      <h1 class="t-display">急上昇</h1>
      <span class="t-sm muted">直近7日間 · 10.04 更新</span>
    </div>

    <ol aria-label="急上昇ランキング" style="list-style: none; margin: 40px 0 0; padding: 0;">
      <sc-for list="{{items}}" as="v" hint-placeholder-count="10">
        <li>
          <a href="VideoDetail.dc.html" class="tr-row">
            <span class="tr-rank t-num" style="color: {{v.rankColor}};">{{v.rankStr}}</span>
            <img class="tr-thumb" src="{{v.thumb}}" alt="">
            <span class="stack" style="gap: 6px; min-width: 0;">
              <span class="tr-title">{{v.title}}</span>
              <span class="meta-i t-sm">
                <span><img class="avatar" src="{{v.icon}}" alt="" style="width: 18px; height: 18px;">{{v.creator}}</span>
                <span><img class="ev-icon" src="{{v.evIcon}}" alt="" style="width: 18px; height: 18px;">{{v.event}}</span>
              </span>
            </span>
            <span class="tr-spark" aria-label="直近7日の再生数の推移">
              <sc-for list="{{v.bars}}" as="b" hint-placeholder-count="7"><i style="height: {{b.h}};"></i></sc-for>
            </span>
            <span class="stack" style="gap: 2px; align-items: flex-end; min-width: 96px;">
              <span class="t-num" style="font-size: 18px; line-height: 24px;">+{{v.delta}}</span>
              <span class="t-sm muted">再生 / 7日</span>
            </span>
            <span class="tr-move t-sm t-num" style="color: {{v.moveColor}};"><i class="{{v.moveIcon}}" aria-hidden="true"></i>{{v.move}}</span>
          </a>
        </li>
      </sc-for>
    </ol>
  </div>
  <div class="foot-spacer"></div>
  <dc-import name="PublicFooter" hint-size="100%,280px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1500}}'>

    const V = [['崇渦に関するお知らせ 前編','おたこ','08:02'],['【幼虫アニメ】◯◯◯でしますか？◯でしますか？','幼虫','12:34'],['【文字PV】スチールワンダー / はるまきごはん','スティックのり','06:10'],['模範囚','hato','02:58'],['【サナドリウム/wiz_nicc】二次創作MV','lalaClione','03:27'],['未来線～ミライン～','てつどうふぁん','07:15'],['空白合作','空白合作チーム','03:12'],['【短編アニメ】魔法少女vs改造人間','おたこ','03:40'],['個々々々々々人 / Sohbana','あいこーすふぃあ','05:02'],['【自主制作アニメ】めざした空の向こう側','おたこ','04:20']];
    return {
      theme: this.props.theme ?? 'dark',

        const base = [3, 4, 4, 6, 7, 9, 10].map((x, k) => Math.max(1, x - ((i * 7 + k * 3) % 5) + (i % 3)));
        const mx = Math.max(...base);
        const mv = [['fa-solid fa-caret-up', '2', 'var(--success)'], ['fa-solid fa-minus', '', 'var(--ink-muted)'], ['fa-solid fa-caret-up', '5', 'var(--success)'], ['fa-solid fa-caret-down', '1', 'var(--ink-muted)'], ['', 'NEW', 'var(--ink)']][i % 5];
        return { rankStr: String(i + 1).padStart(2, '0'), rankColor: i < 3 ? 'var(--ink)' : 'var(--ink-muted)', title: a[0], creator: a[1], event: 'PVSF2026Sp', evIcon: '/_blob/6ecfc7b6882f277d815f563e873f25ee', thumb: T[(i + 4) % 8], icon: T[(i + 2) % 8], delta: (4210 - i * 360).toLocaleString('ja-JP'), bars: base.map(x => ({ h: Math.round(x / mx * 100) + '%' })), moveIcon: mv[0], move: mv[1], moveColor: mv[2] };

</script>
</body>
</html>
