name: Fix playlist worker strip compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-worker-tests.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/youtube-playlist-main-integration
          fetch-depth: 0
      - name: Replace unsupported parameter properties
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('workers/youtube-playlist-sync/index.ts')
          text = path.read_text()
          old = '''class DailyQuotaBudget {
            private remainingUnits: number;

            private constructor(
              private readonly env: PlaylistSyncEnv,
              private readonly now: number,
              remainingUnits: number,
            ) {
              this.remainingUnits = remainingUnits;
            }
          '''
          new = '''class DailyQuotaBudget {
            private readonly env: PlaylistSyncEnv;
            private readonly now: number;
            private remainingUnits: number;

            private constructor(
              env: PlaylistSyncEnv,
              now: number,
              remainingUnits: number,
            ) {
              this.env = env;
              this.now = now;
              this.remainingUnits = remainingUnits;
            }
          '''
          if old not in text:
              raise SystemExit('DailyQuotaBudget constructor block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/diagnose-worker-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Node 22型除去互換のためquotaクラスを修正"
          git push origin HEAD:agent/youtube-playlist-main-integration
