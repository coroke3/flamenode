<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>イベントグループ編集</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <div class="c-side"><dc-import name="AdminNav" theme="{{theme}}" active="events" hint-size="100%,1240px"></dc-import></div>
  <main class="c-main">
    <a href="AdminEventsHub.dc.html" class="il t-sm muted"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>グループ一覧</a>
    <div class="c-head" style="margin-top: 8px;">
      <h1 class="t-display">PVSF</h1>
      <div class="row" style="gap: 0;"><a href="Events.dc.html" class="ib" aria-label="公開ページ"><i class="fa-solid fa-arrow-up-right-from-square"></i></a><a href="AdminAuditHub.dc.html" class="ib" aria-label="監査ログ"><i class="fa-solid fa-clock-rotate-left"></i></a><a href="ConfirmModal.dc.html" class="ib" aria-label="グループを削除"><i class="fa-regular fa-trash-can"></i></a></div>
    </div>
    <div class="split">
      <form class="main form" onSubmit="{{prevent}}">
        <h2 class="t-h3">基本情報</h2>
        <div class="cols2"><x-import component-from-global-scope="FlameNode.TextField" label="名前 *" default-value="PVSF"></x-import><x-import component-from-global-scope="FlameNode.TextField" label="スラッグ *" default-value="pvsf" hint="名前から自動で入ります(英数字とハイフン)"></x-import></div>
        <x-import component-from-global-scope="FlameNode.TextField" label="説明" multiline="{{yes}}" default-value="映像連続投稿祭の各回"></x-import>
        <div class="cols2">
          <label class="field"><span>種別</span><span class="sel-i"><i class="fa-solid fa-tag" aria-hidden="true"></i><select class="select i"><option>系列</option><option>ジャンル</option><option>関連</option><option>コレクション</option><option>その他</option></select></span></label>
          <div class="field"><span>公開状態</span><div class="row" style="gap: 16px; min-height: 36px;"><label class="radio"><input type="radio" name="v" checked="{{yes}}">公開</label><label class="radio"><input type="radio" name="v">非公開</label><label class="radio"><input type="radio" name="v">アーカイブ</label></div></div>
          <x-import component-from-global-scope="FlameNode.TextField" label="表示順" type="number" default-value="1"></x-import>
          <div class="field"><span>アクセント色</span><div class="row" style="gap: 6px; flex-wrap: wrap;"><button type="button" class="en-sw on" style="background: #ff5500;" aria-label="#ff5500"></button><button type="button" class="en-sw" style="background: #f2c94c;" aria-label="#f2c94c"></button><button type="button" class="en-sw" style="background: #6fcf97;" aria-label="#6fcf97"></button><button type="button" class="en-sw" style="background: #56ccf2;" aria-label="#56ccf2"></button><button type="button" class="en-sw" style="background: #bb6bd9;" aria-label="#bb6bd9"></button><button type="button" class="en-sw" style="background: #d6ec8a;" aria-label="#d6ec8a"></button><span class="t-mono t-sm muted" style="margin-left: 6px;">#ff5500</span></div></div>
        </div>
        <div class="field-i"><x-import component-from-global-scope="FlameNode.TextField" label="アイコン URL"></x-import><i class="fa-solid fa-image" aria-hidden="true"></i></div>
        <div><button type="submit" class="fn-btn fn-btn--primary">保存</button></div>
      </form>
      <section class="side stack" style="gap: 12px;" aria-labelledby="mem">
        <h2 id="mem" class="t-h3">所属イベント <span class="muted t-num">16</span></h2>
        <div class="row" style="gap: 6px;"><div class="field-i" style="flex: 1;"><x-import component-from-global-scope="FlameNode.TextField" aria-label="イベント名で検索" placeholder="イベント名で検索"></x-import><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></div><button type="button" class="fn-btn fn-btn--secondary"><i class="fa-solid fa-plus" aria-hidden="true"></i>選択を追加</button></div>
        <div>
          <div class="fn-row fn-row--compact"><img class="ev-icon" src="/_blob/6ecfc7b6882f277d815f563e873f25ee" alt="" style="width: 24px; height: 24px;"><span class="fn-row__body"><span class="fn-row__title">PVSF2026Sp</span><span class="fn-row__meta t-num">2026.03.27</span></span><button type="button" class="ib sm" aria-label="外す"><i class="fa-solid fa-xmark"></i></button></div>
          <div class="fn-row fn-row--compact"><img class="ev-icon" src="/_blob/f5c1a8af077b887c7bb1d043f3cf69c1" alt="" style="width: 24px; height: 24px;"><span class="fn-row__body"><span class="fn-row__title">PVSF2025S</span><span class="fn-row__meta t-num">2025.08.29</span></span><button type="button" class="ib sm" aria-label="外す"><i class="fa-solid fa-xmark"></i></button></div>
          <div class="fn-row fn-row--compact"><img class="ev-icon" src="/_blob/525c7209e503b8327cbd5bf4a64e5fc8" alt="" style="width: 24px; height: 24px;"><span class="fn-row__body"><span class="fn-row__title">PVSF2025Sp</span><span class="fn-row__meta t-num">2025.03.29</span></span><button type="button" class="ib sm" aria-label="外す"><i class="fa-solid fa-xmark"></i></button></div>
          <div class="fn-row fn-row--compact"><img class="ev-icon" src="/_blob/191c3939aefb326fc04fd3ccf6db83a9" alt="" style="width: 24px; height: 24px;"><span class="fn-row__body"><span class="fn-row__title">第一回紅白PV連続投稿合戦</span><span class="fn-row__meta t-num">2019.12.26</span></span><button type="button" class="ib sm" aria-label="外す"><i class="fa-solid fa-xmark"></i></button></div>
        </div>
      </section>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark', yes: true, prevent: (e) => e.preventDefault() }; }
}
</script>
</body>
</html>
