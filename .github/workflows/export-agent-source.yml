name: Agent canonical cleanup verification

on:
  pull_request:
    branches:
      - agent/db-canonical-migration-v2
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chapter-comment-delete-and-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 互換用の空データ経路を削除
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("app/(public)/[id]/page.tsx")
          text = page.read_text()
          text = text.replace(
              'detail: { video, creator, events, members, chapters, memberChapters },',
              'detail: { video, creator, events, members, chapters },',
          )
          old = '''            <MemberSection
              members={members}
              memberChapters={memberChapters.map(
                (chapter) => ({
                  id: chapter.id,
                  chapter_time: chapter.chapter_time,
                  chapter_label: chapter.chapter_label,
                  note: chapter.note,
                  video_member_id:
                    chapter.video_member_id,
                }),
              )}
            />'''
          text = text.replace(old, '            <MemberSection members={members} />')
          if "memberChapters" in text:
              raise SystemExit("public page still references memberChapters")
          page.write_text(text)

          queries = Path("src/lib/db/videoDetailQueries.ts")
          text = queries.read_text()
          marker = "  // 旧メンバー専用タブの返却形"
          if marker in text:
              start = text.index(marker)
              end = text.index("\n  return {", start)
              text = text[:start] + text[end + 1:]
          text = text.replace("    chapters,\n    memberChapters,", "    chapters,")
          if "memberChapters" in text:
              raise SystemExit("videoDetailQueries still references memberChapters")
          queries.write_text(text)

          section = Path("src/components/video/MemberSection.tsx")
          text = section.read_text()
          text = text.replace(
              '  /** 呼び出し元の切替完了まで受け取るが、表示・処理には使用しない。 */\n  memberChapters?: readonly unknown[];\n',
              '',
          )
          if "memberChapters" in text:
              raise SystemExit("MemberSection still references memberChapters")
          section.write_text(text)
          PY
      - name: 依存関係をインストール
        run: npm ci
      - name: 検証
        shell: bash
        run: |
          mkdir -p .agent
          set +e
          {
            echo "head=$(git rev-parse HEAD)"
            echo "date=$(date -u +%FT%TZ)"
            for command in \
              "npm run typecheck" \
              "npm run lint" \
              "npm run test:unit" \
              "npm run check:docs"; do
              echo "===== $command ====="
              bash -lc "$command"
              echo "exit=$?"
            done
          } > .agent/verification.txt 2>&1
          cat .agent/verification.txt
      - name: 修正と検証結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/'(public)'/'[id]'/page.tsx src/lib/db/videoDetailQueries.ts src/components/video/MemberSection.tsx .agent/verification.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(agent): 後方互換の残存を除去して検証"
          git push origin HEAD:agent/chapter-comment-delete-and-validation
