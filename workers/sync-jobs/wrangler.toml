name = "flamenode-sync-jobs"
main = "index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers Free で1時間以上のCronは長時間CPU枠を利用できる。
# 1回の処理量を増やし、全件巡回に数か月かかる状態を避ける。
[triggers]
crons = ["30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "flamenode_db"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

[vars]
# YOUTUBE_API_KEY is set with wrangler secret put.
