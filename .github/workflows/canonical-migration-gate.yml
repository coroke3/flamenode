name: Canonical migration gate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: canonical-migration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-canonical-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 一時統合物が残っていないことを検査
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .agent-patch
          test ! -e .agent-trigger
          test ! -e .github/workflows/apply-final-patch.yml
      - name: DB正本migrationを検査
        run: npm run check:db-migration
      - name: D1空DBmigrationを検査
        run: npm run check:db-d1-empty
      - name: D1旧DBmigrationを検査
        run: npm run check:db-d1-legacy
      - name: 旧形式インポート専用境界を検査
        run: node --test --experimental-strip-types src/lib/import/legacy/canonicalImport.test.mjs
      - name: X名義旧識別子のmerge ref診断を作成
        shell: bash
        run: |
          mkdir -p .tmp
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          tokens = [
              'x_account_link_requests',
              'x_id_merge_requests',
              'x_id_merge_reverts',
              'linked_user_id',
              'approval_requested_at',
              'x_user_icons',
              'x_user_youtube_channels',
          ]
          legacy_boundaries = (
              'src/lib/import/legacy/',
              'app/api/admin/import/legacy/',
              'app/(admin)/admin/import/',
          )
          non_runtime = re.compile(r'(?:\.test|\.contract\.test|\.integration\.test)\.mjs$')
          violations = []
          for base in ('src', 'app', 'workers'):
              for path in (root / base).rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.mjs'}:
                      continue
                  rel = path.as_posix()
                  if rel.endswith('src/lib/db/schema.base.ts'):
                      continue
                  if non_runtime.search(rel) or 'historical' in rel:
                      continue
                  if any(rel.startswith(boundary) for boundary in legacy_boundaries):
                      continue
                  source = path.read_text(encoding='utf-8')
                  for token in tokens:
                      if token in source:
                          violations.append(f'{rel}: {token}')
          output = '\n'.join(violations)
          Path('.tmp/x-identity-violations.txt').write_text(output + ('\n' if output else ''), encoding='utf-8')
          print(output or 'no violations')
          PY
      - name: X名義ランタイム旧識別子を検査
        run: node --test --experimental-strip-types --test-name-pattern="X名義ランタイム" src/lib/auth/xIdentityCanonical.contract.test.mjs
      - name: X名義多対多リンク契約を検査
        run: node --test --experimental-strip-types --test-name-pattern="X名義と認証ユーザー" src/lib/auth/xIdentityCanonical.contract.test.mjs
      - name: X名義権限境界を検査
        run: node --test --experimental-strip-types --test-name-pattern="一般承認と統合" src/lib/auth/xIdentityCanonical.contract.test.mjs
      - name: X名義公開DTO契約を検査
        run: node --test --experimental-strip-types --test-name-pattern="公開DTOは認証ID" src/lib/auth/xIdentityCanonical.contract.test.mjs
      - name: 最終受入契約を検査
        run: node --test --experimental-strip-types src/lib/integration/finalAcceptance.integration.test.mjs
      - name: X名義診断を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-identity-canonical-diagnostics-${{ github.run_id }}
          path: .tmp/x-identity-violations.txt
          if-no-files-found: error
          retention-days: 1
