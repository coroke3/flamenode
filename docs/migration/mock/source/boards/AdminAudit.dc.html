<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>監査ログ</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0} .kchip{display:inline-block;padding:0 6px;margin:0 4px 2px 0;background:var(--surface-active);font:400 12px/20px var(--font-mono)}</style>
</helmet>
<div class="{{rootCls}}" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <sc-if value="{{full}}" hint-placeholder-val="{{false}}"><div class="c-side"><dc-import name="AdminNav" theme="{{theme}}" active="audit" hint-size="100%,1240px"></dc-import></div></sc-if>
  <main class="c-main">
    <div class="c-head"><div><sc-if value="{{full}}" hint-placeholder-val="{{false}}"><h1 class="t-display">監査ログ</h1></sc-if><p class="muted">管理操作を新しい順に表示します。変更前後の差分を確認できます。</p></div></div>
    <sc-if value="{{full}}" hint-placeholder-val="{{false}}"><nav class="subnav" aria-label="監査メニュー" style="margin-bottom: 24px;">
      <a href="AdminAuditHub.dc.html" class="il" aria-current="page"><i class="fa-solid fa-list" aria-hidden="true"></i>監査ログ</a>
      <a href="AdminAuditHub.dc.html" class="il"><i class="fa-solid fa-sliders" aria-hidden="true"></i>ログ設定</a>
      <a href="AdminAuditHub.dc.html" class="il"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i>復元履歴</a>
    </nav></sc-if>
    <form class="wrap-row aud-filters" style="gap: 8px; margin-bottom: 16px;" onSubmit="{{prevent}}">
      <span class="sel-i"><i class="fa-solid fa-table" aria-hidden="true"></i><select class="select i" aria-label="テーブル"><option>テーブル すべて</option><option>videos</option><option>events</option><option>slots</option><option>users</option></select></span>
      <span class="sel-i"><i class="fa-solid fa-code-commit" aria-hidden="true"></i><select class="select i" aria-label="操作種別"><option>操作 すべて</option><option>作成</option><option>更新</option><option>削除</option></select></span>
      <span class="sel-i"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><select class="select i" aria-label="復元ステータス"><option>復元 すべて</option><option>復元可能</option><option>復元済み</option><option>期限切れ</option><option>復元不可</option><option>競合</option><option>失敗</option></select></span>
      <span class="field-i sm-field" style="width: 200px;"><i class="fa-solid fa-crosshairs" aria-hidden="true"></i><x-import component-from-global-scope="FlameNode.TextField" aria-label="target_id 完全一致" placeholder="target_id 完全一致"></x-import></span>
      <span class="field-i sm-field" style="width: 200px;"><i class="fa-solid fa-user" aria-hidden="true"></i><x-import component-from-global-scope="FlameNode.TextField" aria-label="user_id 完全一致" placeholder="user_id 完全一致"></x-import></span>
      <div class="field-i" style="width: 180px;"><x-import component-from-global-scope="FlameNode.TextField" aria-label="実行者 user_id" placeholder="実行者 user_id"></x-import><i class="fa-solid fa-user" aria-hidden="true"></i></div>
      <div class="field-i" style="width: 180px;"><x-import component-from-global-scope="FlameNode.TextField" aria-label="対象レコード ID" placeholder="target_id"></x-import><i class="fa-solid fa-crosshairs" aria-hidden="true"></i></div>
      <x-import component-from-global-scope="FlameNode.TextField" aria-label="since (JST)" type="date" style="width: 150px;"></x-import>
      <x-import component-from-global-scope="FlameNode.TextField" aria-label="until (JST)" type="date" style="width: 150px;"></x-import>
      <span style="flex: 1;"></span>
      <span class="row" role="group" aria-label="表示切替" style="gap: 0;"><button type="button" class="ib on" aria-label="テーブル"><i class="fa-solid fa-table-list"></i></button><button type="button" class="ib" aria-label="タイムライン"><i class="fa-solid fa-timeline"></i></button><button type="button" class="ib" aria-label="カード"><i class="fa-solid fa-grip"></i></button></span>
    </form>
    <div class="t-scroll">
      <div class="dt" style="--cols: 110px 92px 100px minmax(120px,.8fr) 130px minmax(200px,1.6fr) 110px 40px; --minw: 1040px;">
        <div class="dt-h"><span>日時</span><span>操作</span><span>テーブル</span><span>対象 ID</span><span>実行者</span><span>変更差分サマリ</span><span>復元</span><span></span></div>
        <sc-for list="{{logs}}" as="l" hint-placeholder-count="8">
          <a href="AdminAuditDetail.dc.html" class="dt-r" style="color: var(--ink);">
            <span class="t-num muted">{{l.at}}</span>
            <span class="il"><i class="{{l.opIcon}}" aria-hidden="true" style="color: {{l.opColor}};"></i>{{l.op}}</span>
            <span class="t-mono">{{l.table}}</span>
            <span class="t-mono ell">{{l.target}}</span>
            <span class="row" style="gap: 8px;"><img class="avatar" src="{{l.icon}}" alt="" style="width: 20px; height: 20px;"><span class="ell">{{l.actor}}</span></span>
            <span class="ell"><span class="kchip">{{l.k1}}</span><span class="kchip">{{l.k2}}</span><span class="t-sm muted">{{l.more}}</span></span>
            <span class="st"><span class="{{l.rdot}}"></span>{{l.restore}}</span>
            <i class="fa-solid fa-chevron-right muted" aria-hidden="true"></i>
          </a>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embed":{"editor":"boolean","default":true},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const r = this.__emb();
    const emb = this.props.embed ?? true;
    r.full = !emb; r.rootCls = emb ? 'p-root emb-root' : 'p-root';
    return r;
  }
  __emb() {
    const T = ['/_blob/525c7209e503b8327cbd5bf4a64e5fc8','/_blob/191c3939aefb326fc04fd3ccf6db83a9','/_blob/6ecfc7b6882f277d815f563e873f25ee','/_blob/755d245a064a6f5935c3dccd9a941048'];
    const O = { '更新': ['fa-solid fa-pen', 'var(--info)'], '作成': ['fa-solid fa-plus', 'var(--success)'], '削除': ['fa-solid fa-trash-can', 'var(--danger)'] };
    const R = { ok: ['復元可能', 'dot ok'], done: ['復元済み', 'dot info'], no: ['復元不可', 'dot'], exp: ['期限切れ', 'dot'], conf: ['競合', 'dot warn'] };
    const L = [
      ['10.04 11:02', '更新', 'videos', 'vid_9c1e2a', 'Mochi', 'status', 'reviewed_at', '', 'ok'],
      ['10.04 09:40', '作成', 'slots', 'slt_44a2f0', 'おたこ', 'reserved_by', 'x_user_id', '+3', 'no'],
      ['10.03 22:10', '更新', 'x_link_requests', 'xlr_31a9c4', 'あおね', 'status', 'decided_at', '', 'ok'],
      ['10.03 20:01', '更新', 'videos', 'vid_7d0b11', 'Mochi', 'title', 'music', '+2', 'conf'],
      ['10.02 18:30', '作成', 'event_staff', 'stf_12ab90', 'Mochi', 'permission_preset', 'x_user_id', '', 'no'],
      ['10.01 21:00', '削除', 'slots', 'slt_0091aa', 'Mochi', '—', '', '', 'done'],
      ['09.20 10:00', '更新', 'events', 'PVSF2026S', 'Mochi', 'entry_end_time', '', '', 'exp']
    ];
    return {
      theme: this.props.theme ?? 'dark', prevent: (e) => e.preventDefault(),
      logs: L.map((l, i) => ({ at: l[0], op: l[1], opIcon: O[l[1]][0], opColor: O[l[1]][1], table: l[2], target: l[3], actor: l[4], k1: l[5], k2: l[6] || '', more: l[7], restore: R[l[8]][0], rdot: R[l[8]][1], icon: T[i % 4] }))
    };
  }
}
</script>
</body>
</html>
