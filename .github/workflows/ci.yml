name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: 後方互換の残存を除去
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("app/(public)/[id]/page.tsx")
          text = page.read_text()
          text = text.replace(
              'detail: { video, creator, events, members, chapters, memberChapters },',
              'detail: { video, creator, events, members, chapters },',
          )
          marker = '            <MemberSection\n              members={members}\n              memberChapters={memberChapters.map('
          if marker in text:
              start = text.index(marker)
              end = text.index('            />\n', start) + len('            />\n')
              text = text[:start] + '            <MemberSection members={members} />\n' + text[end:]
          if "memberChapters" in text:
              raise SystemExit("public page still references memberChapters")
          page.write_text(text)

          queries = Path("src/lib/db/videoDetailQueries.ts")
          text = queries.read_text()
          marker = "  // 旧メンバー専用タブの返却形"
          if marker in text:
              start = text.index(marker)
              end = text.index("\n  return {", start)
              text = text[:start] + text[end + 1:]
          text = text.replace("    chapters,\n    memberChapters,", "    chapters,")
          if "memberChapters" in text:
              raise SystemExit("videoDetailQueries still references memberChapters")
          queries.write_text(text)

          section = Path("src/components/video/MemberSection.tsx")
          text = section.read_text().replace(
              '  /** 呼び出し元の切替完了まで受け取るが、表示・処理には使用しない。 */\n  memberChapters?: readonly unknown[];\n',
              '',
          )
          if "memberChapters" in text:
              raise SystemExit("MemberSection still references memberChapters")
          section.write_text(text)

          health = Path("src/lib/admin/healthChecks.ts")
          text = health.read_text()
          old_marker = "/** video_members.chapters_json が現行の配列形式を満たすか */"
          next_marker = "/** notification_outbox の processing が固着していないか */"
          if old_marker in text:
              start = text.index(old_marker)
              end = text.index(next_marker, start)
              text = text[:start] + text[end:]
          text = text.replace("    checkVideoMemberChaptersJsonInvalid(db),\n", "")
          if "video_members_chapters_json_invalid" in text:
              raise SystemExit("health check still references chapters_json")
          health.write_text(text)

          action = Path("src/lib/actions/chapter.ts")
          text = action.read_text().replace(
              " * 旧 video_members.chapters_json には書き込まない。",
              " * チャプターは video_chapters のみへ保存する。",
          )
          action.write_text(text)
          PY

          changed=(
            "app/(public)/[id]/page.tsx"
            "src/lib/db/videoDetailQueries.ts"
            "src/components/video/MemberSection.tsx"
            "src/lib/admin/healthChecks.ts"
            "src/lib/actions/chapter.ts"
          )
          if git diff --quiet -- "${changed[@]}"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${changed[@]}"
          git commit -m "chore(agent): 後方互換の残存を除去"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存関係をインストール
        run: npm ci --no-audit --no-fund

      - name: 型検査
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unitテスト
        run: npm run test:unit

      - name: 文書検査
        run: |
          npm run check:docs
          npm run check:project-docs
