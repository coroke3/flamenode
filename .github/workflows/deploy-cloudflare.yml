name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_workers:
        description: Workers もデプロイする
        type: boolean
        default: true
      deploy_pages:
        description: Pages もデプロイする
        type: boolean
        default: true
      apply_migrations:
        description: 本番 D1 にマイグレーションを適用する
        type: boolean
        default: true

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy-pages:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Cloudflare resource IDs
        run: |
          if [ -z "$CF_IDS_JSON" ] && [ ! -f cloudflare/ids.json ]; then
            echo "::error::CF_IDS_JSON (GitHub Secret) または cloudflare/ids.json が必要です。"
            exit 1
          fi
          node scripts/sync-wrangler-ids.mjs

      - name: Verify Cloudflare config
        run: npm run check:cloudflare-config

      - name: Typecheck
        run: npm run typecheck

      - name: Build for Cloudflare Pages
        run: npm run pages:build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: FlameNode
          CI: "1"

      - name: Apply D1 migrations (remote)
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.apply_migrations)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply flamenode_db --remote

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=flamenode --commit-dirty=true

  deploy-workers:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_workers)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Cloudflare resource IDs
        run: |
          if [ -z "$CF_IDS_JSON" ] && [ ! -f cloudflare/ids.json ]; then
            echo "::error::CF_IDS_JSON (GitHub Secret) または cloudflare/ids.json が必要です。"
            exit 1
          fi
          node scripts/sync-wrangler-ids.mjs

      - name: Verify Cloudflare config
        run: npm run check:cloudflare-config

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Workers
        run: npm run workers:deploy
