<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイコン選択(候補/切り抜き) — FlameNode (static)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<link rel="stylesheet" href="../site/assets/fa/css/all.min.css">
<link rel="stylesheet" href="../site/assets/bundle.css">
<link rel="stylesheet" href="../site/assets/fn.css">
<style>html,body{margin:0;background:#000}</style>
</head><body>
<!-- 静的スナップショット(初期状態)。route:  / source: source/boards/IconPicker.dc.html -->
<div id="fn-root">

<style>






</style>

<style>
body{margin:0}
.ic-field{display:grid;gap:8px}
.ic-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ic-l{font:400 14px/20px var(--font-sans);color:var(--ink)}
.ic-body{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;margin-top:8px;align-items:start}
.ic-now{display:grid;gap:6px;justify-items:center;text-align:center}
.ic-now img,.ic-blank{width:96px;height:96px;object-fit:cover;display:grid;place-items:center;background:var(--surface-subtle);color:var(--ink-muted);font-size:28px}
.ic-panel{display:grid;gap:12px;min-width:0}
.ic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;max-width:520px}
.ic-body:has(.ic-grid) .ic-now{display:none}
.ic-c{position:relative;aspect-ratio:1/1;padding:3px;border:1px solid var(--border-subtle);border-radius:4px;background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--ink-muted);overflow:hidden;min-width:0}
.ic-c:hover{background:var(--surface-subtle)}
.ic-c.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand);color:var(--ink)}
.ic-c img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4px}
.ic-c .ic-tag{position:absolute;left:4px;bottom:4px;font-size:12px;line-height:16px;padding:0 4px;background:rgba(0,0,0,.72);color:#fff}
.ic-c .ic-tag:empty{display:none}
.ic-c .fa-check{position:absolute;top:2px;right:2px;width:16px;height:16px;display:grid;place-items:center;background:var(--brand);color:var(--on-brand,#000);border-radius:50%;font-size:9px}
.ic-none{font-size:18px}
.ic-none .ic-tag{background:transparent;color:inherit}
.ic-url summary{cursor:pointer;list-style:none}
.ic-url summary::-webkit-details-marker{display:none}
.ic-url .input{margin-top:8px;width:100%;max-width:520px}
.ic-drop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px;background:var(--surface-subtle)}
.ic-drop{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:20px;background:var(--surface-subtle);transition:background .15s}
.ic-drop.over{background:var(--surface-active)}
.ic-drop-n{flex-basis:100%;font-size:11px;line-height:16px;color:var(--ink-muted)}
.ic-vp img.fit-w{width:100%;height:auto}
.ic-doneRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ic-crop{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.ic-vp{position:relative;width:280px;height:280px;overflow:hidden;background:var(--surface-subtle);cursor:grab;touch-action:none;user-select:none}
.ic-vp:active{cursor:grabbing}
.ic-vp img{position:absolute;left:50%;top:50%;height:100%;width:auto;max-width:none;pointer-events:none}
.ic-ctl{display:grid;gap:16px;align-content:start}
.ic-zoom{display:flex;align-items:center;gap:8px}
.ic-zoom input{flex:1;min-width:80px;accent-color:var(--ink)}
@media (max-width:640px){
  .ic-body{grid-template-columns:64px minmax(0,1fr);gap:12px}
  .ic-now img,.ic-blank{width:64px;height:64px;font-size:20px}
  .ic-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .ic-crop{grid-template-columns:1fr}
  .ic-body:has(.ic-crop){grid-template-columns:1fr}
  .ic-body:has(.ic-crop) .ic-now{display:none}
  .ic-vp{width:100%;max-width:280px;height:auto;aspect-ratio:1/1;justify-self:center}
}
</style>

<div class="p-root" data-theme="dark" lang="ja" style="min-height: 0; background: transparent; padding-bottom: 0;">
            <div class="ic-field" role="group" aria-labelledby="ic-l" aria-describedby="ic-h">
  <div class="ic-top">
    <span class="ic-l" id="ic-l">作品アイコン</span>
    <div class="seg sm" role="tablist" aria-label="作品アイコンの設定方法">
      <button type="button" role="tab" class="on" aria-selected="true">候補から選ぶ</button>
      <button type="button" role="tab" class="">新規アップロード</button>
    </div>
  </div>
  <p class="t-sm muted" id="ic-h" style="margin: 0;">この作品だけに表示するアイコンです。X ID の既定アイコンは変わりません。</p>
  <div class="ic-body">
    <div class="ic-now" aria-live="polite">
      <img src="../site/assets/img/fc027fe6fe3a001a22a1933270ce72b9.jpg" alt="選択中のアイコン">
      
      <span class="t-xs muted">X のアイコン</span>
    </div>
    <div class="ic-panel">
      
        <div class="ic-grid" role="radiogroup" aria-label="アイコン候補">
          
            <button type="button" class="ic-c on" role="radio" aria-checked="true" aria-label="X のアイコン" title="X のアイコン"><img src="../site/assets/img/fc027fe6fe3a001a22a1933270ce72b9.jpg" alt=""><i class="fa-solid fa-check" aria-hidden="true"></i></button>
          
            <button type="button" class="ic-c" role="radio" aria-checked="false" aria-label="過去の作品で使用" title="過去の作品で使用"><img src="../site/assets/img/f5c1a8af077b887c7bb1d043f3cf69c1.jpg" alt=""><i class="" aria-hidden="true"></i></button>
          
            <button type="button" class="ic-c" role="radio" aria-checked="false" aria-label="過去の作品で使用" title="過去の作品で使用"><img src="../site/assets/img/be71b2f744d470e10fb8c8ca733bbace.jpg" alt=""><i class="" aria-hidden="true"></i></button>
          
            <button type="button" class="ic-c" role="radio" aria-checked="false" aria-label="過去の作品で使用" title="過去の作品で使用"><img src="../site/assets/img/6ecfc7b6882f277d815f563e873f25ee.jpg" alt=""><i class="" aria-hidden="true"></i></button>
          
          <button type="button" class="ic-c ic-none" role="radio" aria-checked="false" aria-label="アイコンを指定しない" title="アイコンを指定しない"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
        
        <details class="ic-url"><summary class="il t-sm muted" style="cursor: pointer;"><i class="fa-solid fa-link" aria-hidden="true"></i>URL で指定</summary><input class="select" type="url" maxlength="500" placeholder="https://" aria-label="アイコン URL" value="assets/img/fc027fe6fe3a001a22a1933270ce72b9.jpg" style="width: 100%; max-width: 520px; margin-top: 8px; padding: 0 12px; background-image: none;"></details>
      
      
      
    </div>
  </div>
</div>
</div>

</div>
</body></html>
