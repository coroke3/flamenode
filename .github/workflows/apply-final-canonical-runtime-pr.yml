name: Apply final canonical runtime PR

on:
  pull_request:
    branches: [agent/db-canonical-migration-v2]

permissions:
  contents: write

concurrency:
  group: apply-final-canonical-runtime-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/db-canonical-runtime-apply'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/db-canonical-runtime-apply
          fetch-depth: 0
      - name: 正本ランタイムパッチを適用
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          exec > >(tee .tmp/apply.log) 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictStyle diff3
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git reset --hard origin/agent/db-canonical-migration-v2

          set +e
          git merge --no-ff --no-edit -Xtheirs origin/agent/db-canonical-events
          status=$?
          set -e
          if (( status != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            (( ${#conflicts[@]} > 0 )) || { echo "event merge failed without conflicts"; exit 1; }
            printf '%s\n' "${conflicts[@]}" > .tmp/event-conflicts.txt
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/*)
                  git rm -f -- "$path" || true
                  continue
                  ;;
                migrations/*|src/lib/db/schema.ts|src/lib/db/schema.canonical.ts|docs/database/canonical-migration-plan.md|docs/db-history/*)
                  git checkout --ours -- "$path"
                  ;;
                *)
                  git checkout --theirs -- "$path"
                  ;;
              esac
              git add -- "$path"
            done
            ! git diff --name-only --diff-filter=U | grep -q .
            git commit --no-edit
          fi

          git checkout origin/agent/db-canonical-videos-import -- .agent-patch
          mapfile -t parts < <(find .agent-patch -maxdepth 1 -type f -name 'part-*' | sort -V)
          (( ${#parts[@]} > 0 )) || { echo "動画担当の分割パッチがありません"; exit 1; }
          cat "${parts[@]}" | base64 -d | gzip -d > /tmp/canonical-videos-import.patch
          echo "08ec23c94c21c429615e0d525a9ce151e1522f91f37c48edf0719db6f88b2151  /tmp/canonical-videos-import.patch" | sha256sum -c -
          git apply --3way --index /tmp/canonical-videos-import.patch
          ! git diff --name-only --diff-filter=U | grep -q .
          git diff --cached --check
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 型検査
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .tmp/typecheck.log
      - name: Lint
        run: npm run lint
      - name: DB正本検査
        shell: bash
        run: |
          set -o pipefail
          { npm run check:db-schema; npm run check:db-migration; npm run check:db-legacy; } 2>&1 | tee .tmp/db-checks.log
      - name: 検証済みランタイムを反映
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent-patch .agent-trigger
          rm -f .github/workflows/apply-final-canonical-runtime.yml
          git add -A
          git diff --cached --check
          git commit -m "イベント・作品・YouTube・監査ランタイムを新正本へ統合"
          git push --force-with-lease origin HEAD:agent/db-canonical-runtime-apply
      - name: 失敗時の作業ツリーを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-runtime-apply-${{ github.run_id }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 3
