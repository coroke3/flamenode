name: Migration contract and workspace verification

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/AI_CONTEXT.md"
      - "docs/migration/**"
      - "scripts/check-migration*.mjs"
      - "scripts/print-migration-task-context*.mjs"
      - "scripts/check-project-docs.mjs"
      - "scripts/check-domain-imports*.mjs"
      - "scripts/check-server-core-boundaries*.mjs"
      - ".claude/**"
      - ".codex/**"
      - ".agents/**"
      - "apps/**"
      - "packages/**"
      - "src/lib/**"
      - "src/components/**"
      - "src/styles/**"
      - "public/**"
      - "cloudflare/**"
      - "middleware.ts"
      - "next.config.mjs"
      - "open-next.config.ts"
      - "instrumentation.ts"
      - "tsconfig.json"
      - "wrangler.toml"
      - "drizzle.config.ts"
      - "tsconfig.base.json"
      - "app/**"
      - "workers/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/migration-docs-check.yml"
  workflow_dispatch:

concurrency:
  group: migration-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: squash後もcheckpoint元commitを検証できるよう不足PR履歴を取得
        run: node scripts/check-migration-work-items.mjs --fetch-pr-history
      - name: 移行文書・タスク依存・Decision Gate
        run: node scripts/check-migration-docs.mjs
      - name: 実行契約の状態遷移テスト
        run: node --test scripts/check-migration-execution.test.mjs
      - name: 登録mockとCURRENT route・適用範囲の回帰テスト
        run: node --test scripts/check-migration-ui-reference.test.mjs
      - name: 全MIG実装カード網羅性
        run: node scripts/check-migration-task-cards.mjs
      - name: 実装カードchecker回帰テスト
        run: node --test scripts/check-migration-task-cards.test.mjs
      - name: ファイル別依存・Route/RH/SA登録とPR差分を照合
        env:
          MIGRATION_FILE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-migration-file-progress.mjs
      - name: ファイル進捗checkerの回帰テスト
        run: node --test scripts/check-migration-file-progress.test.mjs
      - name: ledger網羅検査（行の無いtracked source fileを落とす, MIG-0622）
        run: |
          node scripts/check-migration-ledger-completeness.mjs
          node --test scripts/check-migration-ledger-completeness.test.mjs
      - name: Work-item進捗構造と所有重複の回帰テスト
        run: |
          node scripts/check-migration-work-items.mjs
          node --test scripts/check-migration-work-items.test.mjs
      - name: 小型エージェント用1MIGコンテキストのサイズ・抽出テスト
        run: |
          node --test scripts/print-migration-task-context.test.mjs
          node scripts/print-migration-task-context.mjs MIG-0401 > /dev/null
          node scripts/print-migration-task-context.mjs --next --offline > /dev/null
      - name: MD相互リンク検証と回帰テスト
        run: |
          node scripts/check-migration-links.mjs
          node --test scripts/check-migration-links.test.mjs

  migration-workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存のロック整合性
        run: npm ci --no-audit --no-fund
      - name: 移行文書・DB schema関連チェック
        run: |
          node scripts/check-migration-work-items.mjs --fetch-pr-history
          npm run check:project-docs
      - name: 既存Nextの型・回帰・軽量検証
        run: |
          npm run typecheck
          npm run test:unit
          npm run verify:fast
      - name: 共有パッケージから順番にビルド
        run: |
          npm run build --workspace=@flamenode/contracts
          npm run build --workspace=@flamenode/domain
          npm run test --workspace=@flamenode/domain
          npm run build --workspace=@flamenode/server-core
          npm run test --workspace=@flamenode/server-core
          npm run build --workspace=@flamenode/ui
          npm run test --workspace=@flamenode/ui
          npm run test --workspace=@flamenode/site  # astro build + Island tests (MIG-0402)
          npm run build --workspace=@flamenode/app
          npm run build --workspace=@flamenode/api
          npm run test --workspace=@flamenode/api
      - name: MIG-0401 synthetic public-only HTML verification
        run: node scripts/check-migration-public-poc-build.mjs
      - name: MIG-0404 route-map generator verification
        run: node --test --experimental-strip-types scripts/migration-route-map.test.mjs
      - name: MIG-0405 visibility gateway verification
        run: node --test --experimental-strip-types scripts/migration-gateway.test.mjs
      - name: MIG-0406 CPU/build benchmark verification
        run: |
          node --test --experimental-strip-types scripts/check-public-site-build-budget.test.mjs
          node scripts/check-public-site-build-budget.mjs

