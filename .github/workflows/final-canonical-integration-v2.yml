name: Final canonical candidate repair

on:
  pull_request:
    branches:
      - agent/db-canonical-migration-v2

permissions:
  contents: write

concurrency:
  group: final-canonical-candidate-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/db-canonical-final-integration' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/db-canonical-final-integration
          fetch-depth: 0

      - name: 正本競合を修復
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/db-canonical-migration-v2
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml

          python - <<'PY'
          from pathlib import Path
          import re

          page = Path("app/(public)/[id]/page.tsx")
          text = page.read_text().replace(
              "detail: { video, creator, events, members, chapters, memberChapters },",
              "detail: { video, creator, events, members, chapters },",
          )
          text = re.sub(
              r"<MemberSection\s+members=\{members\}\s+memberChapters=.*?\s*/>",
              "<MemberSection members={members} />",
              text,
              flags=re.S,
          )
          if "memberChapters" in text:
              raise SystemExit("public page still references memberChapters")
          page.write_text(text)

          queries = Path("src/lib/db/videoDetailQueries.ts")
          text = re.sub(
              r"\n\s*// 旧メンバー専用タブの返却形.*?\n\s*return \{",
              "\n\n  return {",
              queries.read_text(),
              flags=re.S,
          ).replace("    chapters,\n    memberChapters,", "    chapters,")
          if "memberChapters" in text:
              raise SystemExit("videoDetailQueries still references memberChapters")
          queries.write_text(text)

          section = Path("src/components/video/MemberSection.tsx")
          text = section.read_text().replace(
              "  /** 呼び出し元の切替完了まで受け取るが、表示・処理には使用しない。 */\n  memberChapters?: readonly unknown[];\n",
              "",
          )
          if "memberChapters" in text:
              raise SystemExit("MemberSection still references memberChapters")
          section.write_text(text)

          event_admin = Path("src/lib/actions/event-admin.ts")
          text = event_admin.read_text().replace(
              "  eventCustomQuestions,\n  eventTemplates,\n  events,",
              "  eventCustomQuestions,\n  eventStaff,\n  eventTemplates,\n  events,\n  xUserAccountLinks,\n  xUsers,",
          )
          duplicate = '''  const duplicate = (
    await db.select({ id: events.id }).from(events).where(eq(events.id, id)).limit(1)
  )[0];
  if (duplicate) return { ok: false, message: `ID「${id}」は既に存在します。` };
'''
          if "const ownerIdentity" not in text:
              owner_lookup = duplicate + '''
  const ownerIdentity = (
    await db
      .select({
        x_user_id: xUserAccountLinks.x_user_id,
        display_name: xUsers.x_name,
      })
      .from(xUserAccountLinks)
      .innerJoin(xUsers, eq(xUsers.id, xUserAccountLinks.x_user_id))
      .where(eq(xUserAccountLinks.auth_user_id, actorUserId))
      .limit(1)
  )[0];
  if (!ownerIdentity) {
    return {
      ok: false,
      message: "イベント作成には認証ユーザーへ紐付いた X 名義が必要です。",
    };
  }
'''
              if duplicate not in text:
                  raise SystemExit("event duplicate anchor missing")
              text = text.replace(duplicate, owner_lookup, 1)
          for obsolete in (
              "    max_consecutive_slots_per_entry: data.max_consecutive_slots_per_entry,\n",
              "    representative_x_user_id: null,\n",
              "    public_api_updated_at: null,\n",
          ):
              text = text.replace(obsolete, "")
          row_anchor = "  } satisfies typeof events.$inferInsert;\n  const questions = buildQuestionRows(id, definitions, now);"
          if "const ownerRow" not in text:
              owner_row = '''  } satisfies typeof events.$inferInsert;
  const ownerRow = {
    id: generateId("es"),
    event_id: id,
    x_user_id: ownerIdentity.x_user_id,
    display_name: ownerIdentity.display_name,
    permission_preset: "owner" as const,
    custom_permission_keys_json: null,
    is_public: 1,
    public_role_label: "主催",
    approved_by_auth_user_id: actorUserId,
    approved_at: now,
    created_at: now,
    updated_at: now,
  } satisfies typeof eventStaff.$inferInsert;
  const questions = buildQuestionRows(id, definitions, now);'''
              if row_anchor not in text:
                  raise SystemExit("event owner row anchor missing")
              text = text.replace(row_anchor, owner_row, 1)
          text = text.replace(
              "    db.insert(events).values(createdRow),\n    ...insertChunks",
              "    db.insert(events).values(createdRow),\n    db.insert(eventStaff).values(ownerRow),\n    ...insertChunks",
              1,
          ).replace(
              "    1,\n    ...insertChunks.map",
              "    1,\n    1,\n    ...insertChunks.map",
              1,
          )
          audit_anchor = '''    {
      table_name: "events",
      target_id: id,
      operation: "CREATE",
      before: null,
      after: createdRow,
      actor_user_id: actorUserId,
      retention_class: "normal",
      strict: true,
    },
'''
          if 'context: "event-create:owner"' not in text:
              owner_audit = audit_anchor + '''    {
      table_name: "event_staff",
      target_id: ownerRow.id,
      operation: "CREATE",
      before: null,
      after: ownerRow,
      actor_user_id: actorUserId,
      context: "event-create:owner",
      reason: "イベント作成者をownerとして登録",
      retention_class: "long_audit",
      restore_strategy: "delete_created",
      strict: true,
    },
'''
              if audit_anchor not in text:
                  raise SystemExit("event owner audit anchor missing")
              text = text.replace(audit_anchor, owner_audit, 1)
          event_admin.write_text(text)

          for relative in (
              ".agent-trigger/final-candidate-fix",
              ".agent-artifact-run-id",
              ".tmp/integration-report.txt",
              ".github/workflows/export-pr-source-temp.yml",
              ".github/workflows/export-temp-source.yml",
              ".github/workflows/final-canonical-integration-v4.yml",
          ):
              Path(relative).unlink(missing_ok=True)
          PY

          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "最終統合候補のowner・チャプター・CI境界を修復"
          git push origin HEAD:agent/db-canonical-final-integration
