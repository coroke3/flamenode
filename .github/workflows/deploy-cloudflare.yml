name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_workers:
        description: Workers もデプロイする
        type: boolean
        default: true
      deploy_pages:
        description: Pages もデプロイする
        type: boolean
        default: true

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy-pages:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply Cloudflare resource IDs
        env:
          CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
        run: |
          if [ -n "$CF_IDS_JSON" ] || [ -f cloudflare/ids.json ]; then
            node scripts/sync-wrangler-ids.mjs
          else
            echo "CF_IDS_JSON / cloudflare/ids.json がありません。wrangler.toml の ID をそのまま使用します。"
          fi

      - name: Build for Cloudflare Pages
        run: npm run pages:build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: FlameNode

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=flamenode

  deploy-workers:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_workers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply Cloudflare resource IDs
        env:
          CF_IDS_JSON: ${{ secrets.CF_IDS_JSON }}
        run: |
          if [ -n "$CF_IDS_JSON" ] || [ -f cloudflare/ids.json ]; then
            node scripts/sync-wrangler-ids.mjs
          else
            echo "CF_IDS_JSON / cloudflare/ids.json がありません。wrangler.toml の ID をそのまま使用します。"
          fi

      - name: Deploy Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run workers:deploy
