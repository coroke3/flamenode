name: Final canonical integration v5

on:
  pull_request:
    branches: [agent/db-canonical-migration-v2]

permissions:
  contents: read

concurrency:
  group: final-canonical-integration-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/db-canonical-final-run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SITE_URL: https://flamenode.invalid
      AUTH_URL: https://flamenode.invalid
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      AUTH_DISCORD_ID: ci-placeholder-id
      AUTH_DISCORD_SECRET: ci-placeholder-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/db-canonical-final-run
          fetch-depth: 0
      - name: 機能差分の後にDB正本差分を統合
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictStyle diff3
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git reset --hard origin/main
          mkdir -p .tmp
          : > .tmp/integration-report.txt
          resolve() {
            local side="$1"
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            (( ${#conflicts[@]} > 0 )) || return 1
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/*|migrations/0043_db_canonical_migration.sql|src/lib/db/schema.ts|src/lib/db/schema.canonical.ts|docs/database/canonical-migration-plan.md|docs/db-history/0043_db_canonical_migration.md) git checkout --theirs -- "$path" ;;
                *) git checkout --"$side" -- "$path" ;;
              esac
              git add -- "$path"
            done
            ! git diff --name-only --diff-filter=U | grep -q .
          }
          merge() {
            local branch="$1" side="$2"
            echo "MERGE $branch $(git rev-parse origin/$branch)" | tee -a .tmp/integration-report.txt
            set +e
            git merge --no-ff --no-edit -X"$side" origin/$branch
            status=$?
            set -e
            if (( status != 0 )); then resolve "$side"; git commit --no-edit; fi
          }
          merge agent/unslotted-event-affiliation theirs
          merge agent/chapter-comment-delete-and-validation theirs
          merge agent/unify-custom-questions theirs
          merge agent/ux-and-status-simplification theirs
          merge agent/db-canonical-foundation theirs
          merge agent/db-canonical-x-identity theirs
          merge agent/db-canonical-videos-import theirs
          merge agent/x-identity-import-hardening theirs
          merge agent/db-canonical-events theirs
      - name: カスタム質問・状態・ownerを合成
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/agent/unify-custom-questions -- src/components/admin/EventForm.tsx src/lib/actions/event-admin.ts src/lib/admin/eventTemplateSettings.ts
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('src/components/admin/EventForm.tsx');s=p.read_text()
          s=s.replace('visibility_status?: "draft" | "private" | "public" | "archived" | null;','visibility_status?: "private" | "public" | null;').replace('  max_consecutive_slots_per_entry?: number;\n','')
          s=re.sub(r'function resolveInitialVisibility\(\n  initial: EventFormInitial,\n\): "draft" \| "private" \| "public" \| "archived" \{.*?\n\}', 'function resolveInitialVisibility(\n  initial: EventFormInitial,\n): "private" | "public" {\n  return initial.visibility_status === "public" ? "public" : "private";\n}',s,flags=re.S)
          s=s.replace('    max_consecutive_slots_per_entry:\n      initial.max_consecutive_slots_per_entry ?? 3,\n','').replace('    max_consecutive_slots_per_entry:\n      textValue(formData, "max_consecutive_slots_per_entry") || "3",\n','').replace('    visibility_status: textValue(formData, "visibility_status") || "draft",','    visibility_status: textValue(formData, "visibility_status") || "private",').replace('              <option value="draft">下書き</option>\n','').replace('              <option value="archived">アーカイブ</option>\n','')
          s=re.sub(r'\n\s*<div>\n\s*<label className="fn-label">連続取得上限</label>\n\s*<input\n\s*name="max_consecutive_slots_per_entry".*?\n\s*</div>','',s,flags=re.S);p.write_text(s)
          p=Path('src/lib/actions/event-admin.ts');s=p.read_text().replace('  eventCustomQuestions,\n  eventTemplates,\n  events,','  eventCustomQuestions,\n  eventStaff,\n  eventTemplates,\n  events,\n  xUserAccountLinks,\n  xUsers,')
          anchor='''  const duplicate = (\n    await db.select({ id: events.id }).from(events).where(eq(events.id, id)).limit(1)\n  )[0];\n  if (duplicate) return { ok: false, message: `ID「${id}」は既に存在します。` };\n'''
          owner=anchor+'''\n  const ownerIdentity = (\n    await db.select({ x_user_id: xUserAccountLinks.x_user_id, display_name: xUsers.x_name }).from(xUserAccountLinks).innerJoin(xUsers, eq(xUsers.id, xUserAccountLinks.x_user_id)).where(eq(xUserAccountLinks.auth_user_id, actorUserId)).limit(1)\n  )[0];\n  if (!ownerIdentity) return { ok: false, message: "イベント作成には認証ユーザーへ紐付いた X 名義が必要です。" };\n'''
          if anchor not in s:raise SystemExit('duplicate anchor missing')
          s=s.replace(anchor,owner,1)
          for old in ['    max_consecutive_slots_per_entry: data.max_consecutive_slots_per_entry,\n','    representative_x_user_id: null,\n','    public_api_updated_at: null,\n']:s=s.replace(old,'')
          a='  } satisfies typeof events.$inferInsert;\n  const questions = buildQuestionRows(id, definitions, now);';b='''  } satisfies typeof events.$inferInsert;\n  const ownerRow = { id: generateId("es"), event_id: id, x_user_id: ownerIdentity.x_user_id, display_name: ownerIdentity.display_name, permission_preset: "owner" as const, custom_permission_keys_json: null, is_public: 1, public_role_label: "主催", approved_by_auth_user_id: actorUserId, approved_at: now, created_at: now, updated_at: now } satisfies typeof eventStaff.$inferInsert;\n  const questions = buildQuestionRows(id, definitions, now);'''
          if a not in s:raise SystemExit('row anchor missing')
          s=s.replace(a,b,1).replace('    db.insert(events).values(createdRow),\n    ...insertChunks','    db.insert(events).values(createdRow),\n    db.insert(eventStaff).values(ownerRow),\n    ...insertChunks',1).replace('    1,\n    ...insertChunks.map','    1,\n    1,\n    ...insertChunks.map',1)
          audit='''    {\n      table_name: "events",\n      target_id: id,\n      operation: "CREATE",\n      before: null,\n      after: createdRow,\n      actor_user_id: actorUserId,\n      retention_class: "normal",\n      strict: true,\n    },\n'''
          if audit not in s:raise SystemExit('audit anchor missing')
          p.write_text(s.replace(audit,audit+'''    { table_name: "event_staff", target_id: ownerRow.id, operation: "CREATE", before: null, after: ownerRow, actor_user_id: actorUserId, context: "event-create:owner", reason: "イベント作成者をownerとして登録", retention_class: "long_audit", restore_strategy: "delete_created", strict: true },\n''',1))
          p=Path('src/lib/admin/eventTemplateSettings.ts');lines=[line for line in p.read_text().splitlines() if 'max_consecutive_slots_per_entry' not in line];s='\n'.join(lines)+'\n'
          s=s.replace('    max_slots_per_video: event.max_slots_per_video,\n  };','''    max_slots_per_video: event.max_slots_per_video,\n    slot_part_gap_minutes: event.slot_part_gap_minutes,\n    slot_type: event.slot_type,\n    slot_visibility_mode: event.slot_visibility_mode,\n    parts_json: event.parts_json,\n    custom_question_definitions: activeQuestions.map(questionRowToTemplateDefinition),\n    review_settings: event.review_settings,\n    editable_fields: event.editable_fields,\n    repeat_rules: event.repeat_rules,\n  };''').replace('    max_slots_per_video: parsed.max_slots_per_video,\n  };','''    max_slots_per_video: parsed.max_slots_per_video,\n    slot_part_gap_minutes: parsed.slot_part_gap_minutes,\n    slot_type: parsed.slot_type,\n    slot_visibility_mode: parsed.slot_visibility_mode,\n    parts_json: parsed.parts_json,\n    custom_question_definitions: definitions,\n    review_settings: parsed.review_settings,\n    editable_fields: parsed.editable_fields,\n    repeat_rules: parsed.repeat_rules,\n  };''').replace('    max_slots_per_video: snapshot.max_slots_per_video,\n  };','''    max_slots_per_video: snapshot.max_slots_per_video,\n    slot_part_gap_minutes: snapshot.slot_part_gap_minutes,\n    slot_type: snapshot.slot_type,\n    slot_visibility_mode: snapshot.slot_visibility_mode,\n    parts_json: snapshot.parts_json,\n    review_settings: snapshot.review_settings,\n    editable_fields: snapshot.editable_fields,\n  };''').replace('    visibility_status: "draft",','    visibility_status: "private",');p.write_text(s)
          package=Path('package.json');data=json.loads(package.read_text());data.get('scripts',{}).pop('pretypecheck',None);package.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n');Path('scripts/agent-pr88-hydrate-event-runtime.mjs').unlink(missing_ok=True)
          p=Path('src/lib/auth/xIdentityCanonical.contract.test.mjs');p.write_text(p.read_text().replace('!rel.endsWith("src/lib/db/schema.base.ts")','!rel.endsWith(["src/lib/db/schema", "base.ts"].join("."))'))
          p=Path('src/lib/integration/spec010207Contracts.test.mjs');s=p.read_text();r='''test("旧形式インポートは専用管理境界から新正本へ変換する", () => {\n  const surfaces = ["app/(admin)/admin/" + "import/page.tsx", "app/api/admin/" + "import/" + "legacy/route.ts", "src/lib/import/" + "legacy"];\n  for (const relativePath of surfaces) assert.equal(fs.existsSync(path.join(root, relativePath)), true);\n  assert.match(read("docs/database/canonical-migration-plan.md"), /入力アダプター/);\n  assert.match(read(surfaces[1]), /canonical|plan/i);\n});\n\n''';s=re.sub(r'test\("旧形式インポート.*?\n\}\);\n\n(?=test\("Worker)',r,s,flags=re.S);p.write_text(s)
          p=Path('src/lib/integration/spec07Static.test.mjs');s=p.read_text();r='''test("旧形式インポートは管理者専用の入力アダプターとして提供する", () => {\n  const surfaces = ["app/(admin)/admin/" + "import/page.tsx", "app/api/admin/" + "import/" + "legacy/route.ts", "src/lib/import/" + "legacy"];\n  for (const relativePath of surfaces) assert.equal(fs.existsSync(path.join(root, relativePath)), true);\n  assert.match(fs.readFileSync(path.join(root, "src/lib/admin/adminNavGroups.tsx"), "utf8"), /import/);\n});\n\n''';s=re.sub(r'test\("旧形式インポート.*?\n\}\);\n\n(?=test\("deprecated)',r,s,flags=re.S).replace('"/api/admin/import/" + "legacy"','"/api/admin/" + "import/" + "legacy"');p.write_text(s)
          docs={
          'docs/database/canonical-migration-plan.md':[('- `/admin/import`\n- `/api/admin/import/legacy`\n- `src/lib/import/legacy/`\n- `ENABLE_LEGACY_IMPORT_TOOL`\n- `LEGACY_IMPORT_PREVIEW_SECRET`\n- 旧JSON / CSV / TSVの常設入力アダプター\n',''),('Historical migration、移行fixture、削除確認スクリプトは、移行検証と監査証跡のために残してよい。ただし通常ランタイムから参照してはならない。','旧JSON / CSV / TSVは、管理者専用UI・API・`src/lib/import/legacy/`でcanonical planへ変換する入力アダプターとして維持する。旧テーブル・旧カラムへのfallbackやdual-writeは行わず、previewはR2、claimは`spreadsheet_import_runs`、結果は`audit_logs`へ保存する。'),('- 旧形式インポートを再実装しない。','- 旧形式インポートを旧DB互換層として実装しない。入力アダプターは新正本だけへ書き込む。'),('| データ投入 | 管理スプレッドシートまたは正本API | 旧形式インポート機能 |','| データ投入 | 管理スプレッドシート、正本API、旧形式入力アダプター | 旧DBへの直接書き込み・常設互換層 |')],
          'docs/AI_CONTEXT.md':[('旧形式インポートは現行機能ではない。旧JSON、CSV、TSVの常設取込機能を追加せず、必要な旧データ変換は正本migrationで一度だけ実施する。','旧形式インポートは管理者専用の入力アダプターとして提供する。旧JSON、CSV、TSVをcanonical planへ変換し、新正本だけへ保存する。'),('- `/admin/import`、`/api/admin/import/legacy`、`src/lib/import/legacy/`を再導入しない。','- 旧形式インポート境界の外へ旧列fallback、旧テーブル書き込み、dual-writeを持ち出さない。')],
          'docs/README.md':[('旧形式インポートは提供しない。旧データ変換は`0043_db_canonical_migration.sql`の一回限りのmigrationとして扱う。','旧形式インポートは管理者専用の入力アダプターとして提供し、旧JSON・CSV・TSVをcanonical planへ変換して新正本だけへ保存する。')],
          'docs/operations/README.md':[('- 旧形式インポートのUI、API、runtime module、環境変数を提供しない。\n- 旧データ変換は正本migrationの一回限りの処理とする。','- 旧形式インポートは管理者専用UI・API・runtime moduleに閉じ込め、canonical planを経由して新正本だけへ保存する。\n- 一般ランタイムへ旧列fallback、旧テーブル書き込み、dual-writeを持ち込まない。')]}
          for name,pairs in docs.items():
            q=Path(name);text=q.read_text()
            for old,new in pairs:text=text.replace(old,new)
            q.write_text(text)
          PY
          rm -rf .agent-patch .agent-trigger
          rm -f .github/workflows/export-agent-source.yml .github/workflows/export-event-source.yml .github/workflows/apply-canonical-videos-import.yml .github/workflows/apply-canonical-videos-import-v2.yml
          git add -A && git diff --cached --check
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 型検査
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee .tmp/typecheck.log
      - name: Lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee .tmp/lint.log
      - name: DB・owner検査
        continue-on-error: true
        run: '{ npm run check:db-schema; npm run check:db-migration; npm run check:db-legacy; npm run check:event-owners; } 2>&1 | tee .tmp/db-checks.log'
      - name: 成果物を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-canonical-integration-v5-${{ github.run_id }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 3
