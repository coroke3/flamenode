<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>お知らせ編集</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0;background:#000} .seg{display:inline-flex}.seg label{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;background:var(--surface-subtle);color:var(--ink-muted);font-size:14px;cursor:pointer}.seg input{position:absolute;opacity:0}.seg label.on{background:var(--ink);color:var(--bg)}</style>
</helmet>
<div class="p-root" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <div class="c-side"><dc-import name="AdminNav" active="announcements" hint-size="100%,1240px"></dc-import></div>
  <main class="c-main">
    <a href="AdminAnnouncements.dc.html" class="il t-sm muted"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>お知らせ一覧</a>
    <div class="c-head" style="margin-top: 8px;">
      <h1 class="t-display">お知らせ編集</h1>
      <div class="row" style="gap: 0;"><a href="AdminAuditHub.dc.html" class="ib" aria-label="監査ログ"><i class="fa-solid fa-clock-rotate-left"></i></a><a href="ConfirmModal.dc.html" class="ib" aria-label="お知らせを削除"><i class="fa-regular fa-trash-can"></i></a></div>
    </div>
    <div class="split">
      <form class="main form" onSubmit="{{prevent}}">
        <x-import component-from-global-scope="FlameNode.TextField" label="タイトル *" default-value="10/12 02:00–04:00 メンテナンス"></x-import>
        <div class="row md-tools" role="toolbar" aria-label="書式"><button type="button" class="ib sm" aria-label="太字"><i class="fa-solid fa-bold"></i></button><button type="button" class="ib sm" aria-label="リンク"><i class="fa-solid fa-link"></i></button><button type="button" class="ib sm" aria-label="箇条書き"><i class="fa-solid fa-list-ul"></i></button><span class="t-sm muted" style="margin-left: 8px;">URLを貼るとリンクになります</span></div>
        <x-import component-from-global-scope="FlameNode.TextField" label="本文 (Markdown) *" multiline="{{yes}}" default-value="サーバーのメンテナンスを行います。&#10;作業中は投稿・枠確保ができません。"></x-import>
        <div class="field"><span>重要度</span><div class="seg" role="radiogroup" aria-label="重要度"><label><input type="radio" name="sev"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>お知らせ</label><label><input type="radio" name="sev"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>注意</label><label class="on"><input type="radio" name="sev" checked="{{yes}}"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>重要</label></div></div>
        <div class="field"><span>対象</span><div class="seg" role="radiogroup" aria-label="対象"><label class="on"><input type="radio" name="aud" checked="{{yes}}"><i class="fa-solid fa-users" aria-hidden="true"></i>全員</label><label><input type="radio" name="aud"><i class="fa-solid fa-pen-nib" aria-hidden="true"></i>クリエイター</label><label><input type="radio" name="aud"><i class="fa-solid fa-crown" aria-hidden="true"></i>管理者</label></div></div>
        <div class="field"><span>掲載期間</span><div class="prow"><input class="dinput t-num" value="2026/10/05 00:00" aria-label="掲載開始"><span class="muted">→</span><input class="dinput t-num" value="2026/10/12 04:00" aria-label="掲載終了"><span class="wrap-row" style="gap: 2px;"><button type="button" class="chip">今すぐ</button><button type="button" class="chip on">1週間</button><button type="button" class="chip">終了なし</button></span></div><span class="t-sm muted" style="margin-top: 4px;">「10/12 4時」のような短い入力も読み取ります</span></div>
        <x-import component-from-global-scope="FlameNode.Checkbox" label="公開する(オフで下書き)"></x-import>
        <div class="row" style="gap: 8px;"><button type="submit" class="fn-btn fn-btn--primary">保存</button><span class="il t-sm muted"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>新規作成時は「作成」</span></div>
      </form>
      <aside class="side">
        <h2 class="il t-label muted" style="margin: 0 0 10px;"><i class="fa-solid fa-eye" aria-hidden="true"></i>表示プレビュー</h2>
        <div class="notice"><i class="fa-solid fa-circle-exclamation" aria-hidden="true" style="color: var(--danger); padding-top: 4px;"></i><span class="stack" style="gap: 2px;"><span>10/12 02:00–04:00 メンテナンス</span><span class="t-sm muted">サーバーのメンテナンスを行います。作業中は投稿・枠確保ができません。</span></span></div>
      </aside>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark', yes: true, prevent: (e) => e.preventDefault() }; }
}
</script>
</body>
</html>
