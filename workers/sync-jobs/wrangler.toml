name = "flamenode-sync-jobs"
main = "index.ts"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

# 現行のCloudflare上限は運用文書の公式リンクを正本とする。
# 7/22/37分はmetadata・score、52分は設定済みイベントのplaylist同期に分離する。
[triggers]
crons = ["7,22,37,52 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "flamenode_db"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

[vars]
# Google Cloud Consoleの1日quota。FlameNode全体で80%まで使用する。
YOUTUBE_DAILY_QUOTA_LIMIT = "10000"
# Secrets:
# - YOUTUBE_API_KEY
# - YOUTUBE_OAUTH_CLIENT_ID
# - YOUTUBE_OAUTH_CLIENT_SECRET
# - YOUTUBE_OAUTH_REFRESH_TOKEN
