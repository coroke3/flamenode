<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>全イベント管理</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fn.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="ds/flamenode/components/bundle.css">
<script src="ds/flamenode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:900;font-display:block;src:url("/_blob/e1b2acd2ddb6c6ef8a2628083a3dee18") format("woff2")}
@font-face{font-family:"Font Awesome 6 Free";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/4f51ad00912829d7c0531a7d81ec8ce6") format("woff2")}
@font-face{font-family:"Font Awesome 6 Brands";font-style:normal;font-weight:400;font-display:block;src:url("/_blob/a1bab24d40f4d7535290494cddfa132d") format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("/_blob/95c94be75698a120789b2f605087cf65") format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-display:swap;src:url("/_blob/415003f31448401e8d02e499fd68afc2") format("woff2")}
@font-face{font-family:"FlameNode Sans";font-weight:400 700;font-display:swap;src:url("/_blob/3078d2f682e1734e5b2022850e88ec9f") format("opentype")}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<style>body{margin:0;background:#000}</style>
</helmet>
<div class="{{rootCls}}" data-theme="{{theme}}" lang="ja">
<div class="c-layout">
  <sc-if value="{{full}}" hint-placeholder-val="{{false}}"><div class="c-side"><dc-import name="AdminNav" active="events" hint-size="100%,1240px"></dc-import></div></sc-if>
  <main class="c-main">
    <div class="c-head">
      <div><sc-if value="{{full}}" hint-placeholder-val="{{false}}"><h1 class="t-display">イベント</h1></sc-if><p class="muted">イベントの作成・公開設定・運営メンバー管理を行います。</p></div>
      <a href="ManageEventNew.dc.html" class="fn-btn fn-btn--primary"><i class="fa-solid fa-plus" aria-hidden="true"></i>新規イベント</a>
    </div>
    <sc-if value="{{full}}" hint-placeholder-val="{{false}}"><nav class="subnav" aria-label="イベント管理メニュー" style="margin-bottom: 24px;">
      <a href="AdminEventsHub.dc.html" class="il" aria-current="page"><i class="fa-solid fa-list" aria-hidden="true"></i>イベント一覧</a>
      <a href="AdminEventsHub.dc.html" class="il"><i class="ms ms-account_tree" aria-hidden="true"></i>グループ</a>
      <a href="AdminEventsHub.dc.html" class="il"><i class="fa-regular fa-clone" aria-hidden="true"></i>テンプレート</a>
    </nav></sc-if>
    <div class="wrap-row" style="gap: 8px; margin-bottom: 16px;">
      <div class="field-i" style="width: 280px;"><x-import component-from-global-scope="FlameNode.TextField" type="search" aria-label="検索" placeholder="タイトル / ID で検索"></x-import><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></div>
      <span class="sel-i"><i class="fa-solid fa-filter" aria-hidden="true"></i><select class="select i" aria-label="絞り込み"><option>全イベント</option><option>公開のみ</option><option>非公開のみ</option><option>受付中のみ</option></select></span>
      <span class="sel-i"><i class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i><select class="select i" aria-label="並び替え"><option>開催日 新→旧</option><option>開催日 旧→新</option><option>開催日 早い順</option></select></span>
    </div>
    <div class="t-scroll">
      <div class="dt" style="--cols: minmax(220px,1.6fr) minmax(160px,1fr) 120px 92px 96px 112px; --minw: 900px;">
        <div class="dt-h"><span>イベント名</span><span>期間</span><span>状態</span><span>公開</span><span class="num">作品</span><span></span></div>
        <sc-for list="{{events}}" as="e" hint-placeholder-count="8">
          <div class="dt-r">
            <a href="ManageEvent.dc.html" class="row" style="gap: 10px; min-width: 0;"><img class="ev-icon" src="{{e.icon}}" alt="" style="width: 28px; height: 28px;"><span class="stack" style="min-width: 0;"><span class="ell">{{e.name}}</span><span class="sub t-mono">{{e.id}}</span></span></a>
            <span class="t-num t-sm">{{e.period}}</span>
            <span class="st"><span class="{{e.dot}}"></span>{{e.state}}</span>
            <span class="il t-sm"><i class="{{e.visIcon}}" aria-hidden="true"></i>{{e.vis}}</span>
            <span class="num">{{e.n}}</span>
            <span class="row" style="gap: 0; justify-content: flex-end;"><a href="EventDetail.dc.html" class="ib sm" aria-label="公開ページ"><i class="fa-solid fa-arrow-up-right-from-square"></i></a><a href="AdminAuditHub.dc.html" class="ib sm" aria-label="このイベントの監査ログ"><i class="fa-solid fa-clock-rotate-left"></i></a><a href="ManageEvent.dc.html" class="ib sm" aria-label="運営画面"><i class="fa-solid fa-arrow-right"></i></a></span>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embed":{"editor":"boolean","default":true},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const r = this.__emb();
    const emb = this.props.embed ?? true;
    r.full = !emb; r.rootCls = emb ? 'p-root emb-root' : 'p-root';
    return r;
  }
  __emb() {
    const T = ['/_blob/6ecfc7b6882f277d815f563e873f25ee','/_blob/f5c1a8af077b887c7bb1d043f3cf69c1','/_blob/525c7209e503b8327cbd5bf4a64e5fc8','/_blob/191c3939aefb326fc04fd3ccf6db83a9'];
    const E = [
      ['PVSF2026S', 'PVSF2026S', '2026.11.03 – 11.04', 'recruit', 'public', 94],
      ['PVSF2026Sp', 'PVSF2026Sp', '2026.03.27 – 03.29', 'done', 'public', 73],
      ['PVSF2025S', 'PVSF2025S', '2025.08.29 – 08.31', 'done', 'public', 75],
      ['PVSF2025Sp', 'PVSF2025Sp', '2025.03.29 – 03.30', 'done', 'public', 66],
      ['夏休み創作島　創作島合作', 'SummerIsland', '2024.12.15', 'done', 'public', 1],
      ['PVSF2024GW', 'PVSF2024GW', '2024.05.05', 'done', 'public', 29],
      ['年越し合作', 'toshikoshi', '2022.12.31', 'done', 'public', 1],
      ['PVSF2027Sp(準備中)', 'PVSF2027Sp', '未設定', 'before', 'private', 0]
    ];
    const S = { recruit: ['受付中', 'dot ok'], done: ['終了', 'dot'], before: ['準備中', 'dot info'] };
    return {
      theme: this.props.theme ?? 'dark',
      events: E.map((e, i) => ({ name: e[0], id: e[1], period: e[2], state: S[e[3]][0], dot: S[e[3]][1], vis: e[4] === 'public' ? '公開' : '非公開', visIcon: e[4] === 'public' ? 'fa-solid fa-globe' : 'fa-solid fa-lock', n: e[5], icon: T[i % 4] }))
    };
  }
}
</script>
</body>
</html>
